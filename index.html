<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>Train and Sweat... Until It's Done!</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
@font-face { font-family: 'DoomRight2'; src: url('https://raw.githubusercontent.com/jfpeal00-sys/training-dashboard/main/DoomRight2.ttf') format('truetype'); }
:root {
  --a1:#ff6b1a;--a2:#ff2020;--a3:#39ff6e;--a4:#ffa020;--a5:#ff4500;--wt:#d4820a;
  --bg:#000;--card:rgba(255,255,255,0.04);--border:rgba(255,255,255,0.08);
  --text:#e8f0fe;--muted:#8a9bb0;
  --fh:'Barlow Condensed',sans-serif;--fb:'Barlow',sans-serif;--fm:'DM Mono',monospace;
}

body.light-mode {
  --bg:#f0f2f5;--card:rgba(255,255,255,0.9);--border:rgba(0,0,0,0.10);
  --text:#1a1a2e;--muted:#6b7280;--wt:#d4820a;
}
body.light-mode #bg-img { opacity:.06; }
body.light-mode .tb { color: #555; }
body.light-mode .tb.on { color: var(--a1); }

#pr-overlay{position:fixed;inset:0;z-index:9999;pointer-events:none;display:none;}
#pr-overlay.on{display:block;pointer-events:all;}
.pr-tint{position:fixed;inset:0;background:rgba(0,0,0,.55);animation:pr-fade-in .25s ease forwards;z-index:9999;}
@keyframes pr-fade-in{from{opacity:0}to{opacity:1}}
.pr-glow{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);width:300px;height:300px;
  background:radial-gradient(circle,rgba(255,107,26,.45) 0%,rgba(255,50,0,.2) 40%,transparent 70%);
  border-radius:50%;animation:pr-glow-in .35s ease-out forwards;z-index:10000;}
@keyframes pr-glow-in{from{opacity:0;transform:translate(-50%,-50%) scale(.3)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.pr-doomguy{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);
  width:210px;height:210px;z-index:10002;pointer-events:none;image-rendering:pixelated;
  animation:pr-doom-pop .4s cubic-bezier(.175,.885,.32,1.275) .05s both;}
@keyframes pr-doom-pop{from{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-10deg)}to{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0deg)}}
.pr-banner{position:fixed;top:68%;left:50%;transform:translateX(-50%);z-index:10003;
  text-align:center;pointer-events:none;width:290px;
  animation:pr-banner-rise .4s cubic-bezier(.175,.885,.32,1.275) .2s both;}
@keyframes pr-banner-rise{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.pr-title{font-family:var(--fh);font-size:44px;font-weight:900;letter-spacing:3px;text-transform:uppercase;
  color:#ff6b1a;line-height:1;text-shadow:0 0 24px rgba(255,107,26,.9),0 0 50px rgba(255,107,26,.4);margin-bottom:8px;}
.pr-sub{font-family:var(--fm);font-size:11px;color:rgba(255,200,100,.95);letter-spacing:2px;text-transform:uppercase;
  background:rgba(0,0,0,.7);padding:5px 14px;border-radius:20px;border:1px solid rgba(255,107,26,.4);display:inline-block;}
.pr-dismiss{position:fixed;bottom:8%;left:50%;transform:translateX(-50%);
  font-family:var(--fm);font-size:10px;color:rgba(255,255,255,.4);letter-spacing:2px;
  z-index:10004;pointer-events:none;animation:pr-blink 1s ease .8s infinite alternate;}
@keyframes pr-blink{from{opacity:.35}to{opacity:.7}}
.pr-scan{position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.08) 2px,rgba(0,0,0,.08) 4px);
  z-index:10005;pointer-events:none;animation:pr-scan-flash .3s ease forwards;}
@keyframes pr-scan-flash{0%{opacity:.6}100%{opacity:0}}
.confetti-p{position:fixed;width:8px;height:8px;border-radius:2px;pointer-events:none;animation:confetti-fall linear forwards;}
@keyframes confetti-fall{0%{opacity:1;transform:translateY(0) rotate(0deg);}100%{opacity:0;transform:translateY(100vh) rotate(720deg);}}

#monthly-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:8000;display:none;align-items:center;justify-content:center;padding:16px;}
#monthly-overlay.on{display:flex;}
#monthly-modal{background:#111;border:1px solid rgba(255,107,26,.4);border-radius:20px;padding:20px;max-width:340px;width:100%;max-height:85vh;overflow-y:auto;animation:pr-pop .35s cubic-bezier(.175,.885,.32,1.275) forwards;}
.mm-title{font-family:var(--fh);font-size:22px;font-weight:900;color:var(--a1);letter-spacing:1px;margin-bottom:4px;}
.mm-sub{font-family:var(--fm);font-size:10px;color:var(--muted);margin-bottom:16px;text-transform:uppercase;letter-spacing:1px;}
.mm-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.mm-stat{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px;text-align:center;}
.mm-stat-v{font-family:var(--fh);font-size:20px;font-weight:900;}
.mm-stat-k{font-family:var(--fm);font-size:9px;color:var(--muted);margin-top:2px;}
.mm-close{width:100%;padding:10px;background:rgba(255,107,26,.2);border:1px solid var(--a1);border-radius:10px;color:var(--a1);font-family:var(--fh);font-size:14px;font-weight:700;letter-spacing:1px;cursor:pointer;margin-top:8px;}
.ach-ico{width:20px;height:20px;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;display:block;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--fb);min-height:100vh;padding-bottom:60px}
#bg-img{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;object-position:center top;opacity:.15;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;max-width:640px;margin:0 auto}
#header{background:linear-gradient(180deg,rgba(255,107,26,.12) 0%,transparent 100%);border-bottom:1px solid rgba(255,107,26,.2);padding:22px 20px 16px;text-align:center}
#header h1{display:none}
#header .sub{color:var(--muted);font-family:var(--fm);font-size:10px;margin-bottom:14px}
#hstats{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.hs{text-align:center}
.hs-v{font-family:var(--fh);font-weight:700;font-size:18px}
.hs-l{color:var(--muted);font-family:var(--fm);font-size:8px;text-transform:uppercase;letter-spacing:1px}
#tabs{display:flex;border-bottom:1px solid var(--border);padding:0 10px;overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tb{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);padding:6px 8px;font-family:var(--fh);font-size:9px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;white-space:nowrap;transition:all .2s;display:inline-flex;}
.tb.on{color:var(--a1);border-bottom-color:var(--a1)}
#content{padding:16px 14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.sl{color:var(--muted);font-family:var(--fm);font-size:9px;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid rgba(255,255,255,.06);padding-bottom:4px;margin:12px 0 8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
label{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px;font-family:var(--fm);display:block;margin-bottom:4px}
input,select{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:10px;color:var(--text);padding:10px 14px;font-size:14px;font-family:var(--fm);width:100%;outline:none;transition:border-color .2s}
input:focus{border-color:var(--a1)}
.bp{background:linear-gradient(135deg,rgba(255,107,26,.15),rgba(255,107,26,.3));border:1px solid var(--a1);border-radius:12px;color:var(--a1);padding:12px;font-family:var(--fh);font-size:15px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;width:100%;transition:all .2s;margin-top:4px}
.bg2{background:transparent;border:1px solid rgba(255,255,255,.15);border-radius:12px;color:var(--muted);padding:10px;font-family:var(--fh);font-size:14px;font-weight:600;cursor:pointer;width:100%;margin-top:6px}
.stabs{display:flex;gap:8px;margin-bottom:12px}
.stb{flex:1;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:var(--muted);padding:8px 0;font-family:var(--fh);font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;text-align:center;transition:all .18s}
.stb.on{background:rgba(255,107,26,.12);color:var(--a1);box-shadow:0 0 8px rgba(255,107,26,.2)}
.sc{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:14px;padding:13px;margin-bottom:10px}
.sh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:9px}
.sd{font-family:var(--fh);font-weight:700;font-size:16px;color:var(--a1)}
.sm{color:var(--muted);font-family:var(--fm);font-size:10px;margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:7px;border-radius:8px;padding:5px 11px;margin-bottom:6px;font-family:var(--fh)}
.bv{font-weight:700;font-size:17px}
.bu{color:var(--muted);font-family:var(--fm);font-size:9px}
.sm2{background:rgba(255,255,255,.03);border-radius:7px;padding:6px 9px}
.sl2{color:var(--muted);font-size:8px;font-family:var(--fm);text-transform:uppercase}
.sv{font-family:var(--fh);font-weight:700;font-size:14px}
.ab{display:flex;gap:7px}
.ib{background:none;border:none;cursor:pointer;font-size:14px;padding:2px}
.cfd{text-align:center;padding:8px}
.cfd p{color:var(--a2);font-family:var(--fm);font-size:12px;margin-bottom:10px}
.cfdb{display:flex;gap:10px;justify-content:center}
.bda{background:rgba(255,32,32,.2);border:1px solid var(--a2);border-radius:8px;color:var(--a2);padding:7px 18px;cursor:pointer;font-family:var(--fh);font-size:13px;font-weight:700}
.bca{background:transparent;border:1px solid rgba(255,255,255,.15);border-radius:8px;color:var(--muted);padding:7px 18px;cursor:pointer;font-family:var(--fh);font-size:13px}
.cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cal-n{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:8px;color:var(--text);padding:6px 14px;cursor:pointer;font-size:16px}
.cal-t{font-family:var(--fh);font-weight:700;font-size:20px;color:var(--a1);letter-spacing:1px;text-transform:uppercase}
.cal-leg{display:flex;gap:16px;justify-content:center;margin-bottom:12px}
.cal-li{display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dn{text-align:center;color:var(--muted);font-family:var(--fm);font-size:9px;text-transform:uppercase;padding-bottom:4px}
.cal-c{border:1px solid transparent;border-radius:10px;padding:6px 2px;text-align:center;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;transition:all .15s}
.cal-c.hs2{cursor:pointer;background:rgba(255,255,255,.05)}
.cal-c.sel{background:rgba(255,107,26,.15)!important;border-color:var(--a1)!important}
.cal-dots{display:flex;gap:3px;justify-content:center;min-height:12px}
.cal-num{font-family:var(--fh);font-size:16px;line-height:1}
.cal-cnt{font-family:var(--fm);font-size:8px;color:var(--muted)}
.cal-det{background:rgba(255,107,26,.06);border:1px solid rgba(255,107,26,.3);border-radius:14px;padding:14px 16px;margin-top:12px}
.hb-bg{background:rgba(255,255,255,.06);border-radius:99px;height:8px;overflow:hidden;margin-top:8px}
.hb-f{height:100%;border-radius:99px;transition:width .6s ease}
.rr{display:flex;align-items:center;gap:10px;border-radius:9px;padding:7px 10px;cursor:pointer;transition:all .15s;margin-bottom:4px}
.rd{border-radius:0 0 10px 10px;padding:10px 12px;margin-top:-4px;margin-bottom:4px}
.stc{background:rgba(255,255,255,.04);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.stc-l{color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:1.2px;font-family:var(--fm)}
.stc-v{font-family:var(--fh);font-weight:700;font-size:22px}
.stc-u{color:var(--muted);font-size:10px;font-family:var(--fm);font-weight:400;margin-left:3px}
.cw{margin-bottom:18px}
.cl{color:var(--muted);font-family:var(--fm);font-size:9px;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.pc{background:rgba(255,69,0,.1);border:1px solid rgba(255,69,0,.3);border-radius:10px;padding:8px 14px;font-family:var(--fm);font-size:12px;color:var(--a5);margin-bottom:4px}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-family:var(--fm);font-size:13px}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(57,255,110,.15);border:1px solid var(--a3);border-radius:12px;color:var(--a3);padding:10px 20px;font-family:var(--fh);font-size:14px;font-weight:700;letter-spacing:1px;z-index:999;opacity:0;transition:all .3s;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:4px}


/* ═══ Hellfire Particles ═══ */
.s1-particles{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.hf-particle{
  position:absolute;
  width:2px;height:6px;
  background:linear-gradient(180deg,transparent,#ff6b1a);
  border-radius:50% 50% 0 0;
  animation:hf-rise var(--dur,3s) linear var(--delay,0s) infinite;
  left:var(--x,50%);
  bottom:0;
  opacity:.9;
  box-shadow:0 0 5px 1px rgba(255,69,0,.7);
}
.hf-particle.big{width:3px;height:9px;background:linear-gradient(180deg,transparent,#ffaa20);border-radius:50% 50% 0 0;box-shadow:0 0 8px 2px rgba(255,150,0,.6);}
.hf-particle.tiny{width:1px;height:4px;background:linear-gradient(180deg,transparent,#ff8800);border-radius:50% 50% 0 0;box-shadow:0 0 3px 1px rgba(255,136,0,.5);}
@keyframes hf-rise{
  0%  {bottom:0;   opacity:.9;transform:translateX(0px)   scaleY(1);}
  20% {opacity:.8; transform:translateX(3px)  scaleY(.9);}
  50% {opacity:.6; transform:translateX(-2px) scaleY(.7);}
  80% {opacity:.3; transform:translateX(2px)  scaleY(.4);}
  100%{bottom:480px;opacity:0; transform:translateX(0px)  scaleY(0);}
}
#header{position:relative;}
/* ␀␀ Hellfire title animation ␀␀ */
@keyframes hellfire-glow{
  0%  {filter:drop-shadow(0 0 10px rgba(255,107,26,.85)) drop-shadow(0 0 22px rgba(255,69,0,.55)) drop-shadow(0 0 40px rgba(255,0,0,.2));}
  33% {filter:drop-shadow(0 0 16px rgba(255,140,20,1))   drop-shadow(0 0 32px rgba(255,80,0,.7))  drop-shadow(0 0 60px rgba(255,30,0,.35)) drop-shadow(0 2px 8px rgba(255,200,50,.15));}
  66% {filter:drop-shadow(0 0 12px rgba(255,90,10,.9))   drop-shadow(0 0 26px rgba(255,50,0,.6))  drop-shadow(0 0 50px rgba(200,0,0,.3));}
  100%{filter:drop-shadow(0 0 14px rgba(255,120,26,.9))  drop-shadow(0 0 28px rgba(255,69,0,.6))  drop-shadow(0 0 55px rgba(255,10,0,.25));}
}
@keyframes hellfire-flicker{
  0%,100%{opacity:1;}
  92%    {opacity:1;}
  93%    {opacity:.92;}
  94%    {opacity:1;}
  97%    {opacity:.95;}
  98%    {opacity:1;}
}
.doom-title{
  animation: hellfire-glow 3s ease-in-out infinite alternate, hellfire-flicker 6s linear infinite;
}
/* ── Animated spinning border ─────────────────── */
@keyframes spin-border{to{--angle:360deg}}
@property --angle{syntax:'<angle>';initial-value:0deg;inherits:false}

.ab{position:relative;border:none!important;background:var(--card);border-radius:10px;}
.ab::before{
  content:'';
  position:absolute;
  inset:-1.5px;
  border-radius:inherit;
  padding:1.5px;
  background:conic-gradient(from var(--angle),transparent 60%,#ff6a00,#ffb347,#ff6a00,transparent 80%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  animation:spin-border 3s linear infinite;
}
.ab-fast::before{animation-duration:1.8s}
.ab-slow::before{animation-duration:5s}

</style>
<style>
/* ══ FX1: Lava Scanlines CRT ══ */
#crt-overlay{position:fixed;inset:0;pointer-events:none;z-index:9998;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(255,69,0,.013) 3px,rgba(255,69,0,.013) 4px);animation:crt-scroll 10s linear infinite;}
#crt-sweep{position:fixed;left:0;right:0;height:80px;pointer-events:none;z-index:9997;background:linear-gradient(180deg,transparent,rgba(255,107,26,.05) 40%,rgba(255,69,0,.08) 50%,rgba(255,107,26,.05) 60%,transparent);animation:sweep-down 4s cubic-bezier(0.4,0,0.6,1) infinite;}
@keyframes crt-scroll{0%{background-position:0 0;}100%{background-position:0 100px;}}
@keyframes sweep-down{0%{top:-80px;opacity:0;}15%{opacity:.85;}85%{opacity:.65;}100%{top:calc(100% + 80px);opacity:0;}}
/* ══ FX2: Plasma Bars ══ */
.hb-f.plasma{background:linear-gradient(90deg,#ff2000,#ff6b1a,#ffaa20,#ff6b1a,#ff2000)!important;background-size:200% 100%!important;animation:plasma-flow 2s linear infinite;position:relative;overflow:hidden;}
.hb-f.plasma::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.22) 50%,transparent 100%);animation:plasma-shine 2.2s ease-in-out infinite;}
.hb-glow{height:4px;border-radius:99px;margin-top:-4px;background:linear-gradient(90deg,#ff2000,#ff6b1a,#ffaa20,#ff6b1a,#ff2000);background-size:200% 100%;filter:blur(4px);opacity:.55;animation:plasma-flow 2s linear infinite;}
@keyframes plasma-flow{0%{background-position:200% 0;}100%{background-position:0% 0;}}
@keyframes plasma-shine{0%,100%{transform:translateX(-150%);}50%{transform:translateX(150%);}}
/* ══ FX3: Tab Ember ══ */
.tb.on{position:relative;}
.tb.on::before{content:'';position:absolute;bottom:-2px;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#ff4500,#ffcc00,#ff4500,transparent);background-size:200% 100%;animation:ember-run 1.8s linear infinite;border-radius:2px;}
.tb.on::after{content:'';position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);width:55%;height:2px;background:rgba(255,107,26,.5);filter:blur(3px);border-radius:2px;}
@keyframes ember-run{0%{background-position:200% 0;}100%{background-position:0% 0;}}
/* ══ FX4: Odometer ══ */
.hs-v.odometer{display:inline-flex;align-items:center;overflow:hidden;height:1.2em;vertical-align:middle;}
.odo-digit-wrap{height:1.2em;overflow:hidden;display:inline-block;vertical-align:top;}
.odo-reel{display:flex;flex-direction:column;animation:odo-spin var(--odo-dur,1s) cubic-bezier(.17,.67,.3,1) var(--odo-delay,0s) both;}
.odo-d{height:1.2em;display:flex;align-items:center;justify-content:center;}
@keyframes odo-spin{0%{transform:translateY(0);}100%{transform:translateY(var(--odo-target,0px));}}
/* ══ FX5: Fire Border Cards ══ */
@property --fire-angle{syntax:'<angle>';inherits:true;initial-value:0deg;}
.sc{position:relative;isolation:isolate;}
.sc::before{content:'';position:absolute;inset:-1px;border-radius:15px;background:conic-gradient(from var(--fire-angle,0deg),transparent 0deg,#ff1500 55deg,#ff6b1a 80deg,#ffcc00 92deg,#ff4500 105deg,transparent 130deg);opacity:0;transition:opacity .35s;z-index:-1;animation:fire-border-rotate 2.5s linear infinite paused;}
.sc::after{content:'';position:absolute;inset:1px;background:rgba(17,17,17,.97);border-radius:13px;z-index:-1;}
.sc:hover::before{animation-play-state:running;opacity:1;}
.card{position:relative;isolation:isolate;}
.card::before{content:'';position:absolute;inset:-1px;border-radius:15px;background:conic-gradient(from var(--fire-angle,0deg),transparent 0deg,#ff1500 55deg,#ff6b1a 80deg,#ffcc00 92deg,#ff4500 105deg,transparent 130deg);opacity:0;transition:opacity .35s;z-index:-1;animation:fire-border-rotate 2.5s linear infinite paused;}
.card::after{content:'';position:absolute;inset:1px;background:rgba(17,17,17,.97);border-radius:13px;z-index:-1;}
.card:hover::before{animation-play-state:running;opacity:1;}
@keyframes fire-border-rotate{0%{--fire-angle:0deg;}100%{--fire-angle:360deg;}}

function fd(m){if(!m&&m!==0)return'—';const h=Math.floor(m/60),mm=m%60;return h?`${h}h ${mm}m`:`${mm}m`;}
function fdr(d){if(!d&&d!==0)return'';if(d>120){var m=Math.floor(d/60),s=d%60;return s?(m+'m '+String(s).padStart(2,'0')+'s'):(m+'m');}return fd(d);}
function pace(d,di){if(!d||!di)return null;const s=(d*60)/di;return`${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}`;}

function tots(arr){
  const n=arr.length,dur=arr.reduce((a,s)=>a+(s.duration||0),0),dist=arr.reduce((a,s)=>a+(s.distance||0),0);
  const cal=arr.reduce((a,s)=>a+(calAdj(s)||0),0),steps=arr.reduce((a,s)=>a+(s.steps||0),0);
  const ps=arr.filter(s=>s.duration&&s.distance).map(s=>(s.duration*60)/s.distance);
  const aps=ps.length?ps.reduce((a,b)=>a+b,0)/ps.length:0;
  const ap=aps?`${Math.floor(aps/60)}:${String(Math.round(aps%60)).padStart(2,'0')}`:'—';
  const as=n?(arr.reduce((a,s)=>a+(s.speedAvg||0),0)/n).toFixed(1):'—';
  const ah=n?Math.round(arr.reduce((a,s)=>a+(s.hrAvg||0),0)/n):'—';
  return{n,dur,dist,cal,steps,ap,as,ah};
}

function fcZone(hr){
  if(!hr)return null;
  return FC_ZONES.find(z=>hr>=z.min&&hr<=z.max)||FC_ZONES[FC_ZONES.length-1];
}
function fatBurnPct(hr){
  if(!hr)return null;
  const p=hr/185; // % of FC max
  // Interpolate linearly within each zone for more precise estimation
  if(p<0.50)return 90;
  if(p<0.60)return Math.round(90-(p-0.50)/0.10*5);   // 90→85
  if(p<0.70)return Math.round(85-(p-0.60)/0.10*20);  // 85→65
  if(p<0.80)return Math.round(65-(p-0.70)/0.10*15);  // 65→50
  if(p<0.90)return Math.round(50-(p-0.80)/0.10*15);  // 50→35
  if(p<1.00)return Math.round(35-(p-0.90)/0.10*20);  // 35→15
  return 15;
}
function fatBurnData(s){
  const pct=fatBurnPct(s.hrAvg);
  if(!pct||!s.calories)return null;
  const calW=calAdj(s);
  const calT=s.totalCalories||0;
  const fatCalW=Math.round(calW*(pct/100));
  const fatGW=Math.round(fatCalW/9);
  const fatCalT=calT?Math.round(calT*(pct/100)):null;
  const fatGT=fatCalT?Math.round(fatCalT/9):null;
  return{pct,fatCalW,fatGW,fatCalT,fatGT};
}
function fatBurnDataDay(daySessions){
  var totalW=0,totalHR=0,totalCalW=0;
  daySessions.forEach(function(s){
    totalHR+=s.hrAvg*s.duration;totalW+=s.duration;totalCalW+=(hasAdj(s)?calAdj(s):s.calories);
    if(s.rower){totalHR+=s.rower.hrAvg*s.rower.duration;totalW+=s.rower.duration;totalCalW+=s.rower.calories;}
  });
  var avgHR=totalW>0?Math.round(totalHR/totalW):0;
  var pct=fatBurnPct(avgHR);
  if(!pct||!totalCalW)return null;
  var fatCalW=Math.round(totalCalW*(pct/100));
  var fatGW=Math.round(fatCalW/9);
  var totalCal=daySessions[0]?daySessions[0].totalCalories:null;
  var fatCalT=totalCal?Math.round(totalCal*(pct/100)):null;
  var fatGT=fatCalT?Math.round(fatCalT/9):null;
  return{pct:pct,fatCalW:fatCalW,fatGW:fatGW,fatCalT:fatCalT,fatGT:fatGT};
}

function metBase(speed){
  // Base MET por velocidad promedio de caminata (km/h)
  if(speed<=3.4)return 3.3;
  if(speed<=3.5)return 3.4;
  if(speed<=3.6)return 3.5;
  if(speed<=3.7)return 3.6;
  if(speed<=3.9)return 3.8;
  if(speed<=4.0)return 4.0;
  return 4.1;
}
function calAdj(s){
  if(!s.calories)return s.calories;
  if(s.calMET)return s.calMET;
  if(isExt(s)||s.rowerOnly)return s.calories;
  if(!s.incline||s.incline===0)return s.calories;
  var w=wForDate(s.date)||90;
  var met=metBase(s.speedAvg)+(s.incline*0.3);
  return Math.round(met*w*(s.duration/60));
}
function hasAdj(s){return !isExt(s)&&!s.rowerOnly&&s.incline&&s.incline>0;}

function checkPR(s){
  var others=sessions.filter(function(x){return x.id!==s.id;});
  var tread=others.filter(function(x){return !isExt(x)&&!x.rowerOnly;});
  var rowerOthers=others.filter(function(x){return !!x.rower;});
  var prs=[];
  function maxOf(arr,fn){return arr.length?Math.max.apply(null,arr.map(fn)):0;}

  // ── Treadmill / walking records ──
  if(!isExt(s)&&!s.rowerOnly){
    if(s.distance>0&&s.distance>maxOf(tread,function(x){return x.distance||0;}))
      prs.push('Distancia: '+s.distance+' km');
    if(s.speedAvg>0&&s.speedAvg>maxOf(tread,function(x){return x.speedAvg||0;}))
      prs.push('Velocidad: '+s.speedAvg+' km/h');
    if(s.duration>0&&s.duration>maxOf(tread,function(x){return x.duration||0;}))
      prs.push('Duración: '+s.duration+' min');
    if(s.incline>0&&s.incline>maxOf(tread,function(x){return x.incline||0;}))
      prs.push('Inclinacion: '+s.incline+'%');
    if(s.calories>0&&s.calories>maxOf(tread,function(x){return x.calories||0;}))
      prs.push('Calorías: '+s.calories+' cal');
    if(s.steps>0&&s.steps>maxOf(tread,function(x){return x.steps||0;}))
      prs.push('Pasos: '+s.steps.toLocaleString());
  }

  // ── Rower records ──
  if(s.rower){
    var r=s.rower;
    if(r.duration>0&&r.duration>maxOf(rowerOthers,function(x){return x.rower.duration||0;}))
      prs.push('Remo duración: '+r.duration+' min');
    if(r.calories>0&&r.calories>maxOf(rowerOthers,function(x){return x.rower.calories||0;}))
      prs.push('Remo calorías: '+r.calories+' cal');
    if(r.resistance>0&&r.resistance>maxOf(rowerOthers,function(x){return x.rower.resistance||0;}))
      prs.push('Resistencia remo: '+r.resistance);
    if(r.rows>0&&r.rows>maxOf(rowerOthers,function(x){return x.rower.rows||0;}))
      prs.push('Rows: '+r.rows);
    if(r.rowerDist>0&&r.rowerDist>maxOf(rowerOthers,function(x){return x.rower.rowerDist||0;}))
      prs.push('Distancia remo: '+r.rowerDist+' km');
  }

  if(prs.length>0) showPR(prs);
  setTimeout(checkAchievementUnlocks, 300);
}

function getStreaks(){
  const dates=[...new Set(sessions.map(s=>s.date))].sort();
  if(!dates.length)return{cur:0,max:0,lastDate:null};
  let cur=1,max=1,tmp=1;
  for(let i=1;i<dates.length;i++){
    const a=new Date(dates[i-1]+'T12:00:00'),b=new Date(dates[i]+'T12:00:00');
    const diff=(b-a)/(1000*60*60*24);
    if(diff===1){tmp++;max=Math.max(max,tmp);}else tmp=1;
  }
  const today=new Date();today.setHours(12,0,0,0);
  const last=new Date(dates[dates.length-1]+'T12:00:00');
  const diffToday=(today-last)/(1000*60*60*24);
  if(diffToday<=1){
    cur=1;
    for(let i=dates.length-2;i>=0;i--){
      const a=new Date(dates[i]+'T12:00:00'),b=new Date(dates[i+1]+'T12:00:00');
      if((b-a)/(1000*60*60*24)===1)cur++;else break;
    }
  }else{cur=0;}
  return{cur,max,lastDate:dates[dates.length-1]};
}
function weekSessions(offsetWeeks=0){
  const now=new Date();
  const day=now.getDay();
  const monday=new Date(now);monday.setDate(now.getDate()-((day+6)%7)-offsetWeeks*7);monday.setHours(0,0,0,0);
  const sunday=new Date(monday);sunday.setDate(monday.getDate()+6);sunday.setHours(23,59,59,999);
  return sessions.filter(s=>{const d=new Date(s.date+'T12:00:00');return d>=monday&&d<=sunday;});
}
function weightTrend(){
  if(weights.length<2)return null;
  const n=Math.min(weights.length,5);
  const recent=weights.slice(-n);
  const days=(new Date(recent[n-1].date+'T12:00:00')-new Date(recent[0].date+'T12:00:00'))/(1000*60*60*24);
  if(days===0)return null;
  const kgPerDay=(recent[n-1].weight-recent[0].weight)/days;
  return kgPerDay;
}

// Swipe gesture for sidebar
(function(){
  var THRESHOLD = 40;  // min px to trigger
  var EDGE_ZONE = 30;  // px from left edge to start open gesture
  var startX = null, startY = null, target = null;

  document.addEventListener('touchstart', function(e){
    var t = e.touches[0];
    startX = t.clientX;
    startY = t.clientY;
    target = e.target;
  }, {passive:true});

  document.addEventListener('touchend', function(e){
    if(startX === null) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - startX;
    var dy = t.clientY - startY;
    // Must be more horizontal than vertical
    if(Math.abs(dx) < THRESHOLD || Math.abs(dy) > Math.abs(dx)) { startX=null; return; }
    var sbc = document.getElementById('sidebar-col');
    var isOpen = sbc && sbc.classList.contains('sb-open');
    // Swipe right from left edge → open
    if(dx > 0 && !isOpen && startX < EDGE_ZONE) {
      sbc.classList.add('sb-open');
    }
    // Swipe left while open → close
    else if(dx < 0 && isOpen) {
      sbc.classList.remove('sb-open');
    }
    startX = null;
  }, {passive:true});
})();

function rHist(){
  // Group all sessions by date, sorted newest first
  var allDates=[...new Set([...sessions].reverse().map(function(s){return s.date;}))];

  // Filter dates based on subpestana

  // ── Comparativa treadmill vs exterior ──────────────────────────
  if(hSub==='Comparativa'){
    var tread=sessions.filter(function(s){return !isExt(s)&&s.distance>0&&!s.rowerOnly;});
    var ext=sessions.filter(function(s){return isExt(s)&&s.distance>0;});
    function avg(arr,k){if(!arr.length)return 0;return arr.reduce(function(a,s){return a+(s[k]||0);},0)/arr.length;}
    var metrics=[
      {label:'Vel. promedio',unit:'km/h',t:avg(tread,'speedAvg').toFixed(2),e:avg(ext,'speedAvg').toFixed(2),icon:'⚡'},
      {label:'FC promedio',unit:'bpm',t:avg(tread,'hrAvg').toFixed(0),e:avg(ext,'hrAvg').toFixed(0),icon:'❤️'},
      {label:'Calorías/sesión',unit:'cal',t:avg(tread,'calories').toFixed(0),e:avg(ext,'calories').toFixed(0),icon:'🔥'},
      {label:'Distancia prom.',unit:'km',t:avg(tread,'distance').toFixed(2),e:avg(ext,'distance').toFixed(2),icon:'📏'},
      {label:'Duración prom.',unit:'min',t:avg(tread,'duration').toFixed(0),e:avg(ext,'duration').toFixed(0),icon:'⏱'},
    ];
    var totalDistT=tread.reduce(function(a,s){return a+(s.distance||0);},0).toFixed(1);
    var totalDistE=ext.reduce(function(a,s){return a+(s.distance||0);},0).toFixed(1);
    var html='<div style="display:flex;flex-direction:column;gap:10px">';
    html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px">';
    html+='<div style="background:rgba(255,107,26,.1);border:1px solid rgba(255,107,26,.3);border-radius:12px;padding:12px;text-align:center">';
    html+='<div style="font-family:var(--fh);font-size:11px;color:var(--muted);letter-spacing:1px;margin-bottom:4px">CAMINADORA</div>';
    html+='<div style="font-family:var(--fh);font-size:22px;font-weight:900;color:var(--a1)">'+tread.length+'</div>';
    html+='<div style="font-size:10px;color:var(--muted);font-family:var(--fm)">sesiones · '+totalDistT+' km</div></div>';
    html+='<div style="background:rgba(57,255,110,.08);border:1px solid rgba(57,255,110,.25);border-radius:12px;padding:12px;text-align:center">';
    html+='<div style="font-family:var(--fh);font-size:11px;color:var(--muted);letter-spacing:1px;margin-bottom:4px">EXTERIOR</div>';
    html+='<div style="font-family:var(--fh);font-size:22px;font-weight:900;color:#39ff6e">'+ext.length+'</div>';
    html+='<div style="font-size:10px;color:var(--muted);font-family:var(--fm)">sesiones · '+totalDistE+' km</div></div></div>';
    metrics.forEach(function(m){
      var tv=parseFloat(m.t),ev=parseFloat(m.e);
      var tWins=tv>ev;var tie=tv===ev;
      var tCol=tWins?'var(--a1)':(tie?'var(--muted)':'#666');
      var eCol=(!tWins&&!tie)?'#39ff6e':(tie?'var(--muted)':'#666');
      html+='<div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px">';
      html+='<div style="font-size:10px;color:var(--muted);font-family:var(--fm);margin-bottom:8px">'+m.icon+' '+m.label+'</div>';
      html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">';
      html+='<div style="text-align:center"><div style="font-family:var(--fh);font-size:20px;font-weight:900;color:'+tCol+'">'+m.t+'</div><div style="font-size:9px;color:var(--muted);font-family:var(--fm)">'+m.unit+' · CAMINADORA</div></div>';
      html+='<div style="text-align:center"><div style="font-family:var(--fh);font-size:20px;font-weight:900;color:'+eCol+'">'+m.e+'</div><div style="font-size:9px;color:var(--muted);font-family:var(--fm)">'+m.unit+' · EXTERIOR</div></div>';
      html+='</div></div>';
    });
    html+='</div>';
    return '<div style="display:flex;flex-direction:column;gap:11px">'      +'<div class="stabs">'+['General','Treadmill','Exterior','Rower','Simulacion','Comparativa'].map(function(t){        return '<button class="stb'+(hSub===t?' on ab':'')+'" onclick="hSub=\''+t+'\';render()">'+t+'</button>';      }).join('')+'</div>'+html+'</div>';  }

  var STSI={General:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',Treadmill:'<svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>',Exterior:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>',Rower:'<svg viewBox="0 0 24 24"><path d="M2 12c0 0 3-4 6-4s6 8 9 8 5-4 5-4"/></svg>',Simulacion:'<svg viewBox="0 0 24 24"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/></svg>',Comparativa:'<svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>'};
  var STSL={General:'GEN',Treadmill:'TM',Exterior:'EXT',Rower:'ROW',Simulacion:'SIM',Comparativa:'CMP'};
  var stbBtnsHtml=['General','Treadmill','Exterior','Rower','Simulacion','Comparativa'].map(function(t){
    var ico=(STSI[t]||'').replace('viewBox=','class="stb-ico" viewBox=');
    return '<button class="stb'+(hSub===t?' on ab':'')+' data-sub="'+t+'" onclick="hSub=this.dataset.sub;stbSlide();rContent()">'+ico+'<span class="stb-lbl">'+(STSL[t]||t)+'</span></button>';
  }).join('');
  var filteredDates=allDates.filter(function(date){
    var daySessions=sessions.filter(function(s){return s.date===date;});
    if(hSub==='General') return true;
    if(hSub==='Treadmill') return daySessions.some(function(s){return !isExt(s)&&!s.rower||(!isExt(s)&&s.rower);});
    if(hSub==='Exterior') return daySessions.some(function(s){return isExt(s);});
    if(hSub==='Rower') return daySessions.some(function(s){return !!s.rower;});
    if(hSub==='Simulacion') return daySessions.some(function(s){return SIMULATION_IDS.has(s.id);});
    return true;
  });

  return '<div style="display:flex;flex-direction:column;gap:11px">'
    +'<div class="stabs">'+['General','Treadmill','Exterior','Rower','Simulacion','Comparativa'].map(function(t){
      return '<button class="stb'+(hSub===t?' on ab':'')+'" onclick="hSub=\''+t+'\';rContent()">'
        +(t==='Treadmill'?'<svg style="display:inline;width:12px;height:12px;vertical-align:middle;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>':t==='Exterior'?'<svg style="display:inline;width:12px;height:12px;vertical-align:middle;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><path d="M13 4v6l2 5v5h-3v-4h-4v4H5v-5l2-5V4"/><circle cx="12" cy="2" r="1"/></svg>':t==='Rower'?'<svg style="display:inline;width:12px;height:12px;vertical-align:middle;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><path d="M3 17l4-8 4 4 4-4 4 8"/><circle cx="12" cy="5" r="2"/></svg>':'<svg style="display:inline;width:12px;height:12px;vertical-align:middle;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>')+' '+t+'</button>';
    }).join('')+'</div>'
    +(filteredDates.length===0?'<div class="empty">No hay sesiones.</div>'
      :filteredDates.map(function(date){
        var daySessions=sessions.filter(function(s){return s.date===date;});
        return rDayCard(date,daySessions);
      }).join(''))
    +'</div>';
}

function rDayCard(date,daySessions){
  // Separate by type
  var tmSessions=daySessions.filter(function(s){return !isExt(s)&&!s.rowerOnly;});
  var extSessions=daySessions.filter(function(s){return isExt(s);});
  // Rower comes from TM sessions that have rower
  var rowerSession=daySessions.find(function(s){return !!s.rower;});

  // Show based on subpestana
  var isSim=(hSub==='Simulacion');
  var showTM   =(hSub==='General'||hSub==='Treadmill'||isSim)&&tmSessions.length>0;
  var showExt  =(hSub==='General'||hSub==='Exterior')&&extSessions.length>0;
  var showRower=(hSub==='General'||hSub==='Rower'||isSim)&&!!rowerSession;
  var simSessions=daySessions.filter(function(s){return SIMULATION_IDS.has(s.id);});
  var showSim   =(hSub==='General'||isSim)&&simSessions.length>0;
  var showTotal=(hSub==='General');

  // Weight for this date
  var w=wForDate(date);
  var kcalDay=KCAL_RECORDS[date];

  // Total duration across all sessions
  var totalDurAll=daySessions.reduce(function(a,s){return a+s.duration+(s.rower?(function(d){return d>120?Math.round(d/60):d;})(s.rower.duration):0);},0);
  var totalCalAll=daySessions.reduce(function(a,s){return a+(hasAdj(s)?calAdj(s):s.calories)+(s.rower?s.rower.calories:0);},0);
  var totalStepsAll=daySessions.reduce(function(a,s){return a+(s.steps||0);},0);

  // Banner
  var typeLabels=[];
  if(tmSessions.length>0) typeLabels.push('<svg style="display:inline;width:12px;height:12px;vertical-align:middle;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg> Treadmill');
  if(extSessions.length>0) typeLabels.push('<svg style="display:inline;width:12px;height:12px;vertical-align:middle;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><path d="M13 4v6l2 5v5h-3v-4h-4v4H5v-5l2-5V4"/><circle cx="12" cy="2" r="1"/></svg> Exterior');
  if(rowerSession) typeLabels.push('<svg style="display:inline;width:12px;height:12px;vertical-align:middle;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><path d="M3 17l4-8 4 4 4-4 4 8"/><circle cx="12" cy="5" r="2"/></svg> Rower');
  var badges='';
  daySessions.forEach(function(s){
    if(SIMULATION_IDS.has(s.id)) badges+='<span style="display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:2px 8px;font-family:var(--fm);font-size:8px;border:1px solid rgba(251,146,60,.3);background:rgba(251,146,60,.08);color:#fb923c">Simulaci\xf3n</span>';
    if(ENDURANCE_IDS.has(s.id)) badges+='<span style="display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:2px 8px;font-family:var(--fm);font-size:8px;border:1px solid rgba(255,107,26,.3);background:rgba(255,107,26,.08);color:var(--a1)">Endurance</span>';
  });
  if(rowerSession) badges+='<span style="display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:2px 8px;font-family:var(--fm);font-size:8px;border:1px solid rgba(34,197,94,.35);background:rgba(34,197,94,.1);color:#22c55e"><svg style="display:inline;width:12px;height:12px;vertical-align:middle;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><path d="M3 17l4-8 4 4 4-4 4 8"/><circle cx="12" cy="5" r="2"/></svg> Rower</span>';

  var banner='<div style="background:linear-gradient(135deg,rgba(255,107,26,.14),rgba(255,69,0,.05));padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.05)">'
    +'<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">'
      +'<div style="flex:1;min-width:0">'
        +'<div style="font-family:var(--fh);font-weight:800;font-size:22px;color:var(--a1);line-height:1.1"><svg style="display:inline;width:12px;height:12px;vertical-align:middle;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> '+fdate(date)+'</div>'
        +'<div style="margin-top:5px;font-family:var(--fm);font-size:10px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center">'
          +'<span style="color:var(--text)"><svg style="display:inline;width:12px;height:12px;vertical-align:middle;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 6 12 12 16 14"/></svg> '+fd(totalDurAll)+'</span>'
          +'<span>\xb7</span>'
          +'<span>'+typeLabels.join(' + ')+'</span>'
        +'</div>'
        +(badges?'<div style="margin-top:6px;display:flex;gap:5px;flex-wrap:wrap">'+badges+'</div>':'')
      +'</div>'
      +'<div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0">'
        +(w?'<div style="background:rgba(212,130,10,.12);border:1px solid rgba(212,130,10,.3);border-radius:10px;padding:6px 10px;text-align:center"><div style="font-family:var(--fh);font-weight:800;font-size:22px;line-height:1;color:var(--wt)">'+w+'</div><div style="font-family:var(--fm);font-size:8px;color:var(--muted);margin-top:1px">kg</div></div>':'')
      +'</div>'
    +'</div>'
  +'</div>';

  // Build left column blocks
  var leftBlocks='';

  if(showTM){
    tmSessions.forEach(function(s){
      leftBlocks+=rSessionBlock(s,'tm');
    });
  }
  if(showExt){
    extSessions.forEach(function(s){
      leftBlocks+=rSessionBlock(s,'ext');
    });
  }

  // Build right column blocks
  var rightBlocks='';
  if(showRower){
    rightBlocks+=rRowerBlock(rowerSession);
  }
  if(showTotal){
    var totalHRAll=0,totalHRWeight=0;
    daySessions.forEach(function(s){
      totalHRAll+=s.hrAvg*s.duration;
      totalHRWeight+=s.duration;
      if(s.rower){totalHRAll+=s.rower.hrAvg*s.rower.duration;totalHRWeight+=s.rower.duration;}
    });
    var avgFC=totalHRWeight>0?Math.round(totalHRAll/totalHRWeight):0;
    var isMultiSession=(tmSessions.length+extSessions.length+(rowerSession?1:0))>1;
  var totalBox='<div style="background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);border-radius:13px;padding:12px 13px;">'
    +'<div style="font-family:var(--fm);font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:9px;opacity:.85"><svg style="display:inline;width:12px;height:12px;vertical-align:middle;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg> Totales d\xeda</div>'
    +'<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px"><span style="font-family:var(--fm);font-size:9px;color:var(--muted)">Tiempo total</span><span style="font-family:var(--fh);font-weight:700;font-size:15px;color:var(--text)">'+fd(totalDurAll)+'</span></div>'
    +(avgFC?'<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px"><span style="font-family:var(--fm);font-size:9px;color:var(--muted)">FC prom. pond.</span><span style="font-family:var(--fh);font-weight:700;font-size:15px;color:var(--a2)">'+avgFC+' <span style="font-size:10px;color:var(--muted)">bpm</span></span></div>':'')
    +(function(){var _s=daySessions.find(function(s){return s.totalCalories;});return _s?'<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px"><span style="font-family:var(--fm);font-size:9px;color:var(--muted)">Cal. totales d\xeda</span><span style="font-family:var(--fh);font-weight:700;font-size:15px;color:var(--a4)">'+_s.totalCalories.toLocaleString()+' <span style="font-size:10px;color:var(--muted)">kcal</span></span></div>':'';})()
    +'<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px"><span style="font-family:var(--fm);font-size:9px;color:var(--muted)">Cal. MET</span><span style="font-family:var(--fh);font-weight:700;font-size:15px;color:var(--a4)">'+totalCalAll+' <span style="font-size:10px;color:var(--muted)">kcal</span></span></div>'+(function(){var _ds=DAILY_STEPS.find(function(d){return d.date===date;});return _ds?'<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px"><span style="font-family:var(--fm);font-size:9px;color:var(--muted)">Pasos del d\xeda</span><span style="font-family:var(--fh);font-weight:700;font-size:15px;color:var(--a3)">'+_ds.steps.toLocaleString()+'</span></div>':'';})()    +(kcalDay
      ?'<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px"><span style="font-family:var(--fm);font-size:9px;color:var(--muted)">Consumidas (comida)</span><span style="font-family:var(--fh);font-weight:700;font-size:15px;color:#c084fc">'+kcalDay.kcal+' <span style="font-size:10px;color:var(--muted)">kcal</span></span></div>'
      :'')
    +(function(){var _s=daySessions.find(function(s){return s.totalCalories;});return (kcalDay&&_s)?'<div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-family:var(--fm);font-size:9px;color:var(--muted)">Balance del d\xeda</span><span style="font-family:var(--fh);font-weight:700;font-size:15px;color:'+(_s.totalCalories-kcalDay.kcal>=0?'var(--a3)':'var(--a2)')+'">'+((_s.totalCalories-kcalDay.kcal>0?'+':'')+(_s.totalCalories-kcalDay.kcal))+' <span style="font-size:10px;color:var(--muted)">kcal</span></span></div>':'';})()
    +(function(){
      var fbDay=fatBurnDataDay(daySessions);
      if(!fbDay)return '';
      return '<div style="height:1px;background:rgba(255,255,255,.05);margin:8px 0"></div>'
        +'<div style="font-family:var(--fm);font-size:8px;color:#f472b6;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px;opacity:.8"><svg style="display:inline;width:12px;height:12px;vertical-align:middle;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg> Grasa quemada</div>'
        +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px">'
          +'<div style="background:rgba(244,114,182,.06);border:1px solid rgba(244,114,182,.15);border-radius:10px;padding:9px;text-align:center"><div style="font-family:var(--fh);font-weight:800;font-size:20px;color:#f472b6;line-height:1">'+fbDay.pct+'%</div><div style="font-family:var(--fm);font-size:8px;color:var(--muted);margin-top:2px">del total</div></div>'
          +'<div style="background:rgba(244,114,182,.06);border:1px solid rgba(244,114,182,.15);border-radius:10px;padding:9px;text-align:center"><div style="font-family:var(--fh);font-weight:800;font-size:20px;color:#f472b6;line-height:1">'+fbDay.fatGW+'g</div><div style="font-family:var(--fm);font-size:8px;color:var(--muted);margin-top:2px">workout</div></div>'
          +(fbDay.fatGT?'<div style="background:rgba(236,72,153,.06);border:1px solid rgba(236,72,153,.15);border-radius:10px;padding:9px;text-align:center"><div style="font-family:var(--fh);font-weight:800;font-size:20px;color:#ec4899;line-height:1">'+fbDay.fatGT+'g</div><div style="font-family:var(--fm);font-size:8px;color:var(--muted);margin-top:2px">d\xeda total</div></div>':'<div></div>')
        +'</div>'
        +'<div style="height:4px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden"><div style="width:'+fbDay.pct+'%;height:100%;background:linear-gradient(90deg,#f472b6,#ec4899);border-radius:99px"></div></div>';
    })()
    +'</div>';
    rightBlocks+=totalBox;
  }

  // If only one side has content, full width
  var bodyStyle=(leftBlocks&&rightBlocks)?'display:grid;grid-template-columns:3fr 2fr;':'display:flex;flex-direction:column;';

  return '<div style="background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.07);border-radius:20px;overflow:hidden;margin-bottom:12px">'
    +banner
    +'<div style="'+bodyStyle+'">'
      +(leftBlocks?'<div style="padding:14px;border-right:'+(rightBlocks?'1px solid rgba(255,255,255,.05)':'none')+';display:flex;flex-direction:column;gap:10px;">'+leftBlocks+'</div>':'')
      +(rightBlocks?'<div style="padding:14px;display:flex;flex-direction:column;gap:10px;">'+rightBlocks+'</div>':'')
    +'</div>'
  +'</div>';
}

function rSessionBlock(s,type){
  var isTM=type==='tm', isE=type==='ext';
  var color=isTM?'var(--a1)':'#f59e0b';
  var bgColor=isTM?'rgba(255,107,26,.05)':'rgba(245,158,11,.05)';
  var borderColor=isTM?'rgba(255,107,26,.18)':'rgba(245,158,11,.2)';

  var r=s.rower;
  var kcalAdj=r.caloriesAdj||r.calories||0;
  var kcalOrig=r.caloriesOrig||r.calories||0;
  var sep='<div style="height:1px;background:rgba(255,255,255,.05);margin:8px 0"></div>';
  return '<div style="background:rgba(34,197,94,.05);border:1px solid rgba(34,197,94,.2);border-radius:13px;padding:12px 13px;">'
    +'<div style="font-family:var(--fm);font-size:8px;color:#22c55e;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:9px;opacity:.9">🚣 Rower</div>'
    +'<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px"><span style="font-family:var(--fm);font-size:9px;color:var(--muted)">Duración</span><span style="font-family:var(--fh);font-weight:700;font-size:15px;color:#22c55e">'+fdr(r.duration)+'</span></div>'
    +(r.resistance!=null?'<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px"><span style="font-family:var(--fm);font-size:9px;color:var(--muted)">Resistencia</span><span style="font-family:var(--fh);font-weight:700;font-size:15px;color:#22c55e">'+r.resistance+' <span style="font-size:10px;color:var(--muted)">nivel</span></span></div>':'')
    +'<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px"><span style="font-family:var(--fm);font-size:9px;color:var(--muted)">FC promedio</span><span style="font-family:var(--fh);font-weight:700;font-size:15px;color:var(--a2)">'+r.hrAvg+' <span style="font-size:10px;color:var(--muted)">bpm</span></span></div>'
    +(r.rows?'<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px"><span style="font-family:var(--fm);font-size:9px;color:var(--muted)">Rows</span><span style="font-family:var(--fh);font-weight:700;font-size:15px;color:#22c55e">'+r.rows+' <span style="font-size:10px;color:var(--muted)">rows</span></span></div>':'')
    +(r.rowerDist?'<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px"><span style="font-family:var(--fm);font-size:9px;color:var(--muted)">Distancia remo</span><span style="font-family:var(--fh);font-weight:700;font-size:15px;color:#22c55e">'+r.rowerDist.toFixed(2)+' <span style="font-size:10px;color:var(--muted)">km</span></span></div>':'')
    +sep
    +'<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px"><span style="font-family:var(--fm);font-size:9px;color:var(--muted)">Cal. Rower</span><span style="font-family:var(--fh);font-weight:700;font-size:15px;color:var(--a4)">'+kcalAdj+' <span style="font-size:10px;color:var(--muted)">kcal</span></span></div>'
    +(kcalOrig&&kcalOrig!==kcalAdj?'<div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-family:var(--fm);font-size:9px;color:var(--muted)">Cal. reloj (ref.)</span><span style="font-family:var(--fh);font-weight:700;font-size:13px;color:var(--muted)">'+kcalOrig+' <span style="font-size:10px">kcal</span></span></div>':'')

// PROGRESO
function rStepsMeta(){
  const total=DAILY_STEPS.length;
  const met=DAILY_STEPS.filter(d=>d.steps>=STEPS_GOAL).length;
  const pct=Math.round((met/total)*100);
  const streak=((arr)=>{let c=0;for(let i=arr.length-1;i>=0;i--){if(arr[i].steps>=STEPS_GOAL)c++;else break;}return c;})(DAILY_STEPS);
  const avg=Math.round(DAILY_STEPS.reduce((a,d)=>a+d.steps,0)/total);
  const maxS=Math.max(...DAILY_STEPS.slice(-10).map(x=>x.steps));
  const bars=DAILY_STEPS.slice(-10).map(d=>{
    const h=Math.min(100,Math.round((d.steps/maxS)*100));
    const ok=d.steps>=STEPS_GOAL;
    return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px"><div style="width:100%;height:'+h+'%;background:'+(ok?'var(--a3)':'var(--a2)')+';border-radius:3px 3px 0 0;min-height:4px"></div></div>';
  }).join('');
  const labels=DAILY_STEPS.slice(-10).map(d=>'<div style="flex:1;text-align:center;font-family:var(--fm);font-size:7px;color:var(--muted)">'+d.date.slice(5)+'</div>').join('');
  const streakHtml=streak>0?'<div style="margin-top:8px;font-family:var(--fm);font-size:9px;color:var(--a3)">🔥 Racha actual: '+streak+' días consecutivos con meta cumplida</div>':'';
  return `<div class="card" style="border-color:rgba(57,255,110,.2)">
    <div style="color:var(--a3);font-family:var(--fm);font-size:9px;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">👟 Meta de pasos diarios — ${STEPS_GOAL.toLocaleString()} pasos</div>
    <div class="g3" style="margin-bottom:12px">
      <div class="sm2"><div class="sl2">Días con meta</div><div class="sv" style="color:var(--a3)">${met}/<span style="color:var(--muted);font-size:11px">${total}</span></div></div>
      <div class="sm2"><div class="sl2">% cumplimiento</div><div class="sv" style="color:var(--a3)">${pct}%</div></div>
      <div class="sm2"><div class="sl2">Promedio diario</div><div class="sv" style="color:var(--a1)">${avg.toLocaleString()}</div></div>
    </div>
    <div style="color:var(--muted);font-family:var(--fm);font-size:9px;margin-bottom:6px">Últimos 10 días</div>
    <div style="display:flex;gap:4px;align-items:flex-end;height:50px">${bars}</div>
    <div style="display:flex;justify-content:space-between;margin-top:4px">${labels}</div>
    ${streakHtml}
  </div>`;
}

function rCharts(){

  const cc=document.getElementById('ccon');if(!cc)return;
  if(data.length<2){cc.innerHTML='<div class="empty">Necesitas al menos 2 sesiones.</div>';return;}
  const lbl=data.map(s=>s.date.slice(5));
  const isRower=pSub==='Rower';
  const showTMCharts=!isRower; // TM metrics for all except Rower-only
  const defs=[
    ...(isRower?[
      {id:'c8r',label:'Duraci\xf3n Rower (min)',data:data.map(s=>s.rower?s.rower.duration:null),type:'bar',color:'#22c55e'},
      {id:'c9r',label:'Resistencia Rower',data:data.map(s=>s.rower?s.rower.resistance:null),type:'bar',color:'#22c55e',yMin:0,yMax:10},

      {id:'c11r',label:'FC Rower (bpm)',data:data.map(s=>s.rower?s.rower.hrAvg:null),type:'line',color:'#ff2020',yMin:90,yMax:160},
      {id:'c12r',label:'Rows Rower',data:data.map(s=>s.rower&&s.rower.rows?s.rower.rows:null),type:'bar',color:'#22c55e'},
      {id:'c13r',label:'Distancia Rower (km)',data:data.map(s=>s.rower&&s.rower.rowerDist?s.rower.rowerDist:null),type:'bar',color:'#4ade80'},
    ]:[]),
    ...(showTMCharts?[

    +'<div id="fczone-heatmap-wrap"></div>';

  defs.forEach(d=>{

      const n=vals.length,sx=vals.reduce((a,p)=>a+p.x,0),sy=vals.reduce((a,p)=>a+p.y,0);
      const sxy=vals.reduce((a,p)=>a+p.x*p.y,0),sxx=vals.reduce((a,p)=>a+p.x*p.x,0);

    });

function rHitoStats(fromDate,toDate){
  const ss=sessions.filter(s=>s.date>=fromDate&&(!toDate||s.date<=toDate));
  if(!ss.length)return null;
  const km=ss.reduce((a,s)=>a+s.distance,0).toFixed(2);
  const mins=ss.reduce((a,s)=>a+s.duration,0);
  const h2=Math.floor(mins/60),m2=mins%60;
  const dur=(h2>0?h2+'h ':'')+m2+'m';
  const avgSpd=(ss.reduce((a,s)=>a+s.speedAvg,0)/ss.length).toFixed(1);
  const incSs=ss.filter(s=>s.incline!=null);
  const avgInc=incSs.length?(incSs.reduce((a,s)=>a+(s.incline||0),0)/incSs.length).toFixed(1):'--';
  return {km,dur,avgSpd,avgInc,n:ss.length};
}

              +'<div style="font-family:var(--fm);font-size:8px;color:#22c55e;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px"><svg style="display:inline;width:12px;height:12px;vertical-align:middle;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><path d="M3 17l4-8 4 4 4-4 4 8"/><circle cx="12" cy="5" r="2"/></svg> Rower</div>'
              +'<div class="g3">'
                +'<div class="sm2"><div class="sl2">Duraci\xf3n</div><div class="sv" style="color:#22c55e">'+fdr(s.rower.duration)+'</div></div>'
                +'<div class="sm2"><div class="sl2">Resistencia</div><div class="sv" style="color:#22c55e">Niv. '+s.rower.resistance+'</div></div>'
                +'<div class="sm2"><div class="sl2">FC prom</div><div class="sv" style="color:var(--a2)">'+s.rower.hrAvg+' bpm</div></div>'
                +'<div class="sm2"><div class="sl2">Cal. Rower (aj.)</div><div class="sv" style="color:var(--a4)">'+s.rower.calories+' kcal</div></div>'
              +'</div></div>';
          }
          return '<div style="background:rgba(255,255,255,.04);border-radius:10px;padding:10px 12px;border-left:3px solid '+accentColor+';margin-bottom:8px">'
            +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'
              +'<div style="font-family:var(--fh);font-weight:700;font-size:15px;color:'+accentColor+'">'+typeLabel+'</div>'
              +'<div style="font-family:var(--fm);font-size:10px;color:var(--muted)">'+durLabel+' \xb7 '+s.distance+' km</div>'
            +'</div>'
            +'<div class="g3">'
              +'<div class="sm2"><div class="sl2">Cal.</div><div class="sv" style="color:var(--a4)">'+s.calories+' <span style="color:var(--muted);font-size:9px">kcal</span></div></div>'
              +'<div class="sm2"><div class="sl2">FC</div><div class="sv" style="color:var(--a2)">'+s.hrAvg+' <span style="color:var(--muted);font-size:9px">bpm</span></div></div>'
              +'<div class="sm2"><div class="sl2">Pasos</div><div class="sv" style="color:var(--a3)">'+(s.steps?s.steps.toLocaleString():'-')+'</div></div>'
              +'<div class="sm2"><div class="sl2">Vel.</div><div class="sv" style="color:var(--a1)">'+s.speedAvg+' <span style="color:var(--muted);font-size:9px">km/h</span></div></div>'
              +(p2?'<div class="sm2"><div class="sl2">Pace</div><div class="sv" style="color:var(--a5)">'+p2+' <span style="color:var(--muted);font-size:9px">min/km</span></div></div>':'')
              +inclineInfo
            +'</div>'
            +rowerBlock
          +'</div>';
        }).join('');
      })()}
    </div>`;
  }

  const buildSum=(label,color,arr)=>{if(!arr.length)return'';const t=tots(arr),tm=arr.filter(s=>!isExt(s)).length,ex=arr.filter(s=>isExt(s)).length,rw=arr.filter(s=>!!s.rower).length;
    return`<div class="card" style="border-color:${color}33;margin-bottom:8px"><div style="color:${color};font-family:var(--fm);font-size:9px;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;font-weight:700">${label}</div>
    <div class="g2">${[{l:'Sesiones',v:arr.length,c:'var(--a1)'},{l:'TM/Ext./Rower',v:`${tm}/${ex}/${rw}`,c:'var(--a5)'},{l:'Distancia',v:`${t.dist.toFixed(2)} km`,c:'var(--a4)'},{l:'Tiempo',v:fd(t.dur),c:'var(--a3)'},{l:'Cal.',v:`${t.cal.toLocaleString()} kcal`,c:'var(--a4)'},{l:'Pasos',v:t.steps.toLocaleString(),c:'var(--a3)'}].map(s=>`<div class="sm2"><div class="sl2">${s.l}</div><div class="sv" style="color:${s.c}">${s.v}</div></div>`).join('')}</div></div>`;
  };
  const ms=sessions.filter(s=>{const d=new Date(s.date+'T12:00:00');return d.getFullYear()===cY&&d.getMonth()===cM;});
  const ys=sessions.filter(s=>new Date(s.date+'T12:00:00').getFullYear()===cY);

  return`<div>
    <div class="cal-h"><button class="cal-n" onclick="prevM()">‹</button><div class="cal-t">${mn[cM]} ${cY}</div><button class="cal-n" onclick="nextM()">›</button></div>
    <div class="cal-leg" style="flex-wrap:wrap;gap:5px 8px;">
      <div class="cal-li"><div class="dot" style="background:var(--a5)"></div><span style="color:var(--muted);font-family:var(--fm);font-size:8px">Treadmill</span></div>
      <div class="cal-li"><div class="dot" style="background:var(--a3)"></div><span style="color:var(--muted);font-family:var(--fm);font-size:8px">Exterior</span></div>
      <div class="cal-li"><div class="dot" style="background:var(--wt)"></div><span style="color:var(--muted);font-family:var(--fm);font-size:8px">Peso</span></div>
      <div class="cal-li"><div class="dot" style="background:var(--a1)"></div><span style="color:var(--muted);font-family:var(--fm);font-size:8px">Endurance</span></div>
      <div class="cal-li"><div style="width:8px;height:8px;border-radius:2px;background:#fff;outline:2px solid #fb923c;flex-shrink:0"></div><span style="color:var(--muted);font-family:var(--fm);font-size:8px">Simulaci\xf3n</span></div>
      <div class="cal-li"><div class="dot" style="background:#3b82f6"></div><span style="color:var(--muted);font-family:var(--fm);font-size:8px">Rower</span></div>
    </div>
    <div class="cal-g">
      ${dn.map(d=>`<div class="cal-dn">${d}</div>`).join('')}
      ${calRows}
    </div>
    ${det}
    <div style="margin-top:16px">
      ${buildSum(`📅 ${mn[cM]} ${cY}`,'var(--a1)',ms)}
      ${buildSum(`📆 Año ${cY}`,'var(--a4)',ys)}
      ${buildSum('🌐 Global','var(--a5)',sessions)}
    </div>
  </div>`;
}
function prevM(){const d=new Date(cY,cM-1,1);cY=d.getFullYear();cM=d.getMonth();selDay=null;rContent();}
function nextM(){const d=new Date(cY,cM+1,1);cY=d.getFullYear();cM=d.getMonth();selDay=null;rContent();}
function tDay(ds){selDay=selDay===ds?null:ds;rContent();}

// ENDURANCE TAB
function rSim(){
  var simSessions=sessions.filter(function(s){return SIMULATION_IDS.has(s.id);}).sort(function(a,b){return a.date.localeCompare(b.date);});
  var mn=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  var dn=['Dom','Lun','Mar','Mi\xe9','Jue','Vie','S\xe1b'];
  var fd2=new Date(cY,cM,1).getDay();
  var dim=new Date(cY,cM+1,0).getDate();
  var emap={};
  simSessions.forEach(function(s){emap[s.date]=s;});
  var today=new Date();

  // Calendar cells
  var cells=[];
  for(var z=0;z<fd2;z++) cells.push(null);
  for(var d=1;d<=dim;d++) cells.push(d);

    if(!day) return '<div></div>';
    var ds=cY+'-'+String(cM+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    var s=emap[ds];
    var isTod=today.getFullYear()===cY&&today.getMonth()===cM&&today.getDate()===day;
    var isSel=selSimDay===ds;

    var cell='<div class="'+cls+'" style="'+style+'"'+(s?' data-ds="'+ds+'" onclick="tSimDay(this.dataset.ds)"':'')+'>'+
      '<div class="cal-dots">'+(s?'<div style="width:8px;height:8px;border-radius:50%;background:var(--a1)"></div><div style="width:8px;height:8px;border-radius:50%;background:var(--a4)"></div>':'')+'</div>'+
      '<div class="cal-num" style="color:'+(s?'#fff':'#4a5568')+';font-weight:'+(s?700:400)+'">'+day+'</div>'+
      '</div>';
    return cell;
  }).join('');

  // Detail card
  var det='';
  if(selSimDay&&emap[selSimDay]){
    var s=emap[selSimDay];
    var dl=new Date(selSimDay+'T12:00:00').toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
    var routeName=s.note||'Simulaci\xf3n';
    var inclBar='';
    if(s.inclineProfile){
      var avgIncl=Math.round(s.inclineProfile.reduce(function(a,t){return a+(t.pct*(t.to-t.from));},0)/s.distance*10)/10;
      var barSegs=s.inclineProfile.map(function(t){
        var w=((t.to-t.from)/s.distance*100).toFixed(1);
        var col=t.pct>=15?'#ff2020':t.pct>=10?'#ff6b1a':t.pct>=5?'#ffa020':'#60a5fa';
        return '<div style="flex:'+w+';height:8px;background:'+col+';border-radius:2px" title="'+t.pct+'%"></div>';
      }).join('');
      inclBar='<div style="margin-top:8px">'
        +'<div style="font-family:var(--fm);font-size:7px;color:var(--muted2);letter-spacing:1px;margin-bottom:3px">PERFIL INCLINACI\xd3N \xb7 prom '+avgIncl+'%</div>'
        +'<div style="display:flex;gap:2px;align-items:stretch;border-radius:4px;overflow:hidden">'+barSegs+'</div>'
        +'<div style="display:flex;justify-content:space-between;font-family:var(--fm);font-size:7px;color:var(--muted);margin-top:2px"><span>0 km</span><span>'+s.distance+' km</span></div>'
        +'</div>';
    }
    var p2=pace(s.duration,s.distance);
    det='<div style="background:rgba(255,107,26,.06);border:1px solid rgba(255,107,26,.3);border-radius:14px;padding:14px 16px;margin-top:12px">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">'
      +'<div style="font-family:var(--fh);font-weight:700;font-size:15px;color:var(--a1);text-transform:capitalize">'+dl+'</div>'
      +'<button onclick="selSimDay=null;rContent()" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px">\xd7</button>'
      +'</div>'
      +'<div style="background:rgba(255,255,255,.04);border-radius:10px;padding:10px 12px;border-left:3px solid var(--a1)">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">'
      +'<div style="font-family:var(--fh);font-weight:700;font-size:13px;color:var(--a1)">'+routeName+'</div>'
      +'<div style="font-family:var(--fm);font-size:10px;color:var(--muted)">'+fd(s.duration)+' \xb7 '+s.distance+' km</div>'
      +'</div>'
      +inclBar
      +'<div class="g3" style="margin-top:8px">'
      +[{l:'Distancia',v:s.distance+' km',c:'var(--a1)'},
        {l:'Duraci\xf3n',v:fd(s.duration),c:'var(--a3)'},
        {l:'Cal.',v:s.calories,u:'kcal',c:'var(--a4)'},
        {l:'FC prom',v:s.hrAvg,u:'bpm',c:'var(--a2)'},
        {l:'Pasos',v:s.steps?s.steps.toLocaleString():'--',c:'var(--a3)'},
        {l:'Vel.',v:s.speedAvg,u:'km/h',c:'var(--a1)'},
        p2?{l:'Pace',v:p2,u:'min/km',c:'var(--a5)'}:null,
        s.calMET?{l:'Cal MET',v:s.calMET,u:'kcal',c:'var(--wt)'}:null,
      ].filter(function(x){return x&&x.v!=null;}).map(function(x){
        return '<div class="sm2"><div class="sl2">'+x.l+'</div><div class="sv" style="color:'+x.c+'">'+x.v+(x.u?' <span style="color:var(--muted);font-size:9px;font-weight:400">'+x.u+'</span>':'')+'</div></div>';
      }).join('')
      +'</div></div></div>';
  }

  // Top lists
  var top10dist=[].concat(simSessions).sort(function(a,b){return b.distance-a.distance;}).slice(0,10);
  var top10spd=[].concat(simSessions).sort(function(a,b){return b.speedAvg-a.speedAvg;}).slice(0,10);
  var med=['1\xba','2\xba','3\xba','4\xba','5\xba','6\xba','7\xba','8\xba','9\xba','10\xba'];

  function topBlock(title,rows,vfn){
    var html='<div style="margin-bottom:16px">'
      +'<div style="color:var(--a1);font-family:var(--fm);font-size:9px;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-weight:700">'+title+'</div>';
    rows.forEach(function(s,ii){
      var rk=title+'-'+s.id;
      var isSel=expSim===rk;
      var p3=pace(s.duration,s.distance);
      var routeN=s.note||'Simulación';
      var bg=isSel?'rgba(255,107,26,.22)':ii===0?'rgba(255,107,26,.18)':'rgba(255,255,255,.02)';
      var br=isSel?'9px 9px 0 0':'9px';
      var bdr=isSel?'rgba(255,107,26,.6)':ii===0?'rgba(255,107,26,.44)':'transparent';
      var mb=isSel?'0':'4px';
      html+='<div>'
        +'<div data-rk="'+rk+'" style="display:flex;align-items:center;gap:10px;padding:7px 10px;background:'+bg+';border-radius:'+br+';border:1px solid '+bdr+';margin-bottom:'+mb+';cursor:pointer" onclick="expSim=expSim===this.dataset.rk?null:this.dataset.rk;rContent()">'
        +'<span style="font-family:var(--fh);font-size:13px;min-width:22px;color:var(--a1);font-weight:700">'+['1º','2º','3º','4º','5º','6º','7º','8º','9º','10º'][ii]+'</span>'
        +'<div style="flex:1">'
        +'<div style="font-family:var(--fh);font-weight:700;font-size:18px;color:'+(ii===0||isSel?'var(--a1)':'var(--text)')+'">'+vfn(s)+'</div>'
        +'<div style="font-family:var(--fm);font-size:9px;color:var(--muted)">'+new Date(s.date+'T12:00:00').toLocaleDateString('es-MX',{day:'numeric',month:'short'})+' · '+routeN+'</div>'
        +'</div>'
        +'<span style="color:var(--muted);font-size:12px">'+(isSel?'▲':'▼')+'</span>'
        +'</div>';
      if(isSel){
        var det2=[
          {l:'Ruta',v:routeN,c:'var(--a1)'},
          {l:'Distancia',v:s.distance+' km',c:'var(--a1)'},
          {l:'Duración',v:fd(s.duration),c:'var(--a3)'},
          {l:'Cal.',v:s.calories+' kcal',c:'var(--a4)'},
          {l:'FC prom',v:s.hrAvg+' bpm',c:'var(--a2)'},
          p3?{l:'Pace',v:p3+' min/km',c:'var(--a5)'}:null,
          s.calMET?{l:'Cal MET',v:s.calMET+' kcal',c:'var(--wt)'}:null,
        ].filter(function(x){return x&&x.v!=null;});
        html+='<div style="background:rgba(255,107,26,.08);border:1px solid rgba(255,107,26,.3);border-top:none;border-radius:0 0 9px 9px;padding:10px 12px;margin-bottom:4px">'
          +'<div class="g3">'+det2.map(function(x){return '<div class="sm2"><div class="sl2">'+x.l+'</div><div class="sv" style="color:'+x.c+';font-size:13px">'+x.v+'</div></div>';}).join('')+'</div>'
          +'</div>';
      }
      html+='</div>';
    });
    html+='</div>';
    return html;
  }

  // Pure HTML bar charts
  var simChartHTML=(function(){
    var cfgs=[
      {lbl:'Distancia (km)',    col:'#ff6a00', fn:function(s){return s.distance;}},
      {lbl:'Velocidad (km/h)',  col:'#39ff6e', fn:function(s){return s.speedAvg;}},
      {lbl:'FC promedio (bpm)', col:'#ff4040', fn:function(s){return s.hrAvg;}},
      {lbl:'Cal MET (kcal)',    col:'#ffd700', fn:function(s){return s.calMET||s.calories;}},
    ];
    var out='<div style="margin-top:8px"><div style="font-family:var(--fm);font-size:9px;color:var(--a1);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:12px">Desempe\xf1o por sesi\xf3n</div>';
    cfgs.forEach(function(cfg){
      var vals=simSessions.map(function(s){return cfg.fn(s)||0;});
      var maxV=Math.max.apply(null,vals)||1;
      var bars=simSessions.map(function(s){
        var v=cfg.fn(s)||0;
        var h=Math.max(4,Math.round((v/maxV)*72));
        var lbl=s.note?s.note.replace('Trail ','').slice(0,7):s.date.slice(5);
        return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px">'
          +'<div style="font-family:var(--fm);font-size:7px;color:'+cfg.col+'">'+v+'</div>'
          +'<div style="width:100%;height:72px;display:flex;align-items:flex-end">'
          +'<div style="width:100%;height:'+h+'px;background:'+cfg.col+';opacity:.8;border-radius:3px 3px 0 0"></div>'
          +'</div>'
          +'<div style="font-family:var(--fm);font-size:6px;color:var(--muted2);max-width:34px;overflow:hidden;white-space:nowrap;text-align:center">'+lbl+'</div>'
          +'</div>';
      }).join('');
      out+='<div style="background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:10px;margin-bottom:10px">'
        +'<div style="font-family:var(--fm);font-size:7px;color:var(--muted2);letter-spacing:1px;margin-bottom:8px">'+cfg.lbl+'</div>'
        +'<div style="display:flex;align-items:flex-end;gap:3px">'+bars+'</div>'
        +'</div>';
    });
    out+='</div>';
    return out;
  })();

  return '<div style="display:flex;flex-direction:column;gap:0">'
    +'<div style="color:var(--a1);font-family:var(--fh);font-size:17px;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px">Simulaci\xf3n</div>'
    +'<div style="color:var(--muted);font-family:var(--fm);font-size:9px;margin-bottom:14px">'+simSessions.length+' rutas de simulaci\xf3n registradas</div>'
    +'<div class="cal-h"><button class="cal-n" onclick="prevSimM()">\u2039</button><div class="cal-t">'+mn[cM]+' '+cY+'</div><button class="cal-n" onclick="nextSimM()">\u203a</button></div>'
    +'<div class="cal-g" style="margin-bottom:8px">'
    +dn.map(function(d){return '<div class="cal-dn">'+d+'</div>';}).join('')
    +calRows
    +'</div>'
    +det
    +'<div style="margin-top:16px">'
    +topBlock('Top distancia',top10dist,function(s){return s.distance+' km';})
    +topBlock('Top velocidad',top10spd,function(s){return s.speedAvg+' km/h';})
    +'</div>'
    +simChartHTML
    +'<div style="height:20px"></div>'
    +'</div>';
}

function rEnd(){
  const endSessions=sessions.filter(s=>ENDURANCE_IDS.has(s.id)).sort((a,b)=>a.date.localeCompare(b.date));
  const mn=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const dn=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const fd2=new Date(cY,cM,1).getDay(),dim=new Date(cY,cM+1,0).getDate();
  const emap={};endSessions.forEach(s=>{emap[s.date]=s;});
  const today=new Date();
  const cells=[];for(let i=0;i<fd2;i++)cells.push('');for(let d=1;d<=dim;d++)cells.push(d);

  const calRows=cells.map((day)=>{
    if(!day)return'<div></div>';

    const s=emap[ds];
    const isTod=today.getFullYear()===cY&&today.getMonth()===cM&&today.getDate()===day;
    const isSel=selEndDay===ds;
    return`<div class="cal-c${s?' hs2':''}${isSel?' sel':''}" style="${isTod&&!isSel?'border-color:rgba(255,107,26,.4);background:rgba(255,107,26,.08);':''}" onclick="${s?`tEndDay('${ds}')`:''}" >
      <div class="cal-dots">
        ${s?`<div style="width:8px;height:8px;border-radius:50%;background:${isExt(s)?'var(--a3)':'var(--a5)'}"></div>`:''}
        ${s?`<div style="width:8px;height:8px;border-radius:50%;background:var(--a1)"></div>`:''}
      </div>
      <div class="cal-num" style="color:${s?'#e8f0fe':'#4a5568'};font-weight:${s?700:400}">${day}</div>
    </div>`;
  }).join('');

  let det='';
  if(selEndDay&&emap[selEndDay]){
    const s=emap[selEndDay];
    const p2=pace(s.duration,s.distance),ext2=isExt(s);
    const dl=new Date(selEndDay+'T12:00:00').toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
    det=`<div style="background:rgba(255,107,26,.06);border:1px solid rgba(255,107,26,.3);border-radius:14px;padding:14px 16px;margin-top:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div style="font-family:var(--fh);font-weight:700;font-size:16px;color:var(--a1);text-transform:capitalize">🏎️ ${dl}</div>
        <button onclick="selEndDay=null;rContent()" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px">✕</button>
      </div>

function rEndCharts(){
  const endS=sessions.filter(s=>ENDURANCE_IDS.has(s.id)).sort((a,b)=>a.date.localeCompare(b.date));
  if(endS.length<1)return;
  const lbl=endS.map(s=>s.date.slice(5));
  const defs=[
    {id:'ec1',data:endS.map(s=>s.distance),color:'var(--a1)',type:'bar'},
    {id:'ec2',data:endS.map(s=>s.speedAvg),color:'#ff6b1a',type:'line'},
    {id:'ec3',data:endS.map(s=>s.hrAvg),color:'#ff2020',type:'line'},

  ];
  Chart.defaults.color='#8a9bb0';Chart.defaults.font.family="'DM Mono'";Chart.defaults.font.size=9;

      type:d.type,
      data:{labels:lbl,datasets:[{data:d.data,backgroundColor:d.color+'88',borderColor:d.color,borderWidth:d.type==='line'?2:0,borderRadius:d.type==='bar'?4:0,pointRadius:3,pointHoverRadius:5,fill:false,tension:0.3,spanGaps:true}]},

}
