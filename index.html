    +'<div style="display:flex;flex-direction:column;gap:10px"><div class="sl">🏁 Hitos de pérdida de peso</div>'+rHitosHTML()+'</div>'

  let durLabel=s.rower
    ?fd(s.duration)+' TM + '+(s.rower.duration>120?(Math.floor(s.rower.duration/60)+'m '+String(s.rower.duration%60).padStart(2,'0')+'s'):s.rower.duration+'m')+' Rower'
    :fd(s.duration);
  let inclineInfo='';

      +'<div class="g3">'

        +'<div class="sm2"><div class="sl2">Cal. Rower (aj.)</div><div class="sv" style="color:var(--a4)">'+s.rower.calories+' kcal</div></div>'

    +'</div>'
    +'<div class="g3">'
      +'<div class="sm2"><div class="sl2">Cal.</div><div class="sv" style="color:var(--a4)">'+s.calories+' <span style="color:var(--muted);font-size:9px">kcal</span></div></div>'
      +'<div class="sm2"><div class="sl2">FC</div><div class="sv" style="color:var(--a2)">'+s.hrAvg+' <span style="color:var(--muted);font-size:9px">bpm</span></div></div>'
      +'<div class="sm2"><div class="sl2">Pasos</div><div class="sv" style="color:var(--a3)">'+(s.steps?s.steps.toLocaleString():'-')+'</div></div>'
      +'<div class="sm2"><div class="sl2">Vel.</div><div class="sv" style="color:var(--a1)">'+s.speedAvg+' <span style="color:var(--muted);font-size:9px">km/h</span></div></div>'

function rCal(){
  let mn=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  let dn=['Dom','Lun','Mar','Mi\xe9','Jue','Vie','S\xe1b'];
  let fd2=new Date(cY,cM,1).getDay(), dim=new Date(cY,cM+1,0).getDate();

  // Construir sets de tipos por fecha
  let smap={};
  sessions.forEach(function(s){
    if(!smap[s.date]) smap[s.date]=[];
    smap[s.date].push(!!s.inclineProfile?'sim':isExt(s)?'e':'t');
  });
  let rowerset= new Set(sessions.filter(function(s){return !!s.rower;}).map(function(s){return s.date;}));
  let plankset = new Set(sessions.filter(function(s){return !!s.plank;}).map(function(s){return s.date;}));
  let eset    = new Set(sessions.filter(function(s){return s.type==='endurance';}).map(function(s){return s.date;}));
  let simset  = new Set(sessions.filter(function(s){return !!s.inclineProfile;}).map(function(s){return s.date;}));
  let wset    = new Set(weights.map(function(w){return w.date;}));
  let today   = new Date();

  // Celdas del calendario
  let cells=[]; for(let i=0;i<fd2;i++) cells.push(''); for(let d=1;d<=dim;d++) cells.push(d);
  let calRows = cells.map(function(day){
    if(!day) return '<div></div>';
    let ds=cY+'-'+String(cM+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    let types=smap[ds]||[];
    let hasTm=types.includes('t'), hasE=types.includes('e');
    let hasSim=simset.has(ds), hasW=wset.has(ds), hasEnd=eset.has(ds), hasRow=rowerset.has(ds), hasPlankDot=plankset.has(ds);
    let isTod=today.getFullYear()===cY&&today.getMonth()===cM&&today.getDate()===day;
    let isSel=selDay===ds;
    let hasAny=types.length||hasW||hasEnd||hasSim||hasRow||hasPlankDot;
    return '<div class="cal-c'+(hasAny?' hs2':'')+(isSel?' sel':'')+'" '
      +'style="'+(isTod&&!isSel?'border-color:rgba(255,107,26,.4);background:rgba(255,107,26,.08);':'')+'" '
      +'onclick="'+(hasAny?'tDay(\''+ds+'\')':'')+'">'
      +'<div class="cal-dots">'
        +(hasTm?'<div style="width:8px;height:8px;border-radius:50%;background:var(--a5)"></div>':'')
        +(hasE?'<div style="width:8px;height:8px;border-radius:50%;background:var(--a3)"></div>':'')
        +(hasSim?'<div style="width:8px;height:8px;border-radius:2px;background:#fff;outline:2px solid #fb923c"></div>':'')
        +(hasW?'<div style="width:8px;height:8px;border-radius:50%;background:var(--wt)"></div>':'')
        +(hasEnd?'<div style="width:8px;height:8px;border-radius:50%;background:var(--a1)"></div>':'')
        +(hasRow?'<div style="width:8px;height:8px;border-radius:50%;background:#3b82f6"></div>':'')
        +(hasPlankDot?'<div style="width:8px;height:8px;border-radius:50%;background:#a855f7"></div>':'')
      +'</div>'
      +'<div class="cal-num" style="color:'+(hasAny?'#e8f0fe':'#4a5568')+';font-weight:'+(hasAny?700:400)+'">'+day+'</div>'
      +(types.length>1?'<div class="cal-cnt">'+types.length+' ses.</div>':'')
      +'</div>';
  }).join('');

  // Detalle del día seleccionado
  let det='';
  if(selDay){
    let ds2=sessions.filter(function(s){return s.date===selDay;});
    let we=weights.find(function(w){return w.date===selDay;});
    let dl=new Date(selDay+'T12:00:00').toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
    det='<div class="cal-det">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">'
        +'<div style="font-family:var(--fh);font-weight:700;font-size:16px;color:var(--a1);text-transform:capitalize">\ud83d\udcc5 '+dl+'</div>'
        +'<button onclick="selDay=null;rContent()" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px">✕</button>'
      +'</div>'
      +(we?'<div style="display:flex;align-items:center;gap:10px;background:rgba(212,130,10,.12);border:1px solid rgba(212,130,10,.3);border-radius:10px;padding:8px 12px;margin-bottom:8px">'
        +'<span>⚖️</span><span style="color:var(--muted);font-family:var(--fm);font-size:10px;text-transform:uppercase">Peso</span>'
        +'<span style="color:var(--wt);font-family:var(--fh);font-weight:700;font-size:22px;margin-left:auto">'+we.weight
        +' <span style="font-size:12px;color:var(--muted);font-weight:400">kg</span></span></div>':'')
      +ds2.map(_calSessCard).join('')
      +'</div>';
  }

  // Resúmenes
  let ms=sessions.filter(function(s){let d=new Date(s.date+'T12:00:00');return d.getFullYear()===cY&&d.getMonth()===cM;});
  let ys=sessions.filter(function(s){return new Date(s.date+'T12:00:00').getFullYear()===cY;});

  return '<div>'
    +'<div class="cal-h"><button class="cal-n" onclick="prevM()">&#8249;</button>'
    +'<div class="cal-t">'+mn[cM]+' '+cY+'</div>'
    +'<button class="cal-n" onclick="nextM()">&#8250;</button></div>'
    +'<div class="cal-leg" style="flex-wrap:wrap;gap:5px 8px;">'
      +'<div class="cal-li"><div class="dot" style="background:var(--a5)"></div><span style="color:var(--muted);font-family:var(--fm);font-size:8px">Treadmill</span></div>'
      +'<div class="cal-li"><div class="dot" style="background:var(--a3)"></div><span style="color:var(--muted);font-family:var(--fm);font-size:8px">Exterior</span></div>'
      +'<div class="cal-li"><div class="dot" style="background:var(--wt)"></div><span style="color:var(--muted);font-family:var(--fm);font-size:8px">Peso</span></div>'
      +'<div class="cal-li"><div class="dot" style="background:var(--a1)"></div><span style="color:var(--muted);font-family:var(--fm);font-size:8px">Endurance</span></div>'
      +'<div class="cal-li"><div style="width:8px;height:8px;border-radius:2px;background:#fff;outline:2px solid #fb923c;flex-shrink:0"></div><span style="color:var(--muted);font-family:var(--fm);font-size:8px">Simulaci\xf3n</span></div>'
      +'<div class="cal-li"><div class="dot" style="background:#3b82f6"></div><span style="color:var(--muted);font-family:var(--fm);font-size:8px">Rower</span></div>'
    +'</div>'
    +'<div class="cal-g">'
      +dn.map(function(d){return '<div class="cal-dn">'+d+'</div>';}).join('')
      +calRows
    +'</div>'
    +det
    +'<div style="margin-top:16px">'
      +_calSummary('\ud83d\udcc5 '+mn[cM]+' '+cY,'var(--a1)',ms)
      +_calSummary('\ud83d\udcc6 A\xf1o '+cY,'var(--a4)',ys)
      +_calSummary('\ud83c\udf10 Global','var(--a5)',sessions)
    +'</div>'
  +'</div>';
}

function prevM(){let d=new Date(cY,cM-1,1);cY=d.getFullYear();cM=d.getMonth();selDay=null;rContent();}
function nextM(){let d=new Date(cY,cM+1,1);cY=d.getFullYear();cM=d.getMonth();selDay=null;rContent();}
function tDay(ds){selDay=selDay===ds?null:ds;rContent();}

// Barra visual de perfil de inclinación
function _simInclBar(s){
  if(!s.inclineProfile) return '';
  let avgIncl=Math.round(s.inclineProfile.reduce(function(a,t){return a+(t.pct*(t.to-t.from));},0)/s.distance*10)/10;
  let segs=s.inclineProfile.map(function(t){
    let w=((t.to-t.from)/s.distance*100).toFixed(1);
    let col=t.pct>=15?'#ff2020':t.pct>=10?'#ff6b1a':t.pct>=5?'#ffa020':'#60a5fa';
    return '<div style="flex:'+w+';height:8px;background:'+col+';border-radius:2px" title="'+t.pct+'%"></div>';
  }).join('');
  return '<div style="margin-top:8px">'
    +'<div style="font-family:var(--fm);font-size:7px;color:var(--muted);letter-spacing:1px;margin-bottom:3px">PERFIL INCLINACI\xd3N \xb7 prom '+avgIncl+'%</div>'
    +'<div style="display:flex;gap:2px;align-items:stretch;border-radius:4px;overflow:hidden">'+segs+'</div>'
    +'<div style="display:flex;justify-content:space-between;font-family:var(--fm);font-size:7px;color:var(--muted);margin-top:2px"><span>0 km</span><span>'+s.distance+' km</span></div>'
    +'</div>';
}

// Bloque top-list expandible para simulaciones
function _simTopBlock(title, rows, vfn){
  let RANKS=['1\xba','2\xba','3\xba','4\xba','5\xba','6\xba','7\xba','8\xba','9\xba','10\xba'];
  let html='<div style="margin-bottom:16px">'
    +'<div style="color:var(--a1);font-family:var(--fm);font-size:9px;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-weight:700">'+title+'</div>';
  rows.forEach(function(s,ii){
    let rk=title+'-'+s.id;
    let isSel=expSim===rk;
    let p3=pace(s.duration,s.distance);
    let routeN=s.note||'Simulaci\xf3n';
    let bg=isSel?'rgba(255,107,26,.22)':ii===0?'rgba(255,107,26,.18)':'rgba(255,255,255,.02)';
    let br=isSel?'9px 9px 0 0':'9px';
    let bdr=isSel?'rgba(255,107,26,.6)':ii===0?'rgba(255,107,26,.44)':'transparent';
    html+='<div>'
      +'<div data-rk="'+rk+'" style="display:flex;align-items:center;gap:10px;padding:7px 10px;background:'+bg+';border-radius:'+br+';border:1px solid '+bdr+';margin-bottom:'+(isSel?'0':'4px')+';cursor:pointer" onclick="expSim=expSim===this.dataset.rk?null:this.dataset.rk;rContent()">'
        +'<span style="font-family:var(--fh);font-size:13px;min-width:22px;color:var(--a1);font-weight:700">'+RANKS[ii]+'</span>'
        +'<div style="flex:1">'
          +'<div style="font-family:var(--fh);font-weight:700;font-size:18px;color:'+(ii===0||isSel?'var(--a1)':'var(--text)')+'">'+vfn(s)+'</div>'
          +'<div style="font-family:var(--fm);font-size:9px;color:var(--muted)">'+new Date(s.date+'T12:00:00').toLocaleDateString('es-MX',{day:'numeric',month:'short'})+' \xb7 '+routeN+'</div>'
        +'</div>'
        +'<span style="color:var(--muted);font-size:12px">'+(isSel?'\u25b2':'\u25bc')+'</span>'
      +'</div>';
    if(isSel){
      let det2=[
        {l:'Ruta',v:routeN,c:'var(--a1)'},
        {l:'Distancia',v:s.distance+' km',c:'var(--a1)'},
        {l:'Duraci\xf3n',v:fd(s.duration),c:'var(--a3)'},
        {l:'Cal.',v:s.calories+' kcal',c:'var(--a4)'},
        {l:'FC prom',v:s.hrAvg+' bpm',c:'var(--a2)'},
        p3?{l:'Pace',v:p3+' min/km',c:'var(--a5)'}:null,
        s.calMET?{l:'Cal MET',v:s.calMET+' kcal',c:'var(--wt)'}:null,
      ].filter(function(x){return x&&x.v!=null;});
      html+='<div style="background:rgba(255,107,26,.08);border:1px solid rgba(255,107,26,.3);border-top:none;border-radius:0 0 9px 9px;padding:10px 12px;margin-bottom:4px">'
        +'<div class="g3">'+det2.map(function(x){return '<div class="sm2"><div class="sl2">'+x.l+'</div><div class="sv" style="color:'+x.c+';font-size:13px">'+x.v+'</div></div>';}).join('')+'</div>'
        +'</div>';
    }
    html+='</div>';
  });
  return html+'</div>';
}

// Gráficas CSS de desempeño por sesión de simulación
function _simCharts(simSessions){
  let cfgs=[
    {lbl:'Distancia (km)',    col:'#ff6a00', fn:function(s){return s.distance;}},
    {lbl:'Velocidad (km/h)',  col:'#39ff6e', fn:function(s){return s.speedAvg;}},
    {lbl:'FC promedio (bpm)', col:'#ff4040', fn:function(s){return s.hrAvg;}},
    {lbl:'Cal MET (kcal)',    col:'#ffd700', fn:function(s){return s.calMET||s.calories;}},
  ];
  let out='<div style="margin-top:8px"><div style="font-family:var(--fm);font-size:9px;color:var(--a1);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:12px">Desempe\xf1o por sesi\xf3n</div>';
  cfgs.forEach(function(cfg){
    let vals=simSessions.map(function(s){return cfg.fn(s)||0;});
    let maxV=Math.max.apply(null,vals)||1;
    let bars=simSessions.map(function(s){
      let v=cfg.fn(s)||0;
      let h=Math.max(4,Math.round((v/maxV)*72));
      let lbl=s.note?s.note.replace('Trail ','').slice(0,7):s.date.slice(5);
      return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px">'
        +'<div style="font-family:var(--fm);font-size:7px;color:'+cfg.col+'">'+v+'</div>'
        +'<div style="width:100%;height:72px;display:flex;align-items:flex-end">'
        +'<div style="width:100%;height:'+h+'px;background:'+cfg.col+';opacity:.8;border-radius:3px 3px 0 0"></div>'
        +'</div>'
        +'<div style="font-family:var(--fm);font-size:6px;color:var(--muted);max-width:34px;overflow:hidden;white-space:nowrap;text-align:center">'+lbl+'</div>'
        +'</div>';
    }).join('');
    out+='<div style="background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:10px;margin-bottom:10px">'
      +'<div style="font-family:var(--fm);font-size:7px;color:var(--muted);letter-spacing:1px;margin-bottom:8px">'+cfg.lbl+'</div>'
      +'<div style="display:flex;align-items:flex-end;gap:3px">'+bars+'</div>'
      +'</div>';
  });
  return out+'</div>';
}

      +'</div>'
      +'<div style="background:rgba(255,255,255,.04);border-radius:10px;padding:10px 12px;border-left:3px solid var(--a1)">'
        +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">'
          +'<div style="font-family:var(--fh);font-weight:700;font-size:13px;color:var(--a1)">'+routeName+'</div>'
          +'<div style="font-family:var(--fm);font-size:10px;color:var(--muted)">'+fd(s.duration)+' \xb7 '+s.distance+' km</div>'
        +'</div>'

        +'<div class="g3" style="margin-top:8px">'

          {l:'Distancia',v:s.distance+' km',c:'var(--a1)'},

function rEndCharts(){
  let endS=sessions.filter(s=>s.type==='endurance').sort((a,b)=>a.date.localeCompare(b.date));
  if(endS.length<1)return;
  let lbl=endS.map(s=>s.date.slice(5));
  // Para sesiones rowerOnly, leer métricas del objeto rower
  function endDist(s){return s.rowerOnly?(s.rower?s.rower.rowerDist||0:0):s.distance;}
  function endSpd(s){return s.rowerOnly?null:s.speedAvg;}
  function endHR(s){return s.rowerOnly?(s.rower?s.rower.hrAvg||0:0):s.hrAvg;}
  function endDur(s){return s.rowerOnly?(s.rower?s.rower.duration||0:0):s.duration;}
  let defs=[
    {id:'ec1',data:endS.map(endDist),color:'var(--a1)',type:'bar'},
    {id:'ec2',data:endS.map(endSpd),color:'#ff6b1a',type:'line'},
    {id:'ec3',data:endS.map(endHR),color:'#ff2020',type:'line'},
    {id:'ec4',data:endS.map(endDur),color:'#60a5fa',type:'bar'},
  ];
  Chart.defaults.color='#8a9bb0';Chart.defaults.font.family="'DM Mono'";Chart.defaults.font.size=9;
  defs.forEach(d=>{
    let ctx=document.getElementById(d.id);if(!ctx)return;
    destroyChart(d.id);
    charts[d.id]=new Chart(ctx,{
      type:d.type,
      data:{labels:lbl,datasets:[{data:d.data,backgroundColor:d.color+'88',borderColor:d.color,borderWidth:d.type==='line'?2:0,borderRadius:d.type==='bar'?4:0,pointRadius:3,pointHoverRadius:5,fill:false,tension:0.3,spanGaps:true}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:'#0a0a0a',borderColor:d.color+'44',borderWidth:1}},scales:{x:{grid:{color:'rgba(255,255,255,.05)'}},y:{grid:{color:'rgba(255,255,255,.05)'}}}}
    });
  });
}

// RB: ranking block con podio visual (TM/Exterior)
function _RB(title, icon, rows, vfn, color) {
  if(!rows.length) return '';
  let podiumHTML = '';
  if(rows.length >= 2){
    let heights=['58px','44px','32px'];
    let bgs=['rgba(255,215,0,.1)','rgba(180,180,180,.08)','rgba(180,100,30,.08)'];
    let borders=['rgba(255,215,0,.3)','rgba(180,180,180,.2)','rgba(180,100,30,.2)'];
    let cols=['#ffd700','#c0c0c0','#b4641e'];
    podiumHTML = '<div class="podium-wrap">';
    rows.slice(0, Math.min(3, rows.length)).forEach(function(s, i){
      podiumHTML += '<div class="podium-col">'
        +'<div class="podium-bar" style="height:'+heights[i]+';background:'+bgs[i]+';border:1px solid '+borders[i]+'">'
          +'<div class="podium-medal">'+_MED[i]+'</div>'
          +'<div class="podium-val" style="color:'+cols[i]+'">'+vfn(s)+'</div>'
          +'<div class="podium-sub">'+fdshort(s.date)+'</div>'
        +'</div>'
      +'</div>';
    });
    podiumHTML += '</div>';
  }
  let listHTML = '<div class="podium-list">';
  rows.slice(rows.length>=2 ? 3 : 0).forEach(function(s, i){
    let ri = i + (rows.length>=2 ? 3 : 0);
    listHTML += '<div class="podium-list-row">'
      +'<span class="podium-list-rank">'+_MED[ri]+'</span>'
      +'<span class="podium-list-val" style="color:'+color+'">'+vfn(s)+'</span>'
      +'<span class="podium-list-date">'+fdshort(s.date)+'</span>'

function rRecs(){
  let tread    = sessions.filter(function(s){return !isExt(s);});
  let rowerSess= sessions.filter(function(s){return !!s.rower;});
  let top5 = function(arr,k,o){
    return arr.slice().filter(function(s){return s[k]!=null&&s[k]>0;})
      .sort(function(a,b){return o==='asc'?a[k]-b[k]:b[k]-a[k];}).slice(0,10);
  };
  let top5p = function(arr){
    return arr.slice().filter(function(s){return s.duration&&s.distance;})
      .map(function(s){return Object.assign({},s,{_pace:(s.duration*60)/s.distance});})
      .sort(function(a,b){return a._pace-b._pace;}).slice(0,10);
  };
  let top5r = function(k,o){
    return rowerSess.slice().filter(function(s){return s.rower[k]!=null;})
      .sort(function(a,b){return o==='asc'?a.rower[k]-b.rower[k]:b.rower[k]-a.rower[k];}).slice(0,10);

  let subTabs = '<div class="stabs">'+['General','Treadmill','Rower'].map(function(t){

      +_RB('Mejor pace','<svg class="ico-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',top5p(arr),function(s){return pace(s.duration,s.distance)+' min/km';},'var(--a5)')
      +_RB('Pasos','<svg class="ico-sm" viewBox="0 0 24 24"><path d="M4 16v-2.38C4 11.5 2.97 10.43 3 8c.03-2.69 2.2-4.48 5-4.5 3.9-.03 6 2 7 4.5l4 7"/><path d="M12 16v-2.38C12 11.5 10.97 10.43 11 8"/><circle cx="7" cy="20" r="2"/><circle cx="17" cy="20" r="2"/></svg>',top5(arr,'steps','desc'),function(s){return s.steps.toLocaleString();},'var(--a3)');

      +_SC(_ICO.cal,'Cal. prom.',Math.round(tTM.cal/tTM.n),'kcal','var(--a4)')+_SC(_ICO.steps,'Pasos prom.',Math.round(tTM.steps/tTM.n).toLocaleString(),'','var(--a3)')

function _totsRower(){
  let rs=sessions.filter(function(s){return !!s.rower;});
  if(!rs.length) return '<div class="empty">Sin sesiones de rower a\xfan.</div>';
  let normDur=function(d){return d>120?Math.round(d/60):d;};
  let totDur=rs.reduce(function(a,s){return a+normDur(s.rower.duration);},0);
  let totCal=rs.reduce(function(a,s){return a+s.rower.calories;},0);
  let avgFC=Math.round(rs.reduce(function(a,s){return a+s.rower.hrAvg*normDur(s.rower.duration);},0)/totDur);
  let avgRes=Math.round(rs.reduce(function(a,s){return a+s.rower.resistance;},0)/rs.length*10)/10;
  let totalRows=rs.reduce(function(a,s){return a+(s.rower.rows||0);},0);
  let totalRDist=rs.reduce(function(a,s){return a+(s.rower.rowerDist||0);},0);
  return '<div style="color:#22c55e;font-family:var(--fh);font-size:16px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:2px">'+_ICO.row+' Rower</div>'
    +'<div class="g2">'
      +_SC(_ICO.row,'Sesiones Rower',rs.length,'','#22c55e')+_SC(_ICO.time,'Tiempo total',fd(totDur),'','#22c55e')
      +_SC(_ICO.cal,'Calor\xedas',totCal.toLocaleString(),'kcal','#4ade80')+_SC(_ICO.hr,'FC promedio',avgFC,'bpm','var(--a2)')
      +_SC(_ICO.fat,'Resistencia prom.',avgRes,'nivel','#22c55e')+_SC(_ICO.time,'Duraci\xf3n prom.',fd(Math.round(totDur/rs.length)),'','#22c55e')
      +(rs.some(function(s){return s.rower.rows;})?_SC(_ICO.bars,'Rows totales',totalRows,'rows','#22c55e'):'')
      +(rs.some(function(s){return s.rower.rowerDist;})?_SC(_ICO.dist,'Dist. total rower',totalRDist.toFixed(2),'km','#4ade80'):'')
    +'</div>';
}

function rTots(){
  let t=tots(sessions);
  let streak2=getStreaks();
  let thisW=weekSessions(0),lastW=weekSessions(1);
  let subTabs='<div class="stabs">'+['General','Treadmill','Rower'].map(function(tab){
    return '<button class="stb'+(totSub===tab?' on':'')+'" onclick="totSub=\''+tab+'\';rContent()">'
      +(tab==='Treadmill'?_ICO.tm:tab==='Rower'?_ICO.row:_ICO.bars)+' '+tab+'</button>';
  }).join('')+'</div>';
  let content='';
  if(totSub==='General') content=_totsGeneral(t,streak2,thisW,lastW);
  if(totSub==='Treadmill') content=_totsTM();
  if(totSub==='Rower') content=_totsRower();
  return '<div style="display:flex;flex-direction:column;gap:10px">'+subTabs+content+'</div>';
}

function rComidaCharts(){
  let recs=KCAL_RECORDS;
  let keys=Object.keys(recs).sort().slice(-20);
  if(!keys.length)return;
  let lbl=keys.map(function(k){return k.slice(5);});
  let goal=2000;
  let defs=[
    {id:'fc-kcal',data:keys.map(function(k){return recs[k].kcal;}),color:'#c084fc',goal:goal},
    {id:'fc-prot',data:keys.map(function(k){return recs[k].prot;}),color:'#5bc4ff'},
    {id:'fc-carbs',data:keys.map(function(k){return recs[k].carbs;}),color:'#39ff6e'},
    {id:'fc-fat',data:keys.map(function(k){return recs[k].fat;}),color:'#ffa020'},
  ];
  Chart.defaults.color='#8a9bb0';Chart.defaults.font.family="'DM Mono'";Chart.defaults.font.size=9;
  defs.forEach(function(d){
    let ctx=document.getElementById(d.id);if(!ctx)return;
    destroyChart(d.id);
    let datasets=[{data:d.data,backgroundColor:d.color+'88',borderColor:d.color,borderWidth:1,borderRadius:4,type:'bar'}];
    if(d.goal)datasets.push({data:Array(lbl.length).fill(d.goal),borderColor:d.color+'66',borderWidth:1,borderDash:[4,4],type:'line',pointRadius:0,fill:false});
    charts[d.id]=new Chart(ctx,{
      type:'bar',
      data:{labels:lbl,datasets:datasets},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:'#0a0a0a',borderColor:d.color+'44',borderWidth:1}},scales:{x:{grid:{color:'rgba(255,255,255,.05)'},ticks:{maxRotation:45}},y:{grid:{color:'rgba(255,255,255,.05)'}}}}
    });
  });
}

function getTierBadge(tierName, unlocked, size) {
  let sz = size || 64;
  // Map tier name to T1-T11 key
  let tierMap = {
    'UAC Recruit':'T1','Phobos Marine':'T2','Sentinel':'T3',
    'Hell Knight':'T4','Baron of Hell':'T5','Arch-Vile':'T6',
    'Khan Maykr':'T7','Icon of Sin':'T8','Doom Slayer':'T9',
    'Father':'T10','Dark Lord':'T11'
  };
  let key = tierMap[tierName];
  if (!key || !TIER_BADGES[key]) return '';
  let filt = unlocked
    ? 'filter:drop-shadow(0 0 8px currentColor)'
    : 'filter:grayscale(1) brightness(0.2) contrast(1.1)';
  return '<img src="'+TIER_BADGES[key]+'" style="width:'+sz+'px;height:'+sz+'px;object-fit:contain;'+filt+'" />';
}

function computeXP() {
  let xp = 0;
  sessions.forEach(function(s) { xp += 20; });
  let cw = weights.length ? weights[weights.length-1].weight : null;
  if (cw && cw <= 95) xp += 100;
  if (cw && cw <= 90) xp += 100;
  if (cw && cw <= 85) xp += 100;
  let achs = buildAchievements();
  achs.forEach(function(a) { if (a.done) xp += 50; });
  let tierNames = ['UAC Recruit','Phobos Marine','Sentinel','Hell Knight','Baron of Hell',
    'Arch-Vile','Khan Maykr','Icon of Sin','Doom Slayer','Father','Dark Lord'];
  tierNames.forEach(function(tn) {
    let ta = achs.filter(function(a){return a.tier===tn;});
    if (ta.length && ta.every(function(a){return a.done;})) xp += 300;
  });
  return xp;
}

function getCurrentLevel(xp) {
  let cur = LEVELS_DATA[0];
  for(let i = 0; i < LEVELS_DATA.length; i++) {
    if (xp >= LEVELS_DATA[i].xp) cur = LEVELS_DATA[i];
    else break;
  }
  return cur;
}

function getNextLevel(xp) {
  for(let i = 0; i < LEVELS_DATA.length; i++) {
    if (xp < LEVELS_DATA[i].xp) return LEVELS_DATA[i];
  }
  return LEVELS_DATA[LEVELS_DATA.length - 1];
}

// ── DOOM ACHIEVEMENTS — each assigned to a level range ───────────
function achCompletedOn(a,sess,wts,rSess){
  if(!a.done)return null;
  let cat=a.cat||'';
  let sorted=[].concat(sess).sort(function(a,b){return a.date<b.date?-1:1;});
  // Weight milestones
  if(cat==='Peso'){
    let target=a.goal;
    for(let i=0;i<wts.length;i++){if(wts[i].weight<=target)return wts[i].date;}
  }
  // Session count milestones
  if(cat==='Sesiones'){
    let allDates=[];
    sess.filter(function(s){return !s.rowerOnly;}).forEach(function(s){allDates.push(s.date);});
    rSess.filter(function(s){return !s.rowerOnly;}).forEach(function(s){allDates.push(s.date);});
    sess.filter(function(s){return s.rowerOnly;}).forEach(function(s){allDates.push(s.date);});
    allDates.sort();
    if(allDates.length>=a.goal)return allDates[a.goal-1];
  }
  // Cumulative distance
  if(cat==='Distancia'&&a.goal>1){
    let acc=0;
    for(let j=0;j<sorted.length;j++){acc+=(sorted[j].distance||0);if(acc>=a.goal)return sorted[j].date;}
  }
  // Remo distance
  if(cat==='Remo'){
    let accR=0,sortedR=[].concat(rSess).sort(function(a,b){return a.date<b.date?-1:1;});
    for(let k=0;k<sortedR.length;k++){
      accR+=(sortedR[k].rower&&sortedR[k].rower.rowerDist?sortedR[k].rower.rowerDist:0);
      if(accR>=a.goal)return sortedR[k].date;
    }
  }
  // Duration milestones: find first session meeting threshold
  if(cat==='Duraci\xc3\xb3n'&&a.goal<=180){
    for(let m=0;m<sorted.length;m++){if((sorted[m].duration||0)>=a.goal)return sorted[m].date;}
  }
  // Calories single session
  if(cat==='Calor\xc3\xadas'&&a.goal<=1000){
    for(let n=0;n<sorted.length;n++){if((sorted[n].calories||0)>=a.goal)return sorted[n].date;}
  }
  // Fallback: date of last session
  return sorted.length?sorted[sorted.length-1].date:null;
}

  {cat:'Pasos', tier:'Arch-Vile', name:'Vile Steps', desc:'300,000 pasos totales.', ico:'activity', col:'#ff4040', done:t.steps>=300000, prog:Math.min(t.steps,300000), goal:300000},
  {cat:'Duración', tier:'Khan Maykr', name:'Maykr Endurance', desc:'30 sesiones de 90+ minutos.', ico:'clock', col:'#ffd700', done:totalSessMin90>=30, prog:Math.min(totalSessMin90,30), goal:30},
  {cat:'Remo', tier:'Icon of Sin', name:'Icon Rower', desc:'10 sesiones de remo con resistencia 10.', ico:'award', col:'#cc1100', done:resR10>=10, prog:Math.min(resR10,10), goal:10},
  {cat:'Pasos', tier:'Doom Slayer', name:'Slayer Steps', desc:'750,000 pasos totales.', ico:'activity', col:'#ff6b1a', done:t.steps>=750000, prog:Math.min(t.steps,750000), goal:750000},
  ];
  achs.forEach(function(a){if(a.done)a.completedOn=achCompletedOn(a,sessions,weights,rSess);});
  return achs;
}

function rAchievements() {
  let xp = computeXP();
  let cur = getCurrentLevel(xp);
  let nxt = getNextLevel(xp);
  let pct = nxt.n > cur.n ? Math.round(((xp - cur.xp) / (nxt.xp - cur.xp)) * 100) : 100;
  let achs = buildAchievements();

  if (achViewLevel !== null) {
    return rAchLevelDrill(achViewLevel, achs, xp, cur);
  }
  return rAchOverview(achs, xp, cur, nxt, pct);
}

function buildTierPanel(tier, achs, cur) {
  let tierAchs = achs.filter(function(a){ return a.tier === tier.name; });
  let tierDone = tierAchs.filter(function(a){ return a.done; }).length;
  let tierPct  = Math.round((tierDone / Math.max(1, tierAchs.length)) * 100);
  let isUnlocked = cur.n >= tier.n1;
  let badge = getTierBadge(tier.name, isUnlocked, 58);
  let html = '';

  // Tier header card
  html += '<div onclick="enterTierDrill('+tier.n1+')" style="cursor:pointer;background:'+tier.col+'10;border:1px solid '+tier.col+'33;border-radius:10px;padding:10px 12px;margin-bottom:10px;position:relative;overflow:hidden">'
    + (badge ? '<div style="position:absolute;right:8px;top:50%;transform:translateY(-50%);opacity:'+(isUnlocked?.65:.15)+';color:'+tier.col+'">'+badge+'</div>' : '')
    + '<div style="font-family:var(--fh);font-size:16px;font-weight:900;color:'+tier.col+';text-shadow:0 0 8px '+tier.col+'44;letter-spacing:1px">'+tier.name.toUpperCase()+'</div>'
    + '<div style="font-family:var(--fm);font-size:8px;color:#888;margin-top:2px">'+tierDone+'/'+tierAchs.length+' logros desbloqueados</div>'
    + '<div style="background:rgba(255,255,255,.05);border-radius:2px;height:3px;margin-top:6px;overflow:hidden">'
    + '<div style="width:'+tierPct+'%;height:100%;background:'+tier.col+'"></div></div>'
    + '</div>';

  // Achievement list — flat, no sublevels
  html += '<div style="display:flex;flex-direction:column;gap:5px">';
  tierAchs.forEach(function(a) {
    let p = a.goal > 1 ? Math.min(100, Math.round((a.prog / a.goal) * 100)) : (a.done ? 100 : 0);
    html += '<div style="background:'+(a.done?a.col+'12':'rgba(255,255,255,.02)')+';border:1px solid '+(a.done?a.col+'2a':'#1a1a1a')+';border-radius:8px;padding:9px 11px;display:flex;align-items:center;gap:9px">'
      + '<div style="opacity:'+(a.done?1:.3)+'">'+achIco(a.ico,a.col)+'</div>'
      + '<div style="flex:1">'
      + '<div style="font-family:var(--fh);font-size:13px;font-weight:700;color:'+(a.done?'#e8e8e8':'#666')+'">'+a.name+'</div>'
      + '<div style="font-family:var(--fm);font-size:7.5px;color:#777;margin-top:1px">'+a.desc+'</div>'
      + (a.done && a.completedOn ? '<div style="font-family:var(--fm);font-size:7px;color:'+a.col+'88;margin-top:2px"> '+a.completedOn+'</div>' : '')
      + (!a.done && a.goal > 1 ? '<div style="display:flex;align-items:center;gap:5px;margin-top:4px"><div style="flex:1;background:#111;border-radius:2px;height:2px;overflow:hidden"><div style="width:'+p+'%;height:100%;background:'+a.col+'88"></div></div><div style="font-family:var(--fm);font-size:7px;color:'+a.col+'99;white-space:nowrap">'+(typeof a.prog==='number'?Math.round(a.prog*10)/10:a.prog)+'/'+a.goal+'</div></div>' : '')
      + '</div>'
      + (a.done
          ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#39ff6e" stroke-width="2.5" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg>'
          : '<div style="font-family:var(--fm);font-size:8px;color:#555">'+p+'%</div>')

  });
  html += '</div>';
  return html;
}

// Calcular datos semanales desde SS dinámicamente
function _rvWeekData(){
  let wmap={};
  sessions.forEach(function(s){
    let d=new Date(s.date+'T12:00:00');
    let mon=new Date(d);mon.setDate(d.getDate()-((d.getDay()+6)%7));
    let key=mon.toISOString().slice(0,10);
    if(!wmap[key])wmap[key]={km:0,ses:0};
    wmap[key].km+=s.distance||0;
    wmap[key].ses+=1;
  });
  return Object.keys(wmap).sort().map(function(k,i){
    return{w:'S'+(i+1),km:Math.round(wmap[k].km*10)/10,ses:wmap[k].ses};
  });
}

// Heatmap calculado dinámicamente desde SS
// ── Heatmap anual — estado global ────────────────────────────────
let _hmWeeks = [], _hmWIN = 10, _hmToday = '';

function hmRender(offset){
  offset = Math.max(0, Math.min(_hmWeeks.length - _hmWIN, offset));
  var sl = document.getElementById('hm-slider');
  if(sl){ sl.max = _hmWeeks.length - _hmWIN; sl.value = offset; }
  var grid = document.getElementById('hm-grid');
  var mlbl = document.getElementById('hm-month-labels');
  if(!grid || !mlbl) return;
  var MN = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  // WIN se calculará en el setTimeout cuando el DOM esté listo
  var gap = 2;
  var cellSize = 11;
  var html = '', mhtml = '', lastM = -1;
  for(var w = offset; w < offset + _hmWIN; w++){
    var week = _hmWeeks[w];
    var m = new Date(week[0].ds + 'T12:00:00').getMonth();
    mhtml += '<div style="width:' + cellSize + 'px;font-family:var(--fm);font-size:7px;color:var(--muted);overflow:hidden;text-align:center;flex-shrink:0">' + (m !== lastM ? MN[m] : '') + '</div>';
    lastM = m;
    html += '<div style="display:flex;flex-direction:column;gap:' + gap + 'px;flex-shrink:0">';
    for(var d = 0; d < 7; d++){
      var day = week[d];
      var bg = day.o ? 'transparent' : day.a ? 'rgba(255,107,26,.85)' : day.f ? 'rgba(255,255,255,.03)' : 'rgba(255,255,255,.08)';
      var bdr = day.ds === _hmToday ? '2px solid rgba(255,107,26,.9)' : 'none';
      html += '<div style="width:' + cellSize + 'px;height:' + cellSize + 'px;border-radius:3px;background:' + bg + ';border:' + bdr + '"></div>';
    }
    html += '</div>';
  }
  grid.innerHTML = html;
  mlbl.innerHTML = mhtml;
}

function hmScroll(dir){

function _rvHeatmap(activeDays){
  var dateSet = new Set(sessions.map(function(s){ return s.date; }));
  var today = new Date();
  _hmToday = today.toISOString().slice(0,10);
  var year = today.getFullYear();
  var jan1 = new Date(year, 0, 1);
  var dow = jan1.getDay();
  var offsetToMon = (dow === 0) ? -6 : 1 - dow;
  var start = new Date(jan1);
  start.setDate(jan1.getDate() + offsetToMon);
  var numWeeks = 53;
  _hmWeeks = [];
  for(var w = 0; w < numWeeks; w++){
    var week = [];
    for(var d = 0; d < 7; d++){
      var cur = new Date(start);
      cur.setDate(start.getDate() + w*7 + d);
      var ds = cur.toISOString().slice(0,10);
      week.push({ds:ds, a:dateSet.has(ds)?1:0, f:ds>_hmToday?1:0, o:cur.getFullYear()!==year?1:0});
    }
    _hmWeeks.push(week);
  }
  var msPerWeek = 7*24*3600*1000;
  var currentWeekIdx = Math.floor((today - start) / msPerWeek);
  var initOffset = Math.max(0, Math.min(numWeeks - _hmWIN, currentWeekIdx - _hmWIN + 1));
  var DN = ['L','M','X','J','V','S','D'];
  var dayLbls = '<div style="display:flex;flex-direction:column;gap:2px;margin-right:2px;flex-shrink:0">'
    + DN.map(function(d){ return '<div style="height:9px;font-family:var(--fm);font-size:7px;color:var(--muted);line-height:9px;width:8px">'+d+'</div>'; }).join('')
    + '</div>';
  setTimeout(function(){
    // Medir el ancho real del wrap ya renderizado en el DOM
    var wrap = document.getElementById('hm-wrap');
    if(wrap) {
      var gap = 2;
      var cellSize = 11;
      var dayLblW = 20;
      var avail = wrap.offsetWidth - dayLblW - 4;
      var dynWIN = Math.floor((avail + gap) / (cellSize + gap));
      _hmWIN = Math.max(8, Math.min(53, dynWIN));
    }
    hmRender(initOffset);
  }, 80);
  return '<div id="hm-wrap" style="overflow:hidden;width:100%">'
    + '<div style="display:flex;gap:2px;margin-bottom:4px;padding-left:18px" id="hm-month-labels"></div>'
    + '<div style="display:flex;gap:2px;align-items:flex-start">' + dayLbls + '<div style="display:flex;gap:2px" id="hm-grid"></div></div>'
    + '<div style="margin-top:8px;display:flex;align-items:center;gap:8px">'
      + '<button onclick="hmScroll(-1)" style="background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:6px;color:var(--text);width:26px;height:26px;cursor:pointer;font-size:14px;flex-shrink:0">&#8249;</button>'
      + '<input type="range" id="hm-slider" min="0" max="' + (numWeeks-_hmWIN) + '" value="' + initOffset + '" oninput="hmRender(parseInt(this.value))" style="flex:1;height:4px;accent-color:var(--a1);cursor:pointer">'
      + '<button onclick="hmScroll(1)" style="background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:6px;color:var(--text);width:26px;height:26px;cursor:pointer;font-size:14px;flex-shrink:0">&#8250;</button>'
    + '</div>'
    + '<div style="display:flex;justify-content:space-between;margin-top:6px;align-items:center">'
      + '<span style="font-family:var(--fm);font-size:9px;color:var(--muted)">' + activeDays + ' dias activos en ' + year + '</span>'
      + '<div style="display:flex;gap:3px;align-items:center"><span style="font-family:var(--fm);font-size:7px;color:var(--muted)">Menos</span>'
      + '<div style="width:9px;height:9px;border-radius:2px;background:rgba(255,107,26,.08)"></div>'
      + '<div style="width:9px;height:9px;border-radius:2px;background:rgba(255,107,26,.3)"></div>'
      + '<div style="width:9px;height:9px;border-radius:2px;background:rgba(255,107,26,.6)"></div>'
      + '<div style="width:9px;height:9px;border-radius:2px;background:rgba(255,107,26,.85)"></div>'
      + '<span style="font-family:var(--fm);font-size:7px;color:var(--muted)">Mas</span></div>'
    + '</div></div>';
}

function rReview(){
  let t=tots(sessions);
  let cw=weights.length?parseFloat(weights[weights.length-1].weight):null;
  let sw=weights.length?weights[0].weight:null;
  let lost=(sw&&cw)?(sw-cw).toFixed(2):null;
  let activeDays=new Set(sessions.map(function(s){return s.date;})).size;
  let totalDurR=sessions.reduce(function(a,s){
    let rd=s.rower?(s.rower.duration>120?Math.round(s.rower.duration/60):s.rower.duration):0;
    return a+(s.duration||0)+rd;
  },0);
  let streakR=getStreaks();
  let velR=(function(){
    let n=0,sum=0;
    sessions.forEach(function(s){if(s.speedAvg>0){sum+=s.speedAvg;n++;}});
    return n>0?(sum/n).toFixed(1):0;
  })();
  let paceR=t.dist>0?(totalDurR/t.dist).toFixed(1):0;
  let hh=Math.floor(totalDurR/60),mm=Math.round(totalDurR%60);

  // ── KPIs ──
  let kpiHTML='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">'
    +_rvKPI(t.dist.toFixed(1),'km','DISTANCIA TOTAL','^ acum. todas las sesiones','var(--a1)','rgba(255,107,26,.2)')
    +_rvKPI(lost?'-'+lost:'--','kg','PESO PERDIDO',sw&&cw?sw.toFixed(1)+' -> '+cw.toFixed(1)+' kg':'--','var(--a3)','rgba(57,255,110,.2)')
    +_rvKPI(t.n,'ses','SESIONES TOTALES','~ '+((t.n/activeDays)).toFixed(1)+'/dia activo','var(--a4)','rgba(100,180,255,.2)')
    +_rvKPI((t.cal/1000).toFixed(1)+'k','cal','CAL QUEMADAS','~'+(t.cal/7700).toFixed(1)+' kg grasa','var(--wt)','rgba(212,130,10,.2)')
    +'</div>';

  // ── Stats ──
  // Remo totales
  let rowerSess = sessions.filter(function(s){ return s.rower; });
  let rowerDist = rowerSess.reduce(function(a,s){ return a+(s.rower.rowerDist||0); },0);
  let rowerRows = rowerSess.reduce(function(a,s){ return a+(s.rower.rows||0); },0);
  let totalSteps = sessions.reduce(function(a,s){ return a+(s.steps||0); },0);
  let totalHH = Math.floor(t.dur/60);
  let totalMM = Math.round(t.dur%60);

  let statsHTML='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">'
    +_rvStat(streakR.cur,'dias','RACHA','Max '+streakR.max+' dias','var(--a1)',22)
    +_rvStat(hh,'horas','TIEMPO',hh+'h '+mm+'m activas','var(--a3)',22)
    +'</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px">'
    +_rvStat(t.dist.toFixed(0),'km','DISTANCIA','total TM','var(--a1)',18)
    +_rvStat(paceR,"'",'PACE','min/km','var(--a4)',18)
    +_rvStat(velR,'km/h','VEL','promedio','var(--a2)',18)
    +'</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px">'
    +_rvStat(totalHH+'h '+totalMM+'m','','HORAS TOTAL','todas las sesiones','var(--a3)',16)
    +_rvStat((totalSteps/1000).toFixed(1)+'k','pasos','PASOS TOTAL','acumulados','var(--a4)',16)
    +_rvStat(rowerDist.toFixed(1),'km','REMO DIST',rowerRows.toLocaleString()+' paladas','#39ff6e',16)
    +'</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">'
    +_rvStat(
      (function(){
        let ps=sessions.filter(function(s){return !!s.plank;});
        let tot=ps.reduce(function(a,s){return a+(s.plank.duration||0);},0);
        let hh=Math.floor(tot/60), mm=Math.round(tot%60);
        return hh>0?hh+'h '+mm+'m':tot+'m';
      })(),
      '', 'PLANK TOTAL', sessions.filter(function(s){return !!s.plank;}).length+' sesiones', '#a855f7', 16
    )
    +_rvStat(
      (function(){
        let ps=sessions.filter(function(s){return !!s.plank;});
        if(!ps.length) return '—';
        let max=Math.max.apply(null,ps.map(function(s){return s.plank.duration||0;}));

  // ── Sparkline peso ──

  let dataPts=radarAxes.map(function(ax,i){let p=toXY(i*60,ax.val*0.65);return p.x.toFixed(1)+','+p.y.toFixed(1);}).join(' ');
  let dotsSVG=radarAxes.map(function(ax,i){let p=toXY(i*60,ax.val*0.65);return '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="3" fill="var(--a1)"/>';}).join('');
  let lblsSVG=radarAxes.map(function(ax,i){let p=toXY(i*60,77);return '<text x="'+p.x.toFixed(1)+'" y="'+p.y.toFixed(1)+'" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="7" fill="rgba(255,255,255,.45)">'+ax.label+'</text>';}).join('');
  let radarSVG='<svg width="155" height="155" viewBox="-80 -80 160 160" style="flex-shrink:0">'+gridSVG+'<polygon points="'+dataPts+'" fill="rgba(255,107,26,.15)" stroke="var(--a1)" stroke-width="2"/>'+dotsSVG+lblsSVG+'</svg>';
  let radarBars='<div style="flex:1">';

  });
  radarBars+='</div>';

  // ── Trayectoria de peso SVG ──
  let wgtSVG='<svg width="100%" height="130" viewBox="0 0 280 130">'

    +'<line x1="0" y1="46" x2="255" y2="46" stroke="rgba(57,255,110,.25)" stroke-width="1" stroke-dasharray="4,3"/>'
    +'<line x1="0" y1="69" x2="255" y2="69" stroke="rgba(255,160,32,.25)" stroke-width="1" stroke-dasharray="4,3"/>'
    +'<line x1="0" y1="92" x2="255" y2="92" stroke="rgba(255,107,26,.25)" stroke-width="1" stroke-dasharray="4,3"/>'
    +'<polygon points="0,8 25,14 50,21 80,18 100,25 130,32 160,38 185,42 200,47 220,51 248,55 248,115 0,115" fill="url(#wgr)"/>'
    +'<polyline points="0,8 25,14 50,21 80,18 100,25 130,32 160,38 185,42 200,47 220,51 248,55" fill="none" stroke="var(--a1)" stroke-width="2.5"/>'
    +'<circle cx="248" cy="55" r="4" fill="var(--a1)" stroke="#fff" stroke-width="1.5"/>'
    +'<text x="2" y="13" font-family="monospace" font-size="7" fill="rgba(255,255,255,.3)">'+(sw?sw.toFixed(0):'102')+'</text>'

  return _rvSec('Dashboard ejecutivo',_rvCard(kpiHTML+statsHTML+sparksHTML))

    +_rvSec('Trayectoria de peso',_rvCard(

function checkMonthlySummary(){
  let today=new Date();
  let cm=today.getMonth();
  let cy=today.getFullYear();
  let lastKey='monthlySeen_'+cy+'_'+cm;
  if(localStorage.getItem(lastKey))return;
  let prevM=cm===0?11:cm-1;
  let prevY=cm===0?cy-1:cy;
  let pad=function(n){return n<10?'0'+n:n;};
  let fromDate=prevY+'-'+pad(prevM+1)+'-01';
  let toDate=prevY+'-'+pad(prevM+1)+'-'+new Date(prevY,prevM+1,0).getDate();
  let mSessions=sessions.filter(function(s){return s.date>=fromDate&&s.date<=toDate;});
  if(!mSessions.length)return;
  localStorage.setItem(lastKey,'1');
  let MN=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  let totalDist=mSessions.reduce(function(a,s){return a+(s.distance||0);},0).toFixed(1);
  let totalMin=mSessions.reduce(function(a,s){return a+(s.duration||0);},0);
  let totalCal=mSessions.reduce(function(a,s){return a+(s.calories||0);},0);
  let totalSteps=mSessions.reduce(function(a,s){return a+(s.steps||0);},0);
  let h=Math.floor(totalMin/60),m=totalMin%60;
  let bestDist=mSessions.reduce(function(a,s){return s.distance>a.distance?s:a;},mSessions[0]);
  let mmT=document.getElementById('mm-title');let mmS=document.getElementById('mm-sub');let mmG=document.getElementById('mm-grid');let mmB=document.getElementById('mm-best');if(!mmT)return;mmT.textContent='🏅 '+MN[prevM]+' '+prevY;
  mmS.textContent=mSessions.length+' sesiones completadas';
  mmG.innerHTML=[
    {v:totalDist+' km',k:'Distancia total',c:'var(--a4)'},
    {v:(h>0?h+'h ':'')+m+'m',k:'Tiempo total',c:'var(--a3)'},
    {v:totalCal+' cal',k:'Calorías',c:'var(--a1)'},
    {v:totalSteps.toLocaleString(),k:'Pasos',c:'var(--a2)'},
  ].map(function(s){
    return '<div class="mm-stat"><div class="mm-stat-v" style="color:'+s.c+'">'+s.v+'</div><div class="mm-stat-k">'+s.k+'</div></div>';
  }).join('');
  mmB.innerHTML=bestDist&&bestDist.distance>0?
    '<div style="background:rgba(255,107,26,.08);border:1px solid rgba(255,107,26,.2);border-radius:10px;padding:10px;margin-bottom:8px;text-align:center"><div style="font-family:var(--fm);font-size:9px;color:var(--muted);margin-bottom:4px">MEJOR SESIÓN</div><div style="font-family:var(--fh);font-size:16px;font-weight:900;color:var(--a1)">'+bestDist.distance+' km</div><div style="font-family:var(--fm);font-size:9px;color:var(--muted)">'+bestDist.date+'</div></div>':'';
  setTimeout(function(){document.getElementById('monthly-overlay').classList.add('on');},1500);
}

// ── ESTADO ──────────────────────────────────────────────────────
let WZ_STATE = {};
let WZ_CAL_Y=new Date().getFullYear(),WZ_CAL_M=new Date().getMonth();

// ── STEPS ACTIVOS ────────────────────────────────────────────────
function wzGetSteps(){
  let s=['fecha','tipo'];
  if(WZ_STATE.tipos.includes('tm'))  s.push('detalle_tm');
  if(WZ_STATE.tipos.includes('ext')) s.push('detalle_ext');
  if(WZ_STATE.tipos.includes('row'))   s.push('detalle_row');
  if(WZ_STATE.tipos.includes('plank')) s.push('detalle_plank');
  s.push('totales_dia');
  s.push('resumen');
  return s;
}
const TITLES={fecha:'¿Cuándo?',tipo:'¿Qué hiciste?',detalle_tm:'Treadmill',detalle_ext:'Exterior',detalle_row:'Rower',detalle_plank:'Plank',totales_dia:'Totales del día',resumen:'Resumen'};

// ── RENDER ───────────────────────────────────────────────────────
function wzRender(){
  if(!document.getElementById('wzFill')) return;
  const steps=wzGetSteps(),sid=steps[WZ_STATE.step],total=steps.length;
  const pct=Math.round((WZ_STATE.step+1)/total*100);
  document.getElementById('wzFill').style.width=pct+'%';
  document.getElementById('wzNum').textContent=(WZ_STATE.step+1)+' / '+total;
  document.getElementById('wzTtl').textContent=TITLES[sid]||'Registro';
  document.getElementById('btnBack').style.opacity=WZ_STATE.step===0?'.2':'1';
  const btn=document.getElementById('btnGo');
  if(sid==='resumen'){btn.textContent='💾 Guardar sesión';btn.className='btn-go save';}
  else{btn.textContent='Continuar →';btn.className='btn-go';}
  btn.disabled=(sid==='tipo'&&WZ_STATE.tipos.length===0);
  const body=document.getElementById('wzBody');
  body.innerHTML='';body.scrollTop=0;
  if(sid==='fecha') wzRFecha(body);
  else if(sid==='tipo') wzRTipo(body);
  else if(sid==='detalle_tm') wzRTM(body);
  else if(sid==='detalle_ext') wzRExt(body);
  else if(sid==='detalle_row')   wzRRow(body);
  else if(sid==='detalle_plank') wzRDetallePlank(body);
  else if(sid==='totales_dia')   wzRTotalesDia(body);
  else wzRResumen(body);
}
function wzNextStep(){
  const steps=wzGetSteps();
  if(steps[WZ_STATE.step]==='resumen'){wzGuardar();return;}
  if(WZ_STATE.step<steps.length-1){WZ_STATE.step++;wzRender();}
}
function wzGoBack(){
  if(WZ_STATE.step > 0){
    WZ_STATE.step--;
    wzRender();
  } else {
    // Desde paso 0 o pantalla inicio — volver a pantalla de selección
    wzRenderInicio();
    let ftr = document.querySelector('.wz-ftr'); if(ftr) ftr.style.display='none';
    let back = document.getElementById('btnBack'); if(back) back.style.opacity='0';
    let bar = document.querySelector('#wzFill'); if(bar) bar.style.width='0%';
  }
}

// ── PASO 1: FECHA ────────────────────────────────────────────────
function wzRFecha(body){
  const MN=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const DN=['L','M','X','J','V','S','D'];
  const today=new Date().toISOString().slice(0,10);
  const d=new Date(WZ_STATE.fecha+'T12:00:00');

  let fd=new Date(WZ_CAL_Y,WZ_CAL_M,1).getDay(); fd=fd===0?6:fd-1;
  const dim=new Date(WZ_CAL_Y,WZ_CAL_M+1,0).getDate();
  let days='';
  for(let i=0;i<fd;i++) days+='<div class="cal-d"></div>';
  for(let n=1;n<=dim;n++){
    const ds=WZ_CAL_Y+'-'+String(WZ_CAL_M+1).padStart(2,'0')+'-'+String(n).padStart(2,'0');
    const future=ds>today;
    let cls='cal-d'+(future?'':' ok')+(ds===WZ_STATE.fecha?' sel':'')+(ds===today&&ds!==WZ_STATE.fecha?' tod':'');
    days+=`<div class="${cls}" ${!future?`onclick="wzPickDay('${ds}')"` : ''}>${n}</div>`;
  }

  body.innerHTML=`
    <div class="selected-date">${String(d.getDate()).padStart(2,'0')} ${MN[d.getMonth()].toUpperCase()}<span>${d.getFullYear()}</span></div>
    <div class="cal-nav">
      <div class="cal-btn" onclick="wzCalPrev()">‹</div>
      <div class="cal-mon">${MN[WZ_CAL_M]} ${WZ_CAL_Y}</div>
      <div class="cal-btn" onclick="wzCalNext()">›</div>
    </div>
    <div class="cal-grid">
      ${DN.map(d=>`<div class="cal-dn">${d}</div>`).join('')}${days}
    </div><div style="height:20px"></div>`;
}
function wzPickDay(ds){WZ_STATE.fecha=ds;wzRender();}
function wzCalPrev(){WZ_CAL_M--;if(WZ_CAL_M<0){WZ_CAL_M=11;WZ_CAL_Y--;}wzRender();}
function wzCalNext(){const n=new Date();if(WZ_CAL_Y<n.getFullYear()||(WZ_CAL_Y===n.getFullYear()&&WZ_CAL_M<n.getMonth())){WZ_CAL_M++;if(WZ_CAL_M>11){WZ_CAL_M=0;WZ_CAL_Y++;}wzRender();}}

function wzFc(field,label,val,unit,green){
  const v=val!==null&&val!==undefined;
  const gc=green?'row-f':'';
  const vc=green&&v?'rv':'';
  return `<div class="fc ${gc} ${v?'filled':''}" onclick="wzOpenPk('${field}')">
    <div class="fc-lbl">${label}</div>
    <div class="fc-val ${v?'v':''} ${vc}">
      <span>${v?wzFmtV(val,unit):'—'}</span>
      ${unit?`<span class="fc-u">${unit}</span>`:''}
    </div>
    <div class="fc-hint">${v?'toca para editar':'toca para ingresar'}</div>
  </div>`;
}
function wzFmtV(v,u){
  if(u==='km'&&v) return parseFloat(v).toFixed(2);
  if(u==='km/h'&&v) return parseFloat(v).toFixed(1);
  if(u==='min'&&v){
    // Duración en decimal → mostrar como "60m 30s"
    let n = parseFloat(v);
    return (!isNaN(n) && String(v).includes('.')) ? fd(n) : v+'';
  }
  if(u===''&&v){
    let n = parseFloat(v);
    if(!isNaN(n) && n > 0 && n < 400 && String(v).includes('.')){
      return fd(n);
    }
    return parseInt(v).toLocaleString();
  }
  return v;
}

function wzOpenTramo(tramoIdx, field){
  // Usar preset tramoKm para from/to, tramoPct para pct
  const presetKey = field==='pct' ? 'tramoPct' : 'tramoKm';
  const p = WZ_PRESETS[presetKey];
  if(!p) return;

  // Guardar contexto del tramo activo
  WZ_PKR_TRAMO = {tramoIdx, field};
  WZ_PKR_FIELD = null; // no es un campo de WZ_STATE directo

  PKR.field = '__tramo__';  // marcador especial
  PKR._tramoPreset = presetKey;  // guardar cuál preset usar en live/confirm
  PKR.cols  = p.cols;
  PKR.states = [...p.init];

  // Inicializar desde valor existente
  const existing = WZ_STATE.inclineProfile[tramoIdx]?.[field];
  if(existing!==null&&existing!==undefined){
    if(field==='pct'){
      const idx = p.cols[0].it.indexOf(parseInt(existing));
      if(idx>=0) PKR.states[0]=idx;
    } else {
      // km: col 0 = entero, col 2 = 1ª dec, col 3 = 2ª dec
      const v = parseFloat(existing);
      const intPart = Math.floor(v);
      const dec = (v - intPart).toFixed(2).slice(2); // "84" de 3.84
      const idx0 = p.cols[0].it.indexOf(intPart);
      if(idx0>=0) PKR.states[0]=idx0;
      PKR.states[2] = parseInt(dec[0])||0;
      PKR.states[3] = parseInt(dec[1])||0;
    }
  }

  document.getElementById('pkTtl').textContent = field==='pct' ? 'Inclinación tramo '+(tramoIdx+1) : (field==='from'?'Desde km':'Hasta km')+' tramo '+(tramoIdx+1);
  document.getElementById('pkDesc').textContent = p.desc;
  wzBuildDrums();wzUpdateLive();
  document.getElementById('pkOv').classList.add('open');
}

let WZ_PKR_TRAMO = null;

function wzAddTramo(){
  const prof = WZ_STATE.inclineProfile;
  const lastTo = prof.length>0 ? prof[prof.length-1].to : 0;
  const dist = WZ_STATE.dist ? parseFloat(WZ_STATE.dist) : 0;
  prof.push({from: lastTo, to: dist || lastTo+1, pct: 5});
  const container = document.getElementById('wz-tramos');
  if(container) container.innerHTML = wzTramosHTML();
}

function wzRemoveTramo(idx){
  WZ_STATE.inclineProfile.splice(idx,1);
  const container = document.getElementById('wz-tramos');
  if(container) container.innerHTML = wzTramosHTML();
}

function wzUpdateTramo(idx, field, val){
  if(WZ_STATE.inclineProfile[idx]){

}

function wzGuardar(){
  const W = WZ_STATE;
  const hasTM  = W.tipos.includes('tm');
  const hasExt = W.tipos.includes('ext');
  const hasRow = W.tipos.includes('row');
  const isSim  = W.subtipos.includes('simulacion');
  const isEnd  = W.subtipos.includes('endurance');

  // Validación mínima
  if(!hasTM && !hasExt && !hasRow){
    toast('⚠️ Selecciona al menos una actividad'); return;
  }
  if(!W.fecha){
    toast('⚠️ Ingresa la fecha'); return;
  }

  // Generar nuevo ID (o usar el existente si estamos editando)
  let newId;
  if(W._editId){
    newId = W._editId;
  } else {
    let maxId = 0;
    sessions.forEach(function(s){
      let n = parseInt(s.id.replace('s',''))||0;
      if(n > maxId) maxId = n;
    });
    newId = 's'+(maxId+1);
  }

  // Construir objeto sesión TM/Exterior
  let sess = { id: newId, date: W.fecha };

  // Tipo
  if(isEnd) sess.type = 'endurance';

  // Métricas TM
  if(hasTM || hasExt){
    if(W.dur     !== null) sess.duration   = parseFloat(W.dur);
    if(W.dist    !== null) sess.distance   = parseFloat(W.dist);
    if(W.velAvg  !== null) sess.speedAvg   = parseFloat(W.velAvg);
    if(W.velMax  !== null) sess.speedMax   = parseFloat(W.velMax);
    if(W.fcAvg   !== null) sess.hrAvg      = parseInt(W.fcAvg);
    if(W.fcMax   !== null) sess.hrMax      = parseInt(W.fcMax);
    if(W.cal     !== null) sess.calories   = parseInt(W.cal);
    if(W.calReloj !== null) sess.calReloj  = parseInt(W.calReloj);
    if(W.steps   !== null) sess.steps      = parseInt(W.steps);
    if(W.calTotal !== null) sess.totalCalories = parseInt(W.calTotal);
  }

  // Exterior
  if(hasExt){
    sess.note = 'Caminata exterior';
    // Si solo Exterior (sin TM), usar campos ext
    if(!hasTM){
      if(W.extDur     !== null) sess.duration  = parseFloat(W.extDur);
      if(W.extDist    !== null) sess.distance  = parseFloat(W.extDist);
      if(W.extVelAvg  !== null) sess.speedAvg  = parseFloat(W.extVelAvg);
      if(W.extVelMax  !== null) sess.speedMax  = parseFloat(W.extVelMax);
      if(W.extFcAvg   !== null) sess.hrAvg     = parseInt(W.extFcAvg);
      if(W.extFcMax   !== null) sess.hrMax     = parseInt(W.extFcMax);
      if(W.extCal     !== null) sess.calories  = parseInt(W.extCal);
      if(W.extSteps   !== null) sess.steps     = parseInt(W.extSteps);
      if(W.extElevGain !== null) sess.elevGain = parseInt(W.extElevGain);
    }
  }

  // Inclinación
  if(isSim && W.inclineProfile && W.inclineProfile.length > 0){
    sess.inclineProfile = W.inclineProfile.map(function(t){
      return {from: parseFloat(t.from)||0, to: parseFloat(t.to)||0, pct: parseInt(t.pct)||0};
    });
    // calMET simulación: calcular por tramos
    let peso = wForDate(W.fecha) || 90;
    let totalCalMET = 0;
    sess.inclineProfile.forEach(function(t){
      let distTr = t.to - t.from;
      let speed  = sess.speedAvg || 3.5;
      let durTr  = (distTr / speed) * 60;
      let met    = (metBase ? metBase(speed) : 3.5) + t.pct * 0.3;
      totalCalMET += Math.round(met * peso * (durTr / 60));
    });
    sess.calMET = totalCalMET;
  } else if(hasTM){
    if(W.incline !== null){
      sess.incline = parseInt(W.incline);
    }
    // calMET TM normal
    if(W.velAvg && (W.incline > 0 || isSim)){
      let peso = wForDate(W.fecha) || 90;
      sess.calMET = Math.round((metBase(parseFloat(W.velAvg)) + (parseInt(W.incline)||0)*0.3) * peso * (parseFloat(W.dur)||60)/60);
    }
  }

  // Rower
  if(hasRow){
    let rowerObj = {};
    if(W.rowDur  !== null) rowerObj.duration   = parseFloat(W.rowDur);
    if(W.rowDist !== null) rowerObj.rowerDist  = parseFloat(W.rowDist);
    if(W.rowRes  !== null) rowerObj.resistance = parseInt(W.rowRes);
    if(W.rowRows !== null) rowerObj.rows       = parseInt(W.rowRows);
    if(W.rowFc   !== null) rowerObj.hrAvg      = parseInt(W.rowFc);
    if(W.rowCal  !== null) rowerObj.calories   = parseInt(W.rowCal);
    // calMET rower
    rowerObj.calMET = rowCalMET({date: W.fecha, rower: rowerObj});
    sess.rower = rowerObj;
    if(!hasTM && !hasExt) sess.rowerOnly = true;
  }

  // Plank
  const hasPlank = WZ_STATE.tipos.includes('plank');
  if(hasPlank && WZ_STATE.plankDur !== null){
    sess.plank = { duration: parseFloat(WZ_STATE.plankDur) };
  }

  // Insertar sesión en SS (ordenado por fecha)
  sessions.push(sess);
  sessions.sort(function(a,b){ return a.date.localeCompare(b.date); });

  // Guardar peso si se ingresó
  if(W.peso !== null){
    let pesoNum = parseFloat(W.peso);
    if(!isNaN(pesoNum)){
      weights = [...weights.filter(function(w){ return w.date !== W.fecha; }),
                 {date: W.fecha, weight: pesoNum}]
               .sort(function(a,b){ return a.date.localeCompare(b.date); });
      checkWeightHito(pesoNum);
    }
  }

  // Guardar pasos totales del día en DAILY_STEPS si no existe
  if(W.steps !== null || W.extSteps !== null){
    let totalSteps = (parseInt(W.steps)||0) + (parseInt(W.extSteps)||0);
    // solo agregar si no existe ya para esa fecha
    let existing = DAILY_STEPS.find(function(d){ return d.date === W.fecha; });
    if(!existing && totalSteps > 0){
      DAILY_STEPS.push({date: W.fecha, steps: totalSteps});
      DAILY_STEPS.sort(function(a,b){ return a.date.localeCompare(b.date); });
    }
  }

  // Guardar calorías ingeridas en KCAL_RECORDS
  if(W.kcalComida !== null || W.prot !== null || W.carbs !== null || W.fat !== null){
    let existing = KCAL_RECORDS[W.fecha] || {};
    if(W.kcalComida !== null) existing.kcal  = parseInt(W.kcalComida);
    if(W.prot  !== null) existing.prot  = parseFloat(W.prot);
    if(W.carbs !== null) existing.carbs = parseFloat(W.carbs);
    if(W.fat   !== null) existing.fat   = parseFloat(W.fat);
    KCAL_RECORDS[W.fecha] = existing;
  }

  saveS();
  toast('✅ Sesión guardada');

  // Cerrar wizard
  let wz = document.getElementById('wz');
  if(wz) wz.remove();
  switchTab('Historial');

  // Actualizar caché de logros primero, luego descargar
  checkAchievementUnlocks();
  downloadUpdatedIndex();
}

function wzOpenPk(field){
  const p=WZ_PRESETS[field];if(!p)return;
  PKR.field=field;PKR.cols=p.cols;PKR.states=[...p.init];
  // restaurar valor existente en columna simple
  const ex=WZ_STATE[field];
  if(ex!==null&&ex!==undefined&&p.cols.length===1){
    const idx=p.cols[0].it.indexOf(Number.isInteger(+ex)?+ex:parseFloat(ex));
    if(idx>=0)PKR.states[0]=idx;
  }
  document.getElementById('pkTtl').textContent=p.lbl;
  document.getElementById('pkDesc').textContent=p.desc;
  wzBuildDrums();wzUpdateLive();
  document.getElementById('pkOv').classList.add('open');
}

function wzBuildDrums(){
  const c=document.getElementById('pkDrums');c.innerHTML='';
  PKR.cols.forEach((col,ci)=>{
    if(col.it.length===1&&col.it[0]==='.'){
      const s=document.createElement('div');s.className='dsep';s.textContent='.';c.appendChild(s);return;
    }
    const colEl=document.createElement('div');colEl.className='dc';
    // Ancho proporcional: cols con pocos items (0-9) más estrechas
    if(col.it.length<=10) colEl.style.maxWidth='72px';
    else if(col.it.length<=21) colEl.style.maxWidth='90px';
    const lbl=document.createElement('div');lbl.className='dc-lbl';lbl.textContent=col.l;colEl.appendChild(lbl);
    const win=document.createElement('div');win.className='dw';

    const scroll=document.createElement('div');scroll.className='dscroll';scroll.dataset.ci=ci;
    const si=PKR.states[ci]||0;
    const len=col.it.length;

    // Triplicar items para efecto infinito
    // El índice real vive en el bloque del medio (offset = len)
    for(let rep=0;rep<3;rep++){
      col.it.forEach((item,ii)=>{
        const el=document.createElement('div');
        el.className='di';
        // Marcar solo los del bloque central
        if(rep===1){
          const d=Math.abs(ii-si);
          if(d===0)el.classList.add('sl');else if(d===1)el.classList.add('nr');
        }
        el.textContent=item;
        scroll.appendChild(el);
      });
    }

    // Posicionar en el bloque central
    wzPosScrollInf(scroll,si,len);
    wzDragScrollInf(scroll,ci,len);
    win.appendChild(scroll);colEl.appendChild(win);c.appendChild(colEl);
  });
}

function wzPosScroll(el,idx){
  // item idx must be at center of 4-item window
  // window = 4*ih, center = 2*ih
  // item idx is at position (idx+2)*ih from scroll top (2 pads)
  // we want: scroll_offset + (idx+2)*ih + ih/2 = 2*ih
  // → translateY = 2*ih - (idx+2)*ih - ih/2 = ih*(2 - idx - 2 - 0.5) = ih*(-idx - 0.5)
  // But we want center of item at center of window (1.5*ih from top = 50% of 3rd row)
  // Simpler: translateY = -(idx * ih) + correction
  // window shows items at: pad pad ITEM0 ITEM1 ITEM2...
  // with translateY=0: scroll top aligns with win top, so pad0 is at top
  // center of win = 2*ih from top = center of idx=0 item (which is at ih + ih/2 = 1.5*ih)
  // To center idx: translateY = (1.5 - (idx+2)) * ih = (-idx - 0.5) * ih
  const ih = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ih'))||48;
  el.style.transform=`translateY(${(-idx - 0.5) * ih}px)`;
}
function wzPosScrollInf(el,idx,len){
  // Sin pads — estructura: [bloque0 len items][bloque1 central len items][bloque2 len items]
  // Posición del item idx en bloque central = len + idx
  // Queremos el item en el slot 1 del window (4 slots visibles):
  // translateY = (1 - len - idx) * ih
  const ih = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ih'))||48;
  el.style.transform = `translateY(${(1.5 - len - idx) * ih}px)`;
}

function wzUpdClasses(scroll,si){
  const items=scroll.querySelectorAll('.di');
  items.forEach((el,i)=>{
    const ri=i-2;el.classList.remove('sl','nr');
    if(ri<0)return;
    const d=Math.abs(ri-si);
    if(d===0)el.classList.add('sl');else if(d===1)el.classList.add('nr');
  });
}
// Versión infinita: items triplicados, bloque central en len..2*len-1
function wzUpdClassesInf(scroll,si,len){
  const items=scroll.querySelectorAll('.di');
  items.forEach((el,i)=>{
    el.classList.remove('sl','nr');
    const realI = i % len;
    const d = Math.abs(realI - si);
    const dWrap = Math.min(d, len - d);
    if(dWrap===0) el.classList.add('sl');
    else if(dWrap===1) el.classList.add('nr');
  });

}

function wzDragScroll(scroll,ci){
  let startY,startIdx,lastY,lastT,vel=0;
  const getY=e=>e.touches?e.touches[0].clientY:e.clientY;
  const ih=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ih'))||48;

  function onStart(e){
    startY=getY(e);startIdx=PKR.states[ci]||0;lastY=startY;lastT=Date.now();vel=0;
    scroll.style.transition='none';
    document.addEventListener('mousemove',onMove);
    document.addEventListener('touchmove',onMove,{passive:false});
    document.addEventListener('mouseup',onEnd);
    document.addEventListener('touchend',onEnd);
  }
  function onMove(e){
    if(e.cancelable)e.preventDefault();
    const y=getY(e),now=Date.now();
    vel=(lastY-y)/(now-lastT+1);lastY=y;lastT=now;
    const moved=Math.round((startY-y)/ih);
    const max=PKR.cols[ci].it.length-1;
    const ni=Math.max(0,Math.min(max,startIdx+moved));
    if(ni!==PKR.states[ci]){PKR.states[ci]=ni;wzPosScroll(scroll,ni);wzUpdClasses(scroll,ni);wzUpdateLive();}
  }
  function onEnd(){
    scroll.style.transition='';
    if(Math.abs(vel)>0.25){
      const max=PKR.cols[ci].it.length-1;
      const ni=Math.max(0,Math.min(max,PKR.states[ci]+Math.round(vel*3)));
      PKR.states[ci]=ni;wzPosScroll(scroll,ni);wzUpdClasses(scroll,ni);wzUpdateLive();
    }
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('touchmove',onMove);
    document.removeEventListener('mouseup',onEnd);
    document.removeEventListener('touchend',onEnd);
  }
  scroll.addEventListener('mousedown',onStart);
  scroll.addEventListener('touchstart',onStart,{passive:true});
}

// Versión infinita de dragScroll
function wzDragScrollInf(scroll,ci,len){
  let startY,startIdx,lastY,lastT,vel=0;
  const getY=e=>e.touches?e.touches[0].clientY:e.clientY;
  const ih=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ih'))||48;

  function getAbsIdx(){ return len + (PKR.states[ci]||0); }

  function onStart(e){
    startY=getY(e);startIdx=PKR.states[ci]||0;lastY=startY;lastT=Date.now();vel=0;
    scroll.style.transition='none';
    document.addEventListener('mousemove',onMove);
    document.addEventListener('touchmove',onMove,{passive:false});
    document.addEventListener('mouseup',onEnd);
    document.addEventListener('touchend',onEnd);
  }
  function onMove(e){
    if(e.cancelable)e.preventDefault();
    const y=getY(e),now=Date.now();
    vel=(lastY-y)/(now-lastT+1);lastY=y;lastT=now;
    const moved=Math.round((startY-y)/ih);
    // Wrap around
    let ni=((startIdx+moved)%len+len)%len;
    if(ni!==PKR.states[ci]){
      PKR.states[ci]=ni;
      wzPosScrollInf(scroll,ni,len);
      wzUpdClassesInf(scroll,ni,len);
      wzUpdateLive();
    }
  }
  function onEnd(){
    scroll.style.transition='';
    if(Math.abs(vel)>0.25){
      let ni=((PKR.states[ci]+Math.round(vel*3))%len+len)%len;
      PKR.states[ci]=ni;
      wzPosScrollInf(scroll,ni,len);
      wzUpdClassesInf(scroll,ni,len);
      wzUpdateLive();
    }
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('touchmove',onMove);
    document.removeEventListener('mouseup',onEnd);
    document.removeEventListener('touchend',onEnd);
  }
  scroll.addEventListener('mousedown',onStart);
  scroll.addEventListener('touchstart',onStart,{passive:true});
}

function wzUpdateLive(){
  let p;
  if(PKR.field==='__tramo__'){
    const presetKey = PKR._tramoPreset || (WZ_PKR_TRAMO&&WZ_PKR_TRAMO.field==='pct' ? 'tramoPct' : 'tramoKm');
    p = WZ_PRESETS[presetKey];
  } else {
    p = WZ_PRESETS[PKR.field];
  }
  if(!p)return;
  const vals=PKR.cols.map((col,ci)=>col.it.length===1&&col.it[0]==='.'?'.':col.it[PKR.states[ci]||0]);
  const [disp,unit]=p.fn(vals);
  // Para duraciones: disp=valor_decimal, unit=display_legible (ej: "60m 30s")
  let liveDisp = disp, liveUnit = unit;
  if(unit && /^\d+m/.test(unit)){
    liveDisp = unit;   // mostrar "60m 30s" como valor principal
    liveUnit = '';     // sin unidad extra
  }
  document.getElementById('pkLive').innerHTML=`${liveDisp} <span class="plu">${liveUnit}</span>`;
}

function wzConfirmPk(){
  const vals=PKR.cols.map((col,ci)=>col.it.length===1&&col.it[0]==='.'?'.':col.it[PKR.states[ci]||0]);

  if(PKR.field==='__tramo__'){
    // Guardar valor en el tramo correspondiente
    const presetKey = PKR._tramoPreset || (WZ_PKR_TRAMO&&WZ_PKR_TRAMO.field==='pct'?'tramoPct':'tramoKm');
    const p = WZ_PRESETS[presetKey];
    if(!p) return;
    const val = p.fn(vals)[0];
    if(WZ_STATE.inclineProfile[WZ_PKR_TRAMO.tramoIdx]){
      WZ_STATE.inclineProfile[WZ_PKR_TRAMO.tramoIdx][WZ_PKR_TRAMO.field] =
        WZ_PKR_TRAMO.field==='pct' ? parseInt(val) : parseFloat(val);
    }
    document.getElementById('pkOv').classList.remove('open');
    const container = document.getElementById('wz-tramos');
    if(container) container.innerHTML = wzTramosHTML();
    return;
  }

  // Campo normal de WZ_STATE
  const p=WZ_PRESETS[PKR.field];
  if(!p) return;
  WZ_STATE[PKR.field]=p.fn(vals)[0];
  document.getElementById('pkOv').classList.remove('open');
  wzRender();
}
function wzOvClick(e){if(e.target===document.getElementById('pkOv'))wzConfirmPk();}

<script>
(function(){
  var splash=document.getElementById('splash');
  var audio=document.getElementById('bg-audio');
  var dismissed=false;

  function dismiss(){
    if(dismissed) return;
    dismissed=true;
    // Start audio
    if(audio){
      audio.volume=0.20;
      var tryPlay = function(){
        audio.play().catch(function(){
          setTimeout(function(){ audio.play().catch(function(){}); }, 300);
        });
      };
      if(audio.readyState >= 2){
        tryPlay();
      } else {
        audio.addEventListener('canplay', tryPlay, {once:true});
        tryPlay();
      }
    }
    // Portal Doom transition
    splash.classList.add('closing');
    setTimeout(function(){
      splash.style.display='none';
    }, 1400);
  }

  // Tap / click anywhere on splash
  splash.addEventListener('touchstart', dismiss, {once:true, passive:true});
  splash.addEventListener('click',      dismiss, {once:true});

  // Desktop fallback: auto-dismiss after 8s if no interaction
  // (uncomment if desired)
  // setTimeout(dismiss, 8000);
})();
</script>
