var kcalCalY=new Date().getFullYear(),kcalCalM=new Date().getMonth(),selFoodDay=null;

function rComida(){
  var goal=2000;
  var recs=KCAL_RECORDS;
  var MN=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  var DN=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  var fd2=new Date(kcalCalY,kcalCalM,1).getDay();
  var dim=new Date(kcalCalY,kcalCalM+1,0).getDate();
  var todayStr=new Date().toISOString().split('T')[0];
  var cells=[];for(var i=0;i<fd2;i++)cells.push(0);for(var d=1;d<=dim;d++)cells.push(d);

  var calRows=cells.map(function(day){
    if(!day)return '<div></div>';
    var ds=kcalCalY+'-'+String(kcalCalM+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    var rec=recs[ds];
    var isToday=ds===todayStr;
    var isSel=selFoodDay===ds;
    var over=rec&&rec.kcal>goal;
    var bg=isSel?'rgba(192,132,252,.2)':isToday?'rgba(255,107,26,.08)':'rgba(255,255,255,.02)';
    var bdr=isSel?'#c084fc':isToday?'rgba(255,107,26,.4)':rec?'rgba(192,132,252,.3)':'rgba(255,255,255,.04)';
    var clr=rec?'#e8f0fe':isToday?'var(--a1)':'#4a5568';
    var fw=rec?700:400;
    var kcalDiv=rec?'<div style="font-family:var(--fm);font-size:7px;color:'+(over?'var(--a2)':'var(--a3)')+'">'+rec.kcal+' kcal</div>':'';
    var html='<div style="border:1px solid '+bdr+';border-radius:10px;padding:5px 3px;text-align:center;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;background:'+bg+';cursor:'+(rec?'pointer':'default')+'"'+(rec?' onclick="kcalSelDay(\'' + ds + '\')"':'')+'>'+
      '<div style="font-family:var(--fh);font-size:14px;line-height:1;color:'+clr+';font-weight:'+fw+'">'+day+'</div>'+
      kcalDiv+
      '</div>';
    return html;
  }).join('');

  // Day detail
  var det='';
  if(selFoodDay&&recs[selFoodDay]){
    var r=recs[selFoodDay];
    var pct=Math.min(100,Math.round((r.kcal/goal)*100));
    var dl=new Date(selFoodDay+'T12:00:00').toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
    var items=(r.selections||[]).map(function(s){
      return '<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06)">'+
        '<span style="font-size:16px">'+s.emoji+'</span>'+
        '<div style="flex:1"><div style="font-family:var(--fh);font-size:13px">'+s.name+(s.qty>1?' ×'+s.qty:'')+'</div>'+
        '<div style="font-family:var(--fm);font-size:9px;color:var(--muted)">P:'+s.prot+'g C:'+s.carbs+'g G:'+s.fat+'g</div></div>'+
        '<div style="font-family:var(--fh);font-weight:700;font-size:16px;color:#c084fc">'+s.kcal+' kcal</div>'+
        '</div>';
    }).join('');
    det='<div style="background:rgba(192,132,252,.06);border:1px solid rgba(192,132,252,.3);border-radius:14px;padding:14px;margin-top:10px">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">'+
      '<div style="font-family:var(--fh);font-weight:700;font-size:15px;color:#c084fc;text-transform:capitalize">🍽️ '+dl+'</div>'+
      '<button onclick="selFoodDay=null;rContent()" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px">✕</button></div>'+
      '<div class="g3" style="margin-bottom:10px">'+
      '<div class="sm2"><div class="sl2">Calorías</div><div class="sv" style="color:#c084fc">'+r.kcal+' kcal</div></div>'+
      '<div class="sm2"><div class="sl2">Proteína</div><div class="sv" style="color:#5bc4ff">'+r.prot+'g</div></div>'+
      '<div class="sm2"><div class="sl2">Carbs</div><div class="sv" style="color:var(--a3)">'+r.carbs+'g</div></div>'+
      '<div class="sm2"><div class="sl2">Grasa</div><div class="sv" style="color:var(--a4)">'+r.fat+'g</div></div>'+
      '<div class="sm2"><div class="sl2">% meta</div><div class="sv" style="color:'+(r.kcal>goal?'var(--a2)':'var(--a3)')+'">'+pct+'%</div></div>'+
      '</div>'+
      '<div class="hb-bg"><div class="hb-f" style="width:'+pct+'%;background:'+(r.kcal>goal?'var(--a2)':'#c084fc')+'"></div></div>'+
      (items?'<div style="margin-top:10px">'+items+'</div>':'')+'</div>';
  }

  // Summary stats
  var allRecs=Object.values(recs);
  var avgKcal=allRecs.length?Math.round(allRecs.reduce(function(a,r){return a+r.kcal;},0)/allRecs.length):0;
  var avgProt=allRecs.length?Math.round(allRecs.reduce(function(a,r){return a+r.prot;},0)/allRecs.length):0;
  var avgCarbs=allRecs.length?Math.round(allRecs.reduce(function(a,r){return a+r.carbs;},0)/allRecs.length):0;
  var avgFat=allRecs.length?Math.round(allRecs.reduce(function(a,r){return a+r.fat;},0)/allRecs.length):0;

  return '<div style="display:flex;flex-direction:column;gap:14px">'+
    '<div style="color:#c084fc;font-family:var(--fh);font-size:17px;font-weight:700;letter-spacing:1px;text-transform:uppercase">🍽️ Registro de comidas</div>'+

    // Summary cards
    (allRecs.length?
    '<div class="g3">'+
    '<div class="sm2"><div class="sl2">Prom. kcal/día</div><div class="sv" style="color:#c084fc">'+avgKcal+' kcal</div></div>'+
    '<div class="sm2"><div class="sl2">Prom. proteína</div><div class="sv" style="color:#5bc4ff">'+avgProt+'g</div></div>'+
    '<div class="sm2"><div class="sl2">Prom. carbs</div><div class="sv" style="color:var(--a3)">'+avgCarbs+'g</div></div>'+
    '<div class="sm2"><div class="sl2">Prom. grasa</div><div class="sv" style="color:var(--a4)">'+avgFat+'g</div></div>'+
    '<div class="sm2"><div class="sl2">Días registrados</div><div class="sv" style="color:var(--text)">'+allRecs.length+'</div></div>'+
    '</div>':'<div class="empty">Sin registros aún</div>')+

    // Calendar
    '<div class="sl">📅 Calendario</div>'+
    '<div class="cal-h">'+
    '<button class="cal-n" onclick="kcalCalPrev()">‹</button>'+
    '<div class="cal-t" style="color:#c084fc">'+MN[kcalCalM]+' '+kcalCalY+'</div>'+
    '<button class="cal-n" onclick="kcalCalNext()">›</button>'+
    '</div>'+
    '<div class="cal-g">'+DN.map(function(d){return'<div class="cal-dn">'+d+'</div>';}).join('')+calRows+'</div>'+
    det+

    // Charts
    '<div class="sl">📊 Histórico · Calorías (kcal) · ↓ mejor</div>'+
    '<div class="card"><div style="position:relative;height:150px"><canvas id="fc-kcal"></canvas></div></div>'+
    '<div class="sl">📊 Histórico · Proteína (g) · ↑ mejor</div>'+
    '<div class="card"><div style="position:relative;height:150px"><canvas id="fc-prot"></canvas></div></div>'+
    '<div class="sl">📊 Histórico · Carbs (g)</div>'+
    '<div class="card"><div style="position:relative;height:150px"><canvas id="fc-carbs"></canvas></div></div>'+
    '<div class="sl">📊 Histórico · Grasa (g)</div>'+
    '<div class="card"><div style="position:relative;height:150px"><canvas id="fc-fat"></canvas></div></div>'+
    '</div>';
}

function rComidaCharts(){
  var recs=KCAL_RECORDS;
  var keys=Object.keys(recs).sort().slice(-20);
  if(!keys.length)return;
  var lbl=keys.map(function(k){return k.slice(5);});
  var goal=2000;
  var defs=[
    {id:'fc-kcal',data:keys.map(function(k){return recs[k].kcal;}),color:'#c084fc',goal:goal},
    {id:'fc-prot',data:keys.map(function(k){return recs[k].prot;}),color:'#5bc4ff'},
    {id:'fc-carbs',data:keys.map(function(k){return recs[k].carbs;}),color:'#39ff6e'},
    {id:'fc-fat',data:keys.map(function(k){return recs[k].fat;}),color:'#ffa020'},
  ];
  Chart.defaults.color='#8a9bb0';Chart.defaults.font.family="'DM Mono'";Chart.defaults.font.size=9;
  defs.forEach(function(d){
    var ctx=document.getElementById(d.id);if(!ctx)return;
    destroyChart(d.id);
    var datasets=[{data:d.data,backgroundColor:d.color+'88',borderColor:d.color,borderWidth:1,borderRadius:4,type:'bar'}];
    if(d.goal)datasets.push({data:Array(lbl.length).fill(d.goal),borderColor:d.color+'66',borderWidth:1,borderDash:[4,4],type:'line',pointRadius:0,fill:false});
    charts[d.id]=new Chart(ctx,{
      type:'bar',
      data:{labels:lbl,datasets:datasets},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:'#0a0a0a',borderColor:d.color+'44',borderWidth:1}},scales:{x:{grid:{color:'rgba(255,255,255,.05)'},ticks:{maxRotation:45}},y:{grid:{color:'rgba(255,255,255,.05)'}}}}
    });
  });
}

function kcalSelDay(ds){selFoodDay=selFoodDay===ds?null:ds;rContent();}
function kcalCalPrev(){var d=new Date(kcalCalY,kcalCalM-1,1);kcalCalY=d.getFullYear();kcalCalM=d.getMonth();selFoodDay=null;rContent();}
function kcalCalNext(){var d=new Date(kcalCalY,kcalCalM+1,1);kcalCalY=d.getFullYear();kcalCalM=d.getMonth();selFoodDay=null;rContent();}

function tSimDay(ds){selSimDay=selSimDay===ds?null:ds;rContent();}
function prevSimM(){var d=new Date(cY,cM-1,1);cY=d.getFullYear();cM=d.getMonth();selSimDay=null;rContent();}
function nextSimM(){var d=new Date(cY,cM+1,1);cY=d.getFullYear();cM=d.getMonth();selSimDay=null;rContent();}

function getTierBadge(tierName, unlocked, size) {
  var sz = size || 64;
  // Map tier name to T1-T11 key
  var tierMap = {
    'UAC Recruit':'T1','Phobos Marine':'T2','Sentinel':'T3',
    'Hell Knight':'T4','Baron of Hell':'T5','Arch-Vile':'T6',
    'Khan Maykr':'T7','Icon of Sin':'T8','Doom Slayer':'T9',
    'Father':'T10','Dark Lord':'T11'
  };
  var key = tierMap[tierName];
  if (!key || !TIER_BADGES[key]) return '';
  var filt = unlocked
    ? 'filter:drop-shadow(0 0 8px currentColor)'
    : 'filter:grayscale(1) brightness(0.2) contrast(1.1)';

}

function computeXP() {
  var xp = 0;
  sessions.forEach(function(s) { xp += 20; });
  var cw = weights.length ? weights[weights.length-1].weight : null;
  if (cw && cw <= 95) xp += 100;
  if (cw && cw <= 90) xp += 100;
  if (cw && cw <= 85) xp += 100;
  var achs = buildAchievements();
  achs.forEach(function(a) { if (a.done) xp += 50; });
  var tierNames = ['UAC Recruit','Phobos Marine','Sentinel','Hell Knight','Baron of Hell',
    'Arch-Vile','Khan Maykr','Icon of Sin','Doom Slayer','Father','Dark Lord'];
  tierNames.forEach(function(tn) {
    var ta = achs.filter(function(a){return a.tier===tn;});
    if (ta.length && ta.every(function(a){return a.done;})) xp += 300;
  });
  return xp;
}

function getCurrentLevel(xp) {
  var cur = LEVELS_DATA[0];
  for (var i = 0; i < LEVELS_DATA.length; i++) {
    if (xp >= LEVELS_DATA[i].xp) cur = LEVELS_DATA[i];
    else break;
  }
  return cur;
}

function getNextLevel(xp) {
  for (var i = 0; i < LEVELS_DATA.length; i++) {
    if (xp < LEVELS_DATA[i].xp) return LEVELS_DATA[i];
  }
  return LEVELS_DATA[LEVELS_DATA.length - 1];
}

// ── DOOM ACHIEVEMENTS — each assigned to a level range ───────────
function achCompletedOn(a,sess,wts,rSess){
  if(!a.done)return null;
  var cat=a.cat||'';
  var sorted=[].concat(sess).sort(function(a,b){return a.date<b.date?-1:1;});
  // Weight milestones
  if(cat==='Peso'){
    var target=a.goal;
    for(var i=0;i<wts.length;i++){if(wts[i].weight<=target)return wts[i].date;}
  }
  // Session count milestones
  if(cat==='Sesiones'){
    var allDates=[];
    sess.filter(function(s){return !s.rowerOnly;}).forEach(function(s){allDates.push(s.date);});
    rSess.filter(function(s){return !s.rowerOnly;}).forEach(function(s){allDates.push(s.date);});
    sess.filter(function(s){return s.rowerOnly;}).forEach(function(s){allDates.push(s.date);});
    allDates.sort();
    if(allDates.length>=a.goal)return allDates[a.goal-1];
  }
  // Cumulative distance
  if(cat==='Distancia'&&a.goal>1){
    var acc=0;
    for(var j=0;j<sorted.length;j++){acc+=(sorted[j].distance||0);if(acc>=a.goal)return sorted[j].date;}
  }
  // Remo distance
  if(cat==='Remo'){
    var accR=0,sortedR=[].concat(rSess).sort(function(a,b){return a.date<b.date?-1:1;});
    for(var k=0;k<sortedR.length;k++){
      accR+=(sortedR[k].rower&&sortedR[k].rower.rowerDist?sortedR[k].rower.rowerDist:0);
      if(accR>=a.goal)return sortedR[k].date;
    }
  }
  // Duration milestones: find first session meeting threshold
  if(cat==='Duraci\xc3\xb3n'&&a.goal<=180){
    for(var m=0;m<sorted.length;m++){if((sorted[m].duration||0)>=a.goal)return sorted[m].date;}
  }
  // Calories single session
  if(cat==='Calor\xc3\xadas'&&a.goal<=1000){
    for(var n=0;n<sorted.length;n++){if((sorted[n].calories||0)>=a.goal)return sorted[n].date;}
  }
  // Fallback: date of last session
  return sorted.length?sorted[sorted.length-1].date:null;
}

function rAchievements() {
  var xp = computeXP();
  var cur = getCurrentLevel(xp);
  var nxt = getNextLevel(xp);
  var pct = nxt.n > cur.n ? Math.round(((xp - cur.xp) / (nxt.xp - cur.xp)) * 100) : 100;
  var achs = buildAchievements();

  if (achViewLevel !== null) {
    return rAchLevelDrill(achViewLevel, achs, xp, cur);
  }
  return rAchOverview(achs, xp, cur, nxt, pct);
}

function buildTierPanel(tier, achs, cur) {
  var tierAchs = achs.filter(function(a){ return a.tier === tier.name; });
  var tierDone = tierAchs.filter(function(a){ return a.done; }).length;
  var tierPct  = Math.round((tierDone / Math.max(1, tierAchs.length)) * 100);
  var isUnlocked = cur.n >= tier.n1;
  var badge = getTierBadge(tier.name, isUnlocked, 58);
  var html = '';

  // Tier header card
  html += '<div onclick="enterTierDrill('+tier.n1+')" style="cursor:pointer;background:'+tier.col+'10;border:1px solid '+tier.col+'33;border-radius:10px;padding:10px 12px;margin-bottom:10px;position:relative;overflow:hidden">'
    + (badge ? '<div style="position:absolute;right:8px;top:50%;transform:translateY(-50%);opacity:'+(isUnlocked?.65:.15)+';color:'+tier.col+'">'+badge+'</div>' : '')
    + '<div style="font-family:var(--fh);font-size:16px;font-weight:900;color:'+tier.col+';text-shadow:0 0 8px '+tier.col+'44;letter-spacing:1px">'+tier.name.toUpperCase()+'</div>'
    + '<div style="font-family:var(--fm);font-size:8px;color:#888;margin-top:2px">'+tierDone+'/'+tierAchs.length+' logros desbloqueados</div>'
    + '<div style="background:rgba(255,255,255,.05);border-radius:2px;height:3px;margin-top:6px;overflow:hidden">'
    + '<div style="width:'+tierPct+'%;height:100%;background:'+tier.col+'"></div></div>'
    + '</div>';

  // Achievement list — flat, no sublevels
  html += '<div style="display:flex;flex-direction:column;gap:5px">';
  tierAchs.forEach(function(a) {
    var p = a.goal > 1 ? Math.min(100, Math.round((a.prog / a.goal) * 100)) : (a.done ? 100 : 0);
    html += '<div style="background:'+(a.done?a.col+'12':'rgba(255,255,255,.02)')+';border:1px solid '+(a.done?a.col+'2a':'#1a1a1a')+';border-radius:8px;padding:9px 11px;display:flex;align-items:center;gap:9px">'
      + '<div style="opacity:'+(a.done?1:.3)+'">'+achIco(a.ico,a.col)+'</div>'
      + '<div style="flex:1">'
      + '<div style="font-family:var(--fh);font-size:13px;font-weight:700;color:'+(a.done?'#e8e8e8':'#666')+'">'+a.name+'</div>'
      + '<div style="font-family:var(--fm);font-size:7.5px;color:#777;margin-top:1px">'+a.desc+'</div>'
      + (a.done && a.completedOn ? '<div style="font-family:var(--fm);font-size:7px;color:'+a.col+'88;margin-top:2px"> '+a.completedOn+'</div>' : '')
      + (!a.done && a.goal > 1 ? '<div style="display:flex;align-items:center;gap:5px;margin-top:4px"><div style="flex:1;background:#111;border-radius:2px;height:2px;overflow:hidden"><div style="width:'+p+'%;height:100%;background:'+a.col+'88"></div></div><div style="font-family:var(--fm);font-size:7px;color:'+a.col+'99;white-space:nowrap">'+(typeof a.prog==='number'?Math.round(a.prog*10)/10:a.prog)+'/'+a.goal+'</div></div>' : '')
      + '</div>'
      + (a.done
          ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#39ff6e" stroke-width="2.5" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg>'
          : '<div style="font-family:var(--fm);font-size:8px;color:#555">'+p+'%</div>')
      + '</div>';
  });
  html += '</div>';
  return html;
}

function rReview() {
  var t   = tots(sessions);
  var cw  = weights.length ? weights[weights.length-1].weight : null;
  var sw  = weights.length ? weights[0].weight : null;
  var lost = (sw && cw) ? (sw - cw).toFixed(2) : null;
  var activeDays = new Set(sessions.map(function(s){return s.date;})).size;

  var totalDurR = sessions.reduce(function(a,s){
    var rd = s.rower ? (s.rower.duration > 120 ? Math.round(s.rower.duration/60) : s.rower.duration) : 0;
    return a + (s.duration||0) + rd;
  }, 0);
  var streakR = (function(){
    var cur=0,max=0,prev=null;
    Array.from(new Set(sessions.map(function(s){return s.date;}))).sort().forEach(function(d){
      if(prev){var diff=(new Date(d)-new Date(prev))/86400000; cur=diff===1?cur+1:1;}
      else cur=1;
      if(cur>max)max=cur; prev=d;
    });
    return {max:max,cur:cur};
  })();
  var velR = (function(){
    var n=0,sum=0;
    sessions.forEach(function(s){if(s.speedAvg>0){sum+=s.speedAvg;n++;}});
    return n>0?(sum/n).toFixed(1):0;
  })();
  var paceR = t.dist>0 ? (totalDurR/t.dist).toFixed(1) : 0;

  // ── KPIs 2x2 ──────────────────────────────────────────────────────
  var kpis = [
    {val:t.dist.toFixed(1), unit:'km', label:'DISTANCIA TOTAL',  delta:'^ acum. todas las sesiones', col:'var(--a1)', bc:'rgba(255,107,26,.2)'},
    {val:lost?'-'+lost:'--', unit:'kg', label:'PESO PERDIDO', delta:sw&&cw?sw.toFixed(1)+' -> '+cw.toFixed(1)+' kg':'--', col:'var(--a3)', bc:'rgba(57,255,110,.2)'},
    {val:t.n, unit:'ses', label:'SESIONES TOTALES', delta:'~ '+((t.n/activeDays)).toFixed(1)+'/dia activo', col:'var(--a4)', bc:'rgba(100,180,255,.2)'},
    {val:(t.cal/1000).toFixed(1)+'k', unit:'cal', label:'CAL QUEMADAS', delta:'~'+(t.cal/7700).toFixed(1)+' kg grasa', col:'var(--wt)', bc:'rgba(212,130,10,.2)'},
  ];

function closeMonthly(){document.getElementById('monthly-overlay').classList.remove('on');}
function checkMonthlySummary(){
  var today=new Date();
  var cm=today.getMonth();
  var cy=today.getFullYear();
  var lastKey='monthlySeen_'+cy+'_'+cm;
  if(localStorage.getItem(lastKey))return;
  var prevM=cm===0?11:cm-1;
  var prevY=cm===0?cy-1:cy;
  var pad=function(n){return n<10?'0'+n:n;};
  var fromDate=prevY+'-'+pad(prevM+1)+'-01';
  var toDate=prevY+'-'+pad(prevM+1)+'-'+new Date(prevY,prevM+1,0).getDate();
  var mSessions=sessions.filter(function(s){return s.date>=fromDate&&s.date<=toDate;});
  if(!mSessions.length)return;
  localStorage.setItem(lastKey,'1');
  var MN=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  var totalDist=mSessions.reduce(function(a,s){return a+(s.distance||0);},0).toFixed(1);
  var totalMin=mSessions.reduce(function(a,s){return a+(s.duration||0);},0);
  var totalCal=mSessions.reduce(function(a,s){return a+(s.calories||0);},0);
  var totalSteps=mSessions.reduce(function(a,s){return a+(s.steps||0);},0);
  var h=Math.floor(totalMin/60),m=totalMin%60;
  var bestDist=mSessions.reduce(function(a,s){return s.distance>a.distance?s:a;},mSessions[0]);
  var mmT=document.getElementById('mm-title');var mmS=document.getElementById('mm-sub');var mmG=document.getElementById('mm-grid');var mmB=document.getElementById('mm-best');if(!mmT)return;mmT.textContent='🏅 '+MN[prevM]+' '+prevY;
  mmS.textContent=mSessions.length+' sesiones completadas';
  mmG.innerHTML=[
    {v:totalDist+' km',k:'Distancia total',c:'var(--a4)'},
    {v:(h>0?h+'h ':'')+m+'m',k:'Tiempo total',c:'var(--a3)'},
    {v:totalCal+' cal',k:'Calorías',c:'var(--a1)'},
    {v:totalSteps.toLocaleString(),k:'Pasos',c:'var(--a2)'},
  ].map(function(s){
    return '<div class="mm-stat"><div class="mm-stat-v" style="color:'+s.c+'">'+s.v+'</div><div class="mm-stat-k">'+s.k+'</div></div>';
  }).join('');
  mmB.innerHTML=bestDist&&bestDist.distance>0?
    '<div style="background:rgba(255,107,26,.08);border:1px solid rgba(255,107,26,.2);border-radius:10px;padding:10px;margin-bottom:8px;text-align:center"><div style="font-family:var(--fm);font-size:9px;color:var(--muted);margin-bottom:4px">MEJOR SESIÓN</div><div style="font-family:var(--fh);font-size:16px;font-weight:900;color:var(--a1)">'+bestDist.distance+' km</div><div style="font-family:var(--fm);font-size:9px;color:var(--muted)">'+bestDist.date+'</div></div>':'';
  setTimeout(function(){document.getElementById('monthly-overlay').classList.add('on');},1500);
}

function switchAchTier(n1) {
  var tiers = window._achTiers, achs = window._achData, cur = window._achCur;
  if (!tiers || !achs || !cur) { render(); return; }
  var tier = null;
  for (var i = 0; i < tiers.length; i++) {
    if (tiers[i].n1 === n1) { tier = tiers[i]; break; }
  }
  if (!tier) return;
  var col = document.getElementById('ach-right-col');
  if (col) col.innerHTML = buildTierPanel(tier, achs, cur);
}

function enterTierDrill(n1) {
  achViewLevel = n1;
  render();
}


render();
document.addEventListener("DOMContentLoaded",function(){checkMonthlySummary();initAchievementCache();});

<script>
(function(){
  var splash=document.getElementById('splash');
  var audio=document.getElementById('bg-audio');
  var dismissed=false;

  function dismiss(){
    if(dismissed) return;
    dismissed=true;
    // Start audio
    if(audio){
      audio.volume=0.20;
      var tryPlay = function(){
        audio.play().catch(function(){
          setTimeout(function(){ audio.play().catch(function(){}); }, 300);
        });
      };
      if(audio.readyState >= 2){
        tryPlay();
      } else {
        audio.addEventListener('canplay', tryPlay, {once:true});
        tryPlay();
      }
    }
    // Portal Doom transition
    splash.classList.add('closing');
    setTimeout(function(){
      splash.style.display='none';
    }, 1400);
  }

  // Tap / click anywhere on splash
  splash.addEventListener('touchstart', dismiss, {once:true, passive:true});
  splash.addEventListener('click',      dismiss, {once:true});

  // Desktop fallback: auto-dismiss after 8s if no interaction
  // (uncomment if desired)
  // setTimeout(dismiss, 8000);
})();
</script>
