<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Train and Sweat... Until It's Done!</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&amp;family=Barlow:wght@400;500;600&amp;family=DM+Mono:wght@400;500&amp;display=swap" rel="stylesheet">


<style>
@font-face { font-family: 'DoomRight2'; src: url('https://raw.githubusercontent.com/jfpeal00-sys/training-dashboard/main/DoomRight2.ttf') format('truetype'); }
:root {
  --a1:#ff6b1a;--a2:#ff2020;--a3:#39ff6e;--a4:#ffa020;--a5:#ff4500;--wt:#d4820a;
  --bg:#000;--card:rgba(255,255,255,0.04);--border:rgba(255,255,255,0.08);
  --text:#e8f0fe;--muted:#8a9bb0;
  --fh:'Barlow Condensed',sans-serif;--fb:'Barlow',sans-serif;--fm:'DM Mono',monospace;
}

body.light-mode {
  --bg:#f0f2f5;--card:rgba(255,255,255,0.9);--border:rgba(0,0,0,0.10);
  --text:#1a1a2e;--muted:#6b7280;--wt:#d4820a;
}
body.light-mode #bg-img { opacity:.06; }
body.light-mode .tb { color: #555; }
body.light-mode .tb.on { color: var(--a1); }

to{opacity:1}}

@keyframes pr-glow-in{from{opacity:0;transform:translate(-50%,-50%) scale(.3)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}

@keyframes pr-doom-pop{from{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-10deg)}to{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0deg)}}

@keyframes pr-banner-rise{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

@keyframes pr-blink{from{opacity:.35}to{opacity:.7}}

@keyframes pr-scan-flash{0%{opacity:.6}100%{opacity:0}}
.confetti-p{position:fixed;width:8px;height:8px;border-radius:2px;pointer-events:none;animation:confetti-fall linear forwards;}
@keyframes confetti-fall{0%{opacity:1;transform:translateY(0) rotate(0deg);}100%{opacity:0;transform:translateY(100vh) rotate(720deg);}}

#monthly-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:8000;display:none;align-items:center;justify-content:center;padding:16px;}
#monthly-overlay.on{display:flex;}
#monthly-modal{background:#111;border:1px solid rgba(255,107,26,.4);border-radius:20px;padding:20px;max-width:340px;width:100%;max-height:85vh;overflow-y:auto;animation:pr-pop .35s cubic-bezier(.175,.885,.32,1.275) forwards;}
.mm-title{font-family:var(--fh);font-size:22px;font-weight:900;color:var(--a1);letter-spacing:1px;margin-bottom:4px;}
.mm-sub{font-family:var(--fm);font-size:10px;color:var(--muted);margin-bottom:16px;text-transform:uppercase;letter-spacing:1px;}
.mm-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.mm-stat{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px;text-align:center;}
.mm-stat-v{font-family:var(--fh);font-size:20px;font-weight:900;}
.mm-stat-k{font-family:var(--fm);font-size:9px;color:var(--muted);margin-top:2px;}
.mm-close{width:100%;padding:10px;background:rgba(255,107,26,.2);border:1px solid var(--a1);border-radius:10px;color:var(--a1);font-family:var(--fh);font-size:14px;font-weight:700;letter-spacing:1px;cursor:pointer;margin-top:8px;}
.ach-ico{width:20px;height:20px;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;display:block;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--fb);min-height:100vh;padding-bottom:60px}
#bg-img{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;object-position:center top;opacity:.15;z-index:0;pointer-events:none}
#app{position:relative;max-width:640px;margin:0 auto}
#header{background:linear-gradient(180deg,rgba(255,107,26,.12) 0%,transparent 100%);border-bottom:1px solid rgba(255,107,26,.2);padding:22px 20px 16px;text-align:center}
#header h1{display:none}
#header .sub{color:var(--muted);font-family:var(--fm);font-size:10px;margin-bottom:14px}
#hstats{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.hs{text-align:center}
.hs-v{font-family:var(--fh);font-weight:700;font-size:18px}
.hs-l{color:var(--muted);font-family:var(--fm);font-size:8px;text-transform:uppercase;letter-spacing:1px}
#tabs{display:flex;border-bottom:1px solid var(--border);padding:0 10px;overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tb{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);padding:6px 8px;font-family:var(--fh);font-size:9px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;white-space:nowrap;transition:all .2s;display:inline-flex;}
.tb.on{color:var(--a1);border-bottom-color:var(--a1)}
#content{padding:16px 14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.sl{color:var(--muted);font-family:var(--fm);font-size:9px;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid rgba(255,255,255,.06);padding-bottom:4px;margin:12px 0 8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
label{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px;font-family:var(--fm);display:block;margin-bottom:4px}
input,select{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:10px;color:var(--text);padding:10px 14px;font-size:14px;font-family:var(--fm);width:100%;outline:none;transition:border-color .2s}
input:focus{border-color:var(--a1)}
.bp{background:linear-gradient(135deg,rgba(255,107,26,.15),rgba(255,107,26,.3));border:1px solid var(--a1);border-radius:12px;color:var(--a1);padding:12px;font-family:var(--fh);font-size:15px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;width:100%;transition:all .2s;margin-top:4px}
.bg2{background:transparent;border:1px solid rgba(255,255,255,.15);border-radius:12px;color:var(--muted);padding:10px;font-family:var(--fh);font-size:14px;font-weight:600;cursor:pointer;width:100%;margin-top:6px}
.stabs{display:flex;gap:8px;margin-bottom:12px}
.stb{flex:1;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:var(--muted);padding:8px 0;font-family:var(--fh);font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;text-align:center;transition:all .18s}
.stb.on{background:rgba(255,107,26,.12);color:var(--a1);box-shadow:0 0 8px rgba(255,107,26,.2)}
.sc{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:14px;padding:13px;margin-bottom:10px}
.sh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:9px}
.sd{font-family:var(--fh);font-weight:700;font-size:16px;color:var(--a1)}
.sm{color:var(--muted);font-family:var(--fm);font-size:10px;margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:7px;border-radius:8px;padding:5px 11px;margin-bottom:6px;font-family:var(--fh)}
.bv{font-weight:700;font-size:17px}
.bu{color:var(--muted);font-family:var(--fm);font-size:9px}
.sm2{background:rgba(255,255,255,.03);border-radius:7px;padding:6px 9px}
.sl2{color:var(--muted);font-size:8px;font-family:var(--fm);text-transform:uppercase}
.sv{font-family:var(--fh);font-weight:700;font-size:14px}
.ab{display:flex;gap:7px}
.ib{background:none;border:none;cursor:pointer;font-size:14px;padding:2px}
.cfd{text-align:center;padding:8px}
.cfd p{color:var(--a2);font-family:var(--fm);font-size:12px;margin-bottom:10px}
.cfdb{display:flex;gap:10px;justify-content:center}
.bda{background:rgba(255,32,32,.2);border:1px solid var(--a2);border-radius:8px;color:var(--a2);padding:7px 18px;cursor:pointer;font-family:var(--fh);font-size:13px;font-weight:700}
.bca{background:transparent;border:1px solid rgba(255,255,255,.15);border-radius:8px;color:var(--muted);padding:7px 18px;cursor:pointer;font-family:var(--fh);font-size:13px}
.cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cal-n{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:8px;color:var(--text);padding:6px 14px;cursor:pointer;font-size:16px}
.cal-t{font-family:var(--fh);font-weight:700;font-size:20px;color:var(--a1);letter-spacing:1px;text-transform:uppercase}
.cal-leg{display:flex;gap:16px;justify-content:center;margin-bottom:12px}
.cal-li{display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dn{text-align:center;color:var(--muted);font-family:var(--fm);font-size:9px;text-transform:uppercase;padding-bottom:4px}
.cal-c{border:1px solid transparent;border-radius:10px;padding:6px 2px;text-align:center;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;transition:all .15s}
.cal-c.hs2{cursor:pointer;background:rgba(255,255,255,.05)}
.cal-c.sel{background:rgba(255,107,26,.15)!important;border-color:var(--a1)!important}
.cal-dots{display:flex;gap:3px;justify-content:center;min-height:12px}
.cal-num{font-family:var(--fh);font-size:16px;line-height:1}
.cal-cnt{font-family:var(--fm);font-size:8px;color:var(--muted)}
.cal-det{background:rgba(255,107,26,.06);border:1px solid rgba(255,107,26,.3);border-radius:14px;padding:14px 16px;margin-top:12px}
.hb-bg{background:rgba(255,255,255,.06);border-radius:99px;height:8px;overflow:hidden;margin-top:8px}
.hb-f{height:100%;border-radius:99px;transition:width .6s ease}
.rr{display:flex;align-items:center;gap:10px;border-radius:9px;padding:7px 10px;cursor:pointer;transition:all .15s;margin-bottom:4px}
.rd{border-radius:0 0 10px 10px;padding:10px 12px;margin-top:-4px;margin-bottom:4px}
.stc{background:rgba(255,255,255,.04);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.stc-l{color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:1.2px;font-family:var(--fm)}
.stc-v{font-family:var(--fh);font-weight:700;font-size:22px}
.stc-u{color:var(--muted);font-size:10px;font-family:var(--fm);font-weight:400;margin-left:3px}
.cw{margin-bottom:18px}
.cl{color:var(--muted);font-family:var(--fm);font-size:9px;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.pc{background:rgba(255,69,0,.1);border:1px solid rgba(255,69,0,.3);border-radius:10px;padding:8px 14px;font-family:var(--fm);font-size:12px;color:var(--a5);margin-bottom:4px}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-family:var(--fm);font-size:13px}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(57,255,110,.15);border:1px solid var(--a3);border-radius:12px;color:var(--a3);padding:10px 20px;font-family:var(--fh);font-size:14px;font-weight:700;letter-spacing:1px;z-index:999;opacity:0;transition:all .3s;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:4px}


/* ═══ Hellfire Particles ═══ */
.s1-particles{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.hf-particle{
  position:absolute;
  width:2px;height:6px;
  background:linear-gradient(180deg,transparent,#ff6b1a);
  border-radius:50% 50% 0 0;
  animation:hf-rise var(--dur,3s) linear var(--delay,0s) infinite;
  left:var(--x,50%);
  bottom:0;
  opacity:.9;
  box-shadow:0 0 5px 1px rgba(255,69,0,.7);
}
.hf-particle.big{width:3px;height:9px;background:linear-gradient(180deg,transparent,#ffaa20);border-radius:50% 50% 0 0;box-shadow:0 0 8px 2px rgba(255,150,0,.6);}
.hf-particle.tiny{width:1px;height:4px;background:linear-gradient(180deg,transparent,#ff8800);border-radius:50% 50% 0 0;box-shadow:0 0 3px 1px rgba(255,136,0,.5);}
@keyframes hf-rise{
  0%  {bottom:0;   opacity:.9;transform:translateX(0px)   scaleY(1);}
  20% {opacity:.8; transform:translateX(3px)  scaleY(.9);}
  50% {opacity:.6; transform:translateX(-2px) scaleY(.7);}
  80% {opacity:.3; transform:translateX(2px)  scaleY(.4);}
  100%{bottom:480px;opacity:0; transform:translateX(0px)  scaleY(0);}
}
#header{position:relative;}
/* �� Hellfire title animation �� */
@keyframes hellfire-glow{
  0%  {filter:drop-shadow(0 0 10px rgba(255,107,26,.85)) drop-shadow(0 0 22px rgba(255,69,0,.55)) drop-shadow(0 0 40px rgba(255,0,0,.2));}
  33% {filter:drop-shadow(0 0 16px rgba(255,140,20,1))   drop-shadow(0 0 32px rgba(255,80,0,.7))  drop-shadow(0 0 60px rgba(255,30,0,.35)) drop-shadow(0 2px 8px rgba(255,200,50,.15));}
  66% {filter:drop-shadow(0 0 12px rgba(255,90,10,.9))   drop-shadow(0 0 26px rgba(255,50,0,.6))  drop-shadow(0 0 50px rgba(200,0,0,.3));}
  100%{filter:drop-shadow(0 0 14px rgba(255,120,26,.9))  drop-shadow(0 0 28px rgba(255,69,0,.6))  drop-shadow(0 0 55px rgba(255,10,0,.25));}
}
@keyframes hellfire-flicker{
  0%,100%{opacity:1;}
  92%    {opacity:1;}
  93%    {opacity:.92;}
  94%    {opacity:1;}
  97%    {opacity:.95;}
  98%    {opacity:1;}
}
.doom-title{
  animation: hellfire-glow 3s ease-in-out infinite alternate, hellfire-flicker 6s linear infinite;
}
/* ── Animated spinning border ─────────────────── */
@keyframes spin-border{to{--angle:360deg}}
@property --angle{syntax:'<angle>';initial-value:0deg;inherits:false}

.ab{position:relative;border:none!important;background:var(--card);border-radius:10px;}
.ab::before{
  content:'';
  position:absolute;
  inset:-1.5px;
  border-radius:inherit;
  padding:1.5px;
  background:conic-gradient(from var(--angle),transparent 60%,#ff6a00,#ffb347,#ff6a00,transparent 80%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  animation:spin-border 3s linear infinite;
}
.ab-fast::before{animation-duration:1.8s}
.ab-slow::before{animation-duration:5s}

/* ══ FX1: Lava Scanlines CRT ══ */
#crt-overlay{position:fixed;inset:0;pointer-events:none;z-index:9998;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(255,69,0,.013) 3px,rgba(255,69,0,.013) 4px);animation:crt-scroll 10s linear infinite;}
#crt-sweep{position:fixed;left:0;right:0;height:80px;pointer-events:none;z-index:9997;background:linear-gradient(180deg,transparent,rgba(255,107,26,.05) 40%,rgba(255,69,0,.08) 50%,rgba(255,107,26,.05) 60%,transparent);animation:sweep-down 4s cubic-bezier(0.4,0,0.6,1) infinite;}
@keyframes crt-scroll{0%{background-position:0 0;}100%{background-position:0 100px;}}
@keyframes sweep-down{0%{top:-80px;opacity:0;}15%{opacity:.85;}85%{opacity:.65;}100%{top:calc(100% + 80px);opacity:0;}}
/* ══ FX2: Plasma Bars ══ */
.hb-f.plasma{background:linear-gradient(90deg,#ff2000,#ff6b1a,#ffaa20,#ff6b1a,#ff2000)!important;background-size:200% 100%!important;animation:plasma-flow 2s linear infinite;position:relative;overflow:hidden;}
.hb-f.plasma::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.22) 50%,transparent 100%);animation:plasma-shine 2.2s ease-in-out infinite;}
.hb-glow{height:4px;border-radius:99px;margin-top:-4px;background:linear-gradient(90deg,#ff2000,#ff6b1a,#ffaa20,#ff6b1a,#ff2000);background-size:200% 100%;filter:blur(4px);opacity:.55;animation:plasma-flow 2s linear infinite;}
@keyframes plasma-flow{0%{background-position:200% 0;}100%{background-position:0% 0;}}
@keyframes plasma-shine{0%,100%{transform:translateX(-150%);}50%{transform:translateX(150%);}}
/* ══ FX3: Tab Ember ══ */
.tb.on{position:relative;}
.tb.on::before{content:'';position:absolute;bottom:-2px;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#ff4500,#ffcc00,#ff4500,transparent);background-size:200% 100%;animation:ember-run 1.8s linear infinite;border-radius:2px;}
.tb.on::after{content:'';position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);width:55%;height:2px;background:rgba(255,107,26,.5);filter:blur(3px);border-radius:2px;}
@keyframes ember-run{0%{background-position:200% 0;}100%{background-position:0% 0;}}
/* ══ FX4: Odometer ══ */
.hs-v.odometer{display:inline-flex;align-items:center;overflow:hidden;height:1.2em;vertical-align:middle;}
.odo-digit-wrap{height:1.2em;overflow:hidden;display:inline-block;vertical-align:top;}
.odo-reel{display:flex;flex-direction:column;animation:odo-spin var(--odo-dur,1s) cubic-bezier(.17,.67,.3,1) var(--odo-delay,0s) both;}
.odo-d{height:1.2em;display:flex;align-items:center;justify-content:center;}
@keyframes odo-spin{0%{transform:translateY(0);}100%{transform:translateY(var(--odo-target,0px));}}
/* ══ FX5: Fire Border Cards ══ */
@property --fire-angle{syntax:'<angle>';inherits:true;initial-value:0deg;}
.sc{position:relative;isolation:isolate;}
.sc::before{content:'';position:absolute;inset:-1px;border-radius:15px;background:conic-gradient(from var(--fire-angle,0deg),transparent 0deg,#ff1500 55deg,#ff6b1a 80deg,#ffcc00 92deg,#ff4500 105deg,transparent 130deg);opacity:0;transition:opacity .35s;z-index:-1;animation:fire-border-rotate 2.5s linear infinite paused;}
.sc::after{content:'';position:absolute;inset:1px;background:rgba(17,17,17,.97);border-radius:13px;z-index:-1;}
.sc:hover::before{animation-play-state:running;opacity:1;}
.card{position:relative;isolation:isolate;}
.card::before{content:'';position:absolute;inset:-1px;border-radius:15px;background:conic-gradient(from var(--fire-angle,0deg),transparent 0deg,#ff1500 55deg,#ff6b1a 80deg,#ffcc00 92deg,#ff4500 105deg,transparent 130deg);opacity:0;transition:opacity .35s;z-index:-1;animation:fire-border-rotate 2.5s linear infinite paused;}
.card::after{content:'';position:absolute;inset:1px;background:rgba(17,17,17,.97);border-radius:13px;z-index:-1;}
.card:hover::before{animation-play-state:running;opacity:1;}
@keyframes fire-border-rotate{0%{--fire-angle:0deg;}100%{--fire-angle:360deg;}}

/* ══ NUEVO HEADER: Timeline + Panel + Grid5 ══ */
@keyframes glow-h1{0%{box-shadow:0 0 4px rgba(57,255,110,.5);}100%{box-shadow:0 0 9px rgba(57,255,110,.9);}}
@keyframes glow-h2{0%{box-shadow:0 0 3px rgba(255,160,32,.4);}100%{box-shadow:0 0 8px rgba(255,160,32,.85);}}
@keyframes glow-h3{0%{box-shadow:0 0 3px rgba(255,107,26,.4);}100%{box-shadow:0 0 7px rgba(255,107,26,.75);}}
@keyframes pulse-cursor{0%{opacity:.8;box-shadow:0 0 4px rgba(255,107,26,.6);}100%{opacity:1;box-shadow:0 0 8px rgba(255,200,0,.9),0 0 14px rgba(255,69,0,.4);}}
#hdr-tl{margin-bottom:12px;}
/* Fila hitos */
#hdr-tl-hitos{position:relative;height:34px;}
.hdr-tl-track{position:absolute;left:6px;right:6px;top:20px;height:3px;background:rgba(255,255,255,.06);border-radius:2px;}
.hdr-tl-fill{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:linear-gradient(90deg,#39ff6e,#ffa020 65%,#ff6b1a);}
.hdr-tl-node{position:absolute;top:50%;transform:translate(-50%,-50%);}
.hdr-tl-dot{width:10px;height:10px;border-radius:50%;border:2px solid #0d0d0d;}
.hdr-tl-lbl{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);white-space:nowrap;font-family:var(--fh);font-weight:700;font-size:11px;}
/* Fila cursor peso actual */
#hdr-tl-cursor{position:relative;height:26px;margin-top:2px;}
.hdr-cursor-track{position:absolute;left:6px;right:6px;top:50%;transform:translateY(-50%);height:1px;background:rgba(255,107,26,.08);border-radius:1px;}
.hdr-cursor{position:absolute;top:50%;transform:translate(-50%,-50%);}
.hdr-cursor-body{
  display:flex;align-items:center;gap:3px;
  background:rgba(255,107,26,.1);border:1px solid rgba(255,107,26,.3);
  border-radius:5px;padding:2px 6px;
  font-family:var(--fh);font-weight:900;font-size:12px;color:#ff6b1a;
  white-space:nowrap;
  animation:pulse-cursor 1.6s ease-in-out infinite alternate;
}
.hdr-cursor-arrow{
  position:absolute;top:-5px;left:50%;transform:translateX(-50%);

}
/* Panel + grid */
#hdr-main{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;}
#hdr-arc{flex:0 0 auto;}
#hdr-arc svg{transform:rotate(-90deg);}
.hdr-arc-wrap{position:relative;width:68px;height:68px;}
.hdr-arc-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
.hdr-arc-skull{font-size:30px;position:absolute;opacity:.30;filter:blur(.5px) drop-shadow(0 0 5px rgba(255,160,32,.5));transform:translateY(2px);}
.hdr-arc-pct{font-family:var(--fh);font-weight:900;font-size:17px;position:relative;z-index:1;line-height:1;}
.hdr-arc-lbl{font-family:var(--fm);font-size:6px;letter-spacing:1px;text-transform:uppercase;position:relative;z-index:1;margin-top:1px;opacity:.6;}
.hdr-arc-rem{font-family:var(--fh);font-weight:700;font-size:9px;position:relative;z-index:1;opacity:.65;margin-top:1px;}
#hdr-panel{flex:1;display:flex;flex-direction:column;gap:4px;}
.hdr-stat{display:flex;align-items:baseline;justify-content:space-between;padding:3px 7px;border-left:2px solid rgba(255,69,0,.3);background:rgba(255,69,0,.04);}
.hdr-stat-k{font-family:var(--fm);font-size:7.5px;color:#ff450077;text-transform:uppercase;letter-spacing:1px;}
.hdr-stat-v{font-family:var(--fh);font-weight:800;font-size:15px;}
#hdr-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:rgba(255,69,0,.1);border:1px solid rgba(255,69,0,.15);border-radius:8px;overflow:hidden;}
.hdr-g5{background:var(--bg);padding:6px 3px;text-align:center;}
.hdr-g5v{font-family:var(--fh);font-weight:800;font-size:13px;line-height:1;}
.hdr-g5l{font-family:var(--fm);font-size:6px;color:#ff450055;text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
@keyframes arc-pulse-h1{0%{filter:drop-shadow(0 0 3px rgba(57,255,110,.5));}100%{filter:drop-shadow(0 0 8px rgba(57,255,110,.9));}}
@keyframes arc-pulse-h2{0%{filter:drop-shadow(0 0 3px rgba(255,160,32,.4));}100%{filter:drop-shadow(0 0 8px rgba(255,160,32,.8));}}

/* ══ IDEA 1: Tabs con iconos Lucide ══ */
.tb{flex-direction:column;align-items:center;gap:2px;padding:6px 8px;}
.tb-icon{width:13px;height:13px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:filter .2s;flex-shrink:0;}
.tb.on .tb-icon{filter:drop-shadow(0 0 5px var(--a1));}

/* ══ IDEA 5: Botón guardar shimmer ══ */
.bp{position:relative;overflow:hidden;}
.bp::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 0%,rgba(255,150,50,.12) 50%,transparent 100%);background-size:200% 100%;animation:bp-shimmer 2.8s linear infinite;pointer-events:none;}
@keyframes bp-shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
/* ══ IDEA 6: Podio Records ══ */
.podium-wrap{display:flex;align-items:flex-end;justify-content:center;gap:6px;margin-bottom:14px;padding:0 8px;}
.podium-col{display:flex;flex-direction:column;align-items:center;gap:3px;}
.podium-bar{border-radius:5px 5px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:7px 4px 4px;width:88px;}
.podium-medal{font-size:14px;line-height:1;}
.podium-val{font-family:var(--fh);font-weight:900;font-size:16px;line-height:1;margin-top:3px;text-align:center;}
.podium-sub{font-family:var(--fm);font-size:7px;color:rgba(255,255,255,.4);text-align:center;margin-top:2px;}
.podium-date{font-family:var(--fm);font-size:7px;color:#555;text-transform:uppercase;letter-spacing:.5px;text-align:center;margin-top:4px;}
.podium-list{display:flex;flex-direction:column;gap:3px;}
.podium-list-row{display:flex;align-items:center;gap:8px;padding:5px 8px;background:rgba(255,255,255,.02);border-radius:7px;}
.podium-list-rank{font-family:var(--fm);font-size:9px;color:#444;min-width:16px;}
.podium-list-val{font-family:var(--fh);font-weight:700;font-size:14px;flex:1;}
.podium-list-date{font-family:var(--fm);font-size:8px;color:#555;}
/* ══ IDEA 8: Dona Zonas FC ══ */
.fc-zone-wrap{display:flex;gap:12px;align-items:center;margin-top:10px;}
.fc-donut{position:relative;flex:0 0 auto;width:72px;height:72px;}
.fc-donut svg{transform:rotate(-90deg);}
.fc-donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
.fc-donut-pct{font-family:var(--fh);font-weight:900;font-size:14px;line-height:1;}
.fc-donut-lbl{font-family:var(--fm);font-size:5px;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;margin-top:1px;}
.fc-legend{display:flex;flex-direction:column;gap:3px;flex:1;}
.fc-leg-row{display:flex;align-items:center;gap:5px;}
.fc-leg-dot{width:7px;height:7px;border-radius:2px;flex:0 0 auto;}
.fc-leg-name{font-family:var(--fm);font-size:7px;color:var(--muted);flex:1;text-transform:uppercase;letter-spacing:.5px;}
.fc-leg-pct{font-family:var(--fh);font-weight:700;font-size:11px;}
/* ══ IDEA 9: Monitor ergómetro rower ══ */
.ergo-monitor{background:#000;border:1px solid rgba(57,255,110,.2);border-radius:10px;padding:10px;margin-top:8px;}
.ergo-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.ergo-metric{text-align:center;flex:1;}
.ergo-val{font-family:var(--fm);font-size:18px;font-weight:700;line-height:1;}
.ergo-unit{font-family:var(--fm);font-size:6px;color:#2a5a2a;letter-spacing:1px;text-transform:uppercase;margin-top:2px;}
.ergo-sep{width:1px;background:rgba(57,255,110,.1);height:32px;}
.ergo-bar-bg{background:rgba(57,255,110,.05);border:1px solid rgba(57,255,110,.1);border-radius:3px;height:4px;overflow:hidden;margin-bottom:6px;}
.ergo-bar-fill{height:100%;background:linear-gradient(90deg,#22c55e,#39ff6e);border-radius:3px;}
.ergo-footer{display:flex;justify-content:space-between;font-family:var(--fm);font-size:6px;color:#1a3a1a;text-transform:uppercase;letter-spacing:.5px;}

/* ══ SPLASH SCREEN ══ */
#splash{
  position:fixed;inset:0;z-index:99999;
  background:#050505;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;user-select:none;
  transition:none;
}
#splash-bg{
  position:absolute;inset:0;
  background-image:var(--splash-bg);
  background-size:cover;background-position:center top;
  opacity:.15;pointer-events:none;
}
#splash .sp-particles{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
#splash .sp-particle{position:absolute;width:2px;height:6px;background:linear-gradient(180deg,transparent,#ff6b1a);border-radius:50% 50% 0 0;animation:hf-rise var(--dur,3s) linear var(--delay,0s) infinite;left:var(--x,50%);bottom:0;opacity:.9;box-shadow:0 0 5px 1px rgba(255,69,0,.7);}
#splash .sp-particle.big{width:3px;height:9px;background:linear-gradient(180deg,transparent,#ffaa20);box-shadow:0 0 8px 2px rgba(255,150,0,.6);}
#splash .sp-particle.tiny{width:1px;height:4px;background:linear-gradient(180deg,transparent,#ff8800);}
#splash-logo{
  position:relative;z-index:2;
  display:flex;flex-direction:column;align-items:center;
  animation:hellfire-glow 3s ease-in-out infinite alternate,hellfire-flicker 6s linear infinite;
  margin-bottom:18px;
}
#splash-divider{
  position:relative;z-index:2;
  width:80px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,107,26,.5),transparent);
  margin-bottom:12px;
}
#splash-sub{
  position:relative;z-index:2;
  font-family:'DoomRight2';font-size:15px;letter-spacing:4px;text-transform:uppercase;
  background:linear-gradient(180deg,#ffa020,#ff6b1a);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  opacity:.85;margin-bottom:28px;
}
#splash-tap{
  position:relative;z-index:2;
  display:flex;align-items:center;gap:12px;
  animation:splash-pulse 2s ease-in-out infinite;
}
@keyframes splash-pulse{0%,100%{opacity:.5;transform:scale(1);}50%{opacity:1;transform:scale(1.04);}}
.splash-dot{width:6px;height:6px;border-radius:50%;background:#ff6b1a;box-shadow:0 0 8px rgba(255,107,26,.8);}
#splash-tap-txt{
  font-family:var(--fm);font-size:11px;letter-spacing:3px;text-transform:uppercase;
  color:rgba(255,107,26,.7);
}
/* ── Portal Doom transition ── */
#splash-ring{
  position:absolute;top:50%;left:50%;z-index:4;
  width:100px;height:100px;
  transform:translate(-50%,-50%) scale(0);
  border-radius:50%;border:3px solid #ff4500;
  pointer-events:none;opacity:0;
}
@keyframes portal-ring{
  0%  {transform:translate(-50%,-50%) scale(0);opacity:1;border-color:#ff4500;}
  60% {transform:translate(-50%,-50%) scale(2.5);opacity:.6;border-color:#ff6b1a;}
  100%{transform:translate(-50%,-50%) scale(5);opacity:0;border-color:transparent;}
}
@keyframes portal-iris{
  0%  {clip-path:circle(100% at 50% 50%);}
  100%{clip-path:circle(0% at 50% 50%);}
}
#splash.closing #splash-ring{animation:portal-ring .9s ease-out forwards;}
#splash.closing{animation:portal-iris 1.2s cubic-bezier(.7,0,.3,1) .1s forwards;}


#sidebar-col{width:50px;height:100%;overflow:hidden;flex-shrink:0;position:relative;}#sidebar-col.sb-open{width:190px;box-shadow:4px 0 20px rgba(0,0,0,.6);}

.sb-group-lbl{font-family:var(--fm);font-size:6px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;padding:10px 14px 3px;opacity:0;transition:opacity .12s;white-space:nowrap;border-top:1px solid var(--border);margin-top:2px;}

#sidebar-col.sb-open .sb-txt{opacity:1;}
#tabs{display:none!important;}
#topbar{display:flex;flex-direction:column;align-items:center;padding:18px 0 14px;background:linear-gradient(180deg,rgba(255,107,26,.12) 0%,transparent 100%);border-bottom:1px solid rgba(255,107,26,.2);flex-shrink:0;position:relative;text-align:center;width:100%;}
#theme-toggle{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:4px 10px;color:var(--text);font-size:12px;font-family:var(--fm);cursor:pointer;backdrop-filter:blur(4px);}
.doom-title{display:flex;flex-direction:column;align-items:center;gap:0;margin-bottom:8px;}
.doom-word{font-family:'DoomRight2';font-size:64px;text-transform:uppercase;letter-spacing:4px;line-height:1;background:linear-gradient(180deg,#fff3e0 0%,#ffcc80 20%,#ff6b1a 55%,#ff2020 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.doom-sub{font-family:'DoomRight2';font-size:18px;text-transform:uppercase;letter-spacing:3px;margin-top:2px;background:linear-gradient(180deg,#ffa020 0%,#ff6b1a 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;opacity:0.85;}
.top-sub{font-family:var(--fm);font-size:11px;color:var(--muted);letter-spacing:.5px;margin-bottom:12px;}
#hdr-tl{width:100%;padding:0 16px;box-sizing:border-box;margin-bottom:12px;}
#hdr-tl-hitos{position:relative;height:34px;width:100%;}
#hdr-tl-cursor{position:relative;height:26px;margin-top:2px;width:100%;}
.stabs{display:flex;gap:0;margin-bottom:12px;border-bottom:1px solid var(--border);position:relative;overflow-x:auto;}.stabs::-webkit-scrollbar{display:none;}
.stab-slider{position:absolute;bottom:0;height:2px;background:var(--a1);border-radius:1px;transition:left .2s,width .2s;box-shadow:0 0 8px var(--a1),0 0 16px rgba(255,106,0,.4);z-index:2;}
.stb{flex:none;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--muted);padding:6px 10px 0;font-family:var(--fm);font-size:7px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;transition:color .15s;}

.stb.on{color:var(--a1);text-shadow:0 0 10px rgba(255,106,0,.8);}.stb.on .stb-ico{filter:drop-shadow(0 0 6px rgba(255,106,0,.9));}

/* ══ WIZARD REGISTRO ══════════════════════════════════════════════ */
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;700;900&family=DM+Mono:wght@400;500&display=swap');
:root{
  --a1:#ff6b1a;--a2:#ff2020;--a3:#39ff6e;--a4:#ffa020;--a5:#ff4500;
  --bg:#080808;--card:#111;--border:rgba(255,255,255,.07);
  --muted:#333;--muted2:#666;--text:#e8f0fe;
  --fh:'Barlow Condensed',sans-serif;--fm:'DM Mono',monospace;
  --ih:48px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:var(--fh);height:100vh;overflow:hidden;}
#wz{position:fixed;inset:0;display:flex;flex-direction:column;}

/* header */
.wz-hdr{padding:14px 18px 12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);flex-shrink:0;}
.wz-back{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.04);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px;color:var(--muted2);}
.wz-ttl{flex:1;font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--muted2);}
.wz-num{font-family:var(--fm);font-size:9px;color:var(--muted);letter-spacing:1px;}
.wz-bar{height:2px;background:rgba(255,255,255,.04);flex-shrink:0;}
.wz-fill{height:100%;background:var(--a1);box-shadow:0 0 8px var(--a1);transition:width .4s cubic-bezier(.4,0,.2,1);}

/* body */
.wz-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:22px 18px 0;scrollbar-width:none;}
.wz-body::-webkit-scrollbar{display:none;}
.s-title{font-size:34px;font-weight:900;letter-spacing:1px;line-height:1;margin-bottom:4px;}
.s-sub{font-family:var(--fm);font-size:8px;color:var(--muted2);letter-spacing:.5px;margin-bottom:22px;}

/* footer */
.wz-ftr{padding:14px 18px 28px;flex-shrink:0;border-top:1px solid var(--border);background:var(--bg);}
.btn-go{width:100%;padding:17px;border-radius:13px;background:linear-gradient(135deg,rgba(255,69,0,.18),rgba(255,107,26,.32));border:1px solid var(--a1);font-family:var(--fh);font-size:17px;font-weight:900;letter-spacing:4px;text-transform:uppercase;color:var(--a1);cursor:pointer;transition:all .2s;box-shadow:0 0 20px rgba(255,107,26,.08);}
.btn-go:active{transform:scale(.98);}
.btn-go:disabled{opacity:.25;cursor:not-allowed;}
.btn-go.save{background:linear-gradient(135deg,rgba(57,255,110,.12),rgba(57,255,110,.22));border-color:var(--a3);color:var(--a3);}

/* calendario */
.cal-nav{display:flex;align-items:center;margin-bottom:14px;}
.cal-btn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.04);border:1px solid var(--border);font-size:20px;color:var(--muted2);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.cal-mon{flex:1;text-align:center;font-size:16px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-dn{font-family:var(--fm);font-size:7px;color:var(--muted);text-align:center;padding:3px 0 6px;letter-spacing:.5px;}
.cal-d{height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:#252525;transition:all .15s;}
.cal-d.ok{color:var(--muted2);cursor:pointer;}
.cal-d.ok:active{background:rgba(255,255,255,.06);}
.cal-d.sel{background:var(--a1);color:#000;box-shadow:0 0 10px rgba(255,107,26,.35);}
.cal-d.tod{border:1px solid rgba(255,107,26,.3);color:var(--a1);}
.cal-d.tod.sel{color:#000;}
.selected-date{text-align:center;margin:18px 0 8px;font-size:42px;font-weight:900;color:var(--a1);letter-spacing:2px;text-shadow:0 0 24px rgba(255,107,26,.25);}
.selected-date span{font-size:14px;color:var(--muted2);font-weight:400;letter-spacing:3px;display:block;margin-top:2px;}

/* tipos actividad */
.act-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px;}
.act-btn{border-radius:16px;padding:18px 8px 14px;background:var(--card);border:2px solid var(--border);cursor:pointer;text-align:center;transition:all .2s;position:relative;}
.act-btn.sel{border-color:var(--a1);background:rgba(255,107,26,.07);}
.act-ico{font-size:26px;display:block;margin-bottom:8px;}
.act-nm{font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted2);}
.act-btn.sel .act-nm{color:var(--a1);}
.act-chk{position:absolute;top:8px;right:8px;width:18px;height:18px;border-radius:50%;background:var(--a1);display:none;align-items:center;justify-content:center;font-size:10px;color:#000;font-weight:900;}
.act-btn.sel .act-chk{display:flex;}

/* subtipos */
.sub-lbl{font-family:var(--fm);font-size:8px;color:var(--muted2);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;}
.pill{padding:8px 16px;border-radius:99px;background:var(--card);border:1px solid var(--border);font-size:13px;font-weight:700;letter-spacing:1px;color:var(--muted2);cursor:pointer;transition:all .15s;}
.pill.sel{background:rgba(255,107,26,.1);border-color:var(--a1);color:var(--a1);}

/* fields */
.fg{margin-bottom:18px;}
.fg-ttl{font-family:var(--fm);font-size:7px;color:var(--muted2);letter-spacing:2px;text-transform:uppercase;padding-bottom:10px;border-bottom:1px solid var(--border);margin-bottom:10px;}
.frow{display:flex;gap:8px;margin-bottom:8px;}
.fc{flex:1;background:var(--card);border:1px solid var(--border);border-radius:13px;padding:13px 13px 11px;cursor:pointer;transition:all .18s;position:relative;min-width:0;}
.fc::after{content:'◎';position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:13px;color:rgba(255,255,255,.07);}
.fc.filled{border-color:rgba(255,107,26,.22);}
.fc.filled::after{color:rgba(255,107,26,.18);}
.fc-lbl{font-family:var(--fm);font-size:7px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:5px;}
.fc-val{font-size:26px;font-weight:700;color:#252525;line-height:1;display:flex;align-items:baseline;gap:4px;}
.fc-val.v{color:var(--a1);}

function _serializeData(){
  let nl = '\n';
  let ss = 'const SS=[' + nl + sessions.map(function(s){ return '  '+JSON.stringify(s); }).join(','+nl) + nl + '];';
  let sw = 'const SW=[' + nl + weights.map(function(w){ return '  '+JSON.stringify(w); }).join(','+nl) + nl + '];';
  let ds = 'const DAILY_STEPS=[' + nl + DAILY_STEPS.map(function(d){ return '  '+JSON.stringify(d); }).join(','+nl) + nl + '];';
  let kr = 'const KCAL_RECORDS={' + nl + Object.keys(KCAL_RECORDS).map(function(k){ return '  \"'+k+'\":'+JSON.stringify(KCAL_RECORDS[k]); }).join(','+nl) + nl + '};';
  // Caché de logros — leer desde localStorage (ya actualizado por checkAchievementUnlocks)
  let seen=[]; let lvl=0; let tiers=[];
  try {
    seen  = JSON.parse(localStorage.getItem('ach_seen')       || '[]');
    lvl   = parseInt(localStorage.getItem('ach_lvl')          || '0');
    tiers = JSON.parse(localStorage.getItem('ach_tiers_seen') || '[]');
  } catch(e) {}
  let achSeen  = 'const ACH_SEEN='  + JSON.stringify(seen)  + ';';
  let achLvl   = 'const ACH_LVL='   + lvl                   + ';';
  let achTiers = 'const ACH_TIERS_SEEN=' + JSON.stringify(tiers) + ';';
  return {ss:ss, sw:sw, ds:ds, kr:kr, achSeen:achSeen, achLvl:achLvl, achTiers:achTiers};
}


function _injectData(html){
  let d = _serializeData();
  html = html.replace(/const SS=\[[\s\S]*?\];/, d.ss);
  html = html.replace(/const SW=\[[\s\S]*?\];/, d.sw);
  html = html.replace(/const DAILY_STEPS=\[[\s\S]*?\];/, d.ds);
  html = html.replace(/const KCAL_RECORDS=\{[\s\S]*?\};/, d.kr);
  html = html.replace(/const ACH_SEEN=\[[\s\S]*?\];/, d.achSeen);
  html = html.replace(/const ACH_LVL=\d+;/, d.achLvl);
  html = html.replace(/const ACH_TIERS_SEEN=\[[\s\S]*?\];/, d.achTiers);
  return html;
}

function _triggerDownload(html){
  let blob = new Blob([html], {type:'text/html;charset=utf-8'});
  let a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'index.html';
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
  }, 100);
}

function _downloadWithSource(source){
  _triggerDownload(_injectData(source));
}

function _downloadFromDOM(){
  let html = '<!DOCTYPE html>' + '\n' + document.documentElement.outerHTML;
  _triggerDownload(_injectData(html));

function fd(m){
  if(!m&&m!==0)return'—';
  let totalSec=Math.round(parseFloat(m)*60);
  let h=Math.floor(totalSec/3600);
  let min=Math.floor((totalSec%3600)/60);
  let sec=totalSec%60;
  if(h>0) return sec>0?`${h}h ${min}m ${sec}s`:`${h}h ${min}m`;
  return sec>0?`${min}m ${sec}s`:`${min}m`;
}
function fdr(d){if(!d&&d!==0)return'';if(d>120){let m=Math.floor(d/60),s=d%60;return s?(m+'m '+String(s).padStart(2,'0')+'s'):(m+'m');}return fd(d);}
function pace(d,di){if(!d||!di)return null;let s=(d*60)/di;return`${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}`;}
function fdate(d){return new Date(d+'T12:00:00').toLocaleDateString('es-MX',{weekday:'short',day:'numeric',month:'short',year:'numeric'});}

function tots(arr){
  let n=arr.length,dur=arr.reduce((a,s)=>a+(s.duration||0),0),dist=arr.reduce((a,s)=>a+(s.distance||0),0);
  let cal=arr.reduce((a,s)=>a+(calAdj(s)||0),0),steps=arr.reduce((a,s)=>a+(s.steps||0),0);
  let ps=arr.filter(s=>s.duration&&s.distance).map(s=>(s.duration*60)/s.distance);
  let aps=ps.length?ps.reduce((a,b)=>a+b,0)/ps.length:0;
  let ap=aps?`${Math.floor(aps/60)}:${String(Math.round(aps%60)).padStart(2,'0')}`:'—';
  let as=n?(arr.reduce((a,s)=>a+(s.speedAvg||0),0)/n).toFixed(1):'—';
  let ah=n?Math.round(arr.reduce((a,s)=>a+(s.hrAvg||0),0)/n):'—';
  return{n,dur,dist,cal,steps,ap,as,ah};
}

function fcZone(hr){
  if(!hr)return null;
  return FC_ZONES.find(z=>hr>=z.min&&hr<=z.max)||FC_ZONES[FC_ZONES.length-1];
}
function fatBurnPct(hr){
  if(!hr)return null;
  let p=hr/185; // % of FC max
  // Interpolate linearly within each zone for more precise estimation
  if(p<0.50)return 90;
  if(p<0.60)return Math.round(90-(p-0.50)/0.10*5);   // 90→85
  if(p<0.70)return Math.round(85-(p-0.60)/0.10*20);  // 85→65
  if(p<0.80)return Math.round(65-(p-0.70)/0.10*15);  // 65→50
  if(p<0.90)return Math.round(50-(p-0.80)/0.10*15);  // 50→35
  if(p<1.00)return Math.round(35-(p-0.90)/0.10*20);  // 35→15
  return 15;
}
function fatBurnData(s){
  let pct=fatBurnPct(s.hrAvg);
  if(!pct||!s.calories)return null;
  let calW=calAdj(s);
  let calT=s.totalCalories||0;
  let fatCalW=Math.round(calW*(pct/100));
  let fatGW=Math.round(fatCalW/9);
  let fatCalT=calT?Math.round(calT*(pct/100)):null;
  let fatGT=fatCalT?Math.round(fatCalT/9):null;
  return{pct,fatCalW,fatGW,fatCalT,fatGT};
}
function fatBurnDataDay(daySessions){
  let totalW=0,totalHR=0,totalCalW=0;
  daySessions.forEach(function(s){
    totalHR+=s.hrAvg*s.duration;totalW+=s.duration;totalCalW+=(hasAdj(s)?calAdj(s):s.calories);
    if(s.rower){totalHR+=s.rower.hrAvg*s.rower.duration;totalW+=s.rower.duration;totalCalW+=s.rower.calories;}
  });
  let avgHR=totalW>0?Math.round(totalHR/totalW):0;
  let pct=fatBurnPct(avgHR);
  if(!pct||!totalCalW)return null;
  let fatCalW=Math.round(totalCalW*(pct/100));
  let fatGW=Math.round(fatCalW/9);
  let totalCal=daySessions[0]?daySessions[0].totalCalories:null;
  let fatCalT=totalCal?Math.round(totalCal*(pct/100)):null;
  let fatGT=fatCalT?Math.round(fatCalT/9):null;
  return{pct:pct,fatCalW:fatCalW,fatGW:fatGW,fatCalT:fatCalT,fatGT:fatGT};
}

function metBase(speed){
  // Base MET por velocidad promedio de caminata (km/h)
  if(speed<=3.4)return 3.3;
  if(speed<=3.5)return 3.4;
  if(speed<=3.6)return 3.5;
  if(speed<=3.7)return 3.6;
  if(speed<=3.9)return 3.8;
  if(speed<=4.0)return 4.0;
  return 4.1;
}
function calAdj(s){
  if(!s.calories)return s.calories;
  if(s.calMET)return s.calMET;
  if(isExt(s)||s.rowerOnly)return s.calories;
  if(!s.incline||s.incline===0)return s.calories;
  let w=wForDate(s.date)||90;
  let met=metBase(s.speedAvg)+(s.incline*0.3);
  return Math.round(met*w*(s.duration/60));
}
function hasAdj(s){return !isExt(s)&&!s.rowerOnly&&s.incline&&s.incline>0;}

function checkPR(s){
  let others=sessions.filter(function(x){return x.id!==s.id;});
  let tread=others.filter(function(x){return !isExt(x)&&!x.rowerOnly;});
  let rowerOthers=others.filter(function(x){return !!x.rower;});
  let prs=[];
  function maxOf(arr,fn){return arr.length?Math.max.apply(null,arr.map(fn)):0;}

  // ── Treadmill / walking records ──
  if(!isExt(s)&&!s.rowerOnly){
    if(s.distance>0&&s.distance>maxOf(tread,function(x){return x.distance||0;}))
      prs.push('Distancia: '+s.distance+' km');
    if(s.speedAvg>0&&s.speedAvg>maxOf(tread,function(x){return x.speedAvg||0;}))
      prs.push('Velocidad: '+s.speedAvg+' km/h');
    if(s.duration>0&&s.duration>maxOf(tread,function(x){return x.duration||0;}))
      prs.push('Duración: '+s.duration+' min');
    if(s.incline>0&&s.incline>maxOf(tread,function(x){return x.incline||0;}))
      prs.push('Inclinacion: '+s.incline+'%');
    if(s.calories>0&&s.calories>maxOf(tread,function(x){return x.calories||0;}))
      prs.push('Calorías: '+s.calories+' cal');
    if(s.steps>0&&s.steps>maxOf(tread,function(x){return x.steps||0;}))
      prs.push('Pasos: '+s.steps.toLocaleString());
  }

  // ── Rower records ──
  if(s.rower){
    let r=s.rower;
    if(r.duration>0&&r.duration>maxOf(rowerOthers,function(x){return x.rower.duration||0;}))
      prs.push('Remo duración: '+r.duration+' min');
    if(r.calories>0&&r.calories>maxOf(rowerOthers,function(x){return x.rower.calories||0;}))
      prs.push('Remo calorías: '+r.calories+' cal');
    if(r.resistance>0&&r.resistance>maxOf(rowerOthers,function(x){return x.rower.resistance||0;}))
      prs.push('Resistencia remo: '+r.resistance);
    if(r.rows>0&&r.rows>maxOf(rowerOthers,function(x){return x.rower.rows||0;}))
      prs.push('Rows: '+r.rows);
    if(r.rowerDist>0&&r.rowerDist>maxOf(rowerOthers,function(x){return x.rower.rowerDist||0;}))
      prs.push('Distancia remo: '+r.rowerDist+' km');
  }

  if(prs.length>0) _eventQueue.push({type:'pr', data:prs});
  setTimeout(checkAchievementUnlocks, 300);
}

function getStreaks(){
  let dates=[...new Set(sessions.map(s=>s.date))].sort();
  if(!dates.length)return{cur:0,max:0,lastDate:null};
  let cur=1,max=1,tmp=1;
  for(let i=1;i<dates.length;i++){
    let a=new Date(dates[i-1]+'T12:00:00'),b=new Date(dates[i]+'T12:00:00');
    let diff=(b-a)/(1000*60*60*24);
    if(diff===1){tmp++;max=Math.max(max,tmp);}else tmp=1;
  }
  let today=new Date();today.setHours(12,0,0,0);
  let last=new Date(dates[dates.length-1]+'T12:00:00');
  let diffToday=(today-last)/(1000*60*60*24);
  if(diffToday<=1){
    cur=1;
    for(let i=dates.length-2;i>=0;i--){
      let a=new Date(dates[i]+'T12:00:00'),b=new Date(dates[i+1]+'T12:00:00');
      if((b-a)/(1000*60*60*24)===1)cur++;else break;
    }
  }else{cur=0;}
  return{cur,max,lastDate:dates[dates.length-1]};
}
function weekSessions(offsetWeeks=0){
  let now=new Date();
  let day=now.getDay();
  let monday=new Date(now);monday.setDate(now.getDate()-((day+6)%7)-offsetWeeks*7);monday.setHours(0,0,0,0);
  let sunday=new Date(monday);sunday.setDate(monday.getDate()+6);sunday.setHours(23,59,59,999);
  return sessions.filter(s=>{let d=new Date(s.date+'T12:00:00');return d>=monday&&d<=sunday;});
}
function weightTrend(){
  if(weights.length<2)return null;
  let n=Math.min(weights.length,5);
  let recent=weights.slice(-n);
  let days=(new Date(recent[n-1].date+'T12:00:00')-new Date(recent[0].date+'T12:00:00'))/(1000*60*60*24);
  if(days===0)return null;
  let kgPerDay=(recent[n-1].weight-recent[0].weight)/days;
  return kgPerDay;
}
// ── calMET Rower por resistencia ─────────────────────────────────
function rowMetBase(resistance){
  if(!resistance) return 3.5;
  if(resistance <= 3)  return 3.5;
  if(resistance <= 5)  return 4.0;
  if(resistance <= 8)  return 4.5;
  if(resistance <= 11) return 5.0;
  if(resistance <= 14) return 5.5;
  if(resistance <= 17) return 6.0;
  return 6.5;
}
function rowCalMET(s){
  if(!s||!s.rower) return 0;
  let r = s.rower;
  let dur = r.duration > 120 ? Math.round(r.duration/60) : r.duration;
  let peso = wForDate(s.date) || 90;
  return Math.round(rowMetBase(r.resistance) * peso * (dur/60));
}

// ── Calorías totales día ajustadas ────────────────────────────────
// Formula:
//   totalCalories (reloj)
//   - cal_TM_reloj  + calMET_TM
//   - cal_Row_reloj + calMET_Row
//   + cal_Ext_reloj (si hubo exterior ese día)
function calTotalAdj(daySessions){
  let tcSess = daySessions.find(function(s){ return s.totalCalories; });
  if(!tcSess) return null;
  let base = tcSess.totalCalories;

  daySessions.forEach(function(s){
    if(isExt(s)) return; // exterior: dejar del reloj
    if(!s.rowerOnly){
      // TM: reemplazar cal reloj por calMET
      let calReloj = s.calories || 0;
      let calMet   = hasAdj(s) ? calAdj(s) : s.calories;
      base = base - calReloj + calMet;
    }
    // Rower: reemplazar cal reloj por calMET
    if(s.rower){
      let rowReloj = s.rower.calories || 0;
      let rowMet   = rowCalMET(s);
      base = base - rowReloj + rowMet;
    }
  });

  // Sumar exterior si hubo
  let hasExt = daySessions.some(function(s){ return isExt(s); });
  if(hasExt){
    let extCal = daySessions.filter(function(s){ return isExt(s); })
      .reduce(function(a,s){ return a + (s.calories||0); }, 0);
    base += extCal;
  }

  return Math.round(base);
}

// Swipe gesture for sidebar
(function(){
  let THRESHOLD = 40;  // min px to trigger
  let EDGE_ZONE = 30;  // px from left edge to start open gesture
  let startX = null, startY = null, target = null;

  document.addEventListener('touchstart', function(e){
    let t = e.touches[0];
    startX = t.clientX;
    startY = t.clientY;
    target = e.target;
  }, {passive:true});

  document.addEventListener('touchend', function(e){
    if(startX === null) return;
    let t = e.changedTouches[0];
    let dx = t.clientX - startX;
    let dy = t.clientY - startY;
    // Must be more horizontal than vertical
    if(Math.abs(dx) < THRESHOLD || Math.abs(dy) > Math.abs(dx)) { startX=null; return; }
    let sbc = document.getElementById('sidebar-col');
    let isOpen = sbc && sbc.classList.contains('sb-open');
    // Swipe right from left edge → open
    if(dx > 0 && !isOpen && startX < EDGE_ZONE) {
      sbc.classList.add('sb-open');
    }
    // Swipe left while open → close
    else if(dx < 0 && isOpen) {
      sbc.classList.remove('sb-open');
    }
    startX = null;
  }, {passive:true});
})();
function stbSlide(){

    if(!bar||!sl)return;

  },0);
}

function wzEditConfirmar(){
  let fecha = WZ_EDIT.fecha;

  // 1. Guardar peso si marcado
  let editPeso = document.getElementById('wz-edit-peso');
  if(editPeso && editPeso.checked){
    let val = parseFloat(document.getElementById('wz-edit-peso-val').value);
    if(!isNaN(val) && val > 0){
      weights = [...weights.filter(w=>w.date!==fecha), {date:fecha, weight:val}].sort((a,b)=>a.date.localeCompare(b.date));
      saveW();
    }
  }

  // 2. Guardar comida si marcado
  let editComida = document.getElementById('wz-edit-comida');
  if(editComida && editComida.checked){
    let kcal  = parseFloat(document.getElementById('ec-kcal').value)||0;
    let prot  = parseFloat(document.getElementById('ec-prot').value)||0;
    let carbs = parseFloat(document.getElementById('ec-carbs').value)||0;
    let fat   = parseFloat(document.getElementById('ec-fat').value)||0;
    let existing = KCAL_RECORDS[fecha]||{};
    KCAL_RECORDS[fecha] = Object.assign(existing, {kcal,prot,carbs,fat});
  }

  // 3. Ver si hay sesiones seleccionadas para editar o nueva actividad
  let checkboxes = document.querySelectorAll('.wz-edit-sess:checked');
  let nuevaAct   = document.getElementById('wz-edit-nueva');
  let sessIds    = Array.from(checkboxes).map(c=>c.dataset.id);

  if(sessIds.length === 0 && !(nuevaAct && nuevaAct.checked)){
    // Solo peso/comida — guardar y cerrar
    saveS();
    downloadUpdatedIndex();
    toast('✅ Datos actualizados');
    let wz = document.getElementById('wz');
    if(wz) wz.remove();
    switchTab('Historial');
    return;
  }

  // 4. Si hay sesiones o nueva actividad — lanzar wizard pre-poblado
  if(nuevaAct && nuevaAct.checked){
    // Nuevo registro para esa fecha
    wzResetState(fecha);
  } else {
    // Pre-poblar con primera sesión seleccionada
    let s = sessions.find(sess=>sess.id===sessIds[0]);
    if(s){
      let r = s.rower||{};
      wzResetState(s.date);
      WZ_STATE.tipos = s.rower ? (s.duration?['tm','row']:['row']) : ['tm'];
      WZ_STATE.subtipos = s.type==='endurance'?['endurance']:(s.inclineProfile?['simulacion']:[]);
      WZ_STATE.dur=s.duration||null; WZ_STATE.dist=s.distance||null;
      WZ_STATE.velAvg=s.speedAvg||null; WZ_STATE.velMax=s.speedMax||null;
      WZ_STATE.incline=s.incline||null; WZ_STATE.fcAvg=s.hrAvg||null; WZ_STATE.fcMax=s.hrMax||null;
      WZ_STATE.cal=s.calories||null; WZ_STATE.calTotal=s.totalCalories||null;
      WZ_STATE.steps=s.steps||null; WZ_STATE.calReloj=s.calReloj||null;
      WZ_STATE.inclineProfile=s.inclineProfile||[];
      WZ_STATE.rowDur=r.duration||null; WZ_STATE.rowDist=r.rowerDist||null;
      WZ_STATE.rowRes=r.resistance||null; WZ_STATE.rowRows=r.rows||null;
      WZ_STATE.rowFc=r.hrAvg||null; WZ_STATE.rowCal=r.calories||null;
      WZ_STATE._editId=s.id;
    }
  }

  let ftr = document.querySelector('.wz-ftr'); if(ftr) ftr.style.display='';
  let back = document.getElementById('btnBack'); if(back) back.style.opacity='1';
  wzRender();
}


function upPace(){

  let di=parseFloat(document.getElementById('fdi')?.value)||0;
  let el=document.getElementById('fpc');if(!el)return;
  if(d>0&&di>0){el.style.display='block';el.innerHTML=`🕐 Pace: <strong>${pace(d,di)} min/km</strong>`;}
  else el.style.display='none';
}
function upRower(){
  let chk=document.getElementById('frow');
  let fields=document.getElementById('rower-fields');
  let kcalDiv=document.getElementById('rower-kcal');
  if(!chk||!fields||!kcalDiv)return;
  fields.style.display=chk.checked?'flex':'none';
  if(!chk.checked){kcalDiv.style.display='none';return;}
  let dur=parseFloat(document.getElementById('frdu')?.value)||0;
  let hr=parseFloat(document.getElementById('frhr')?.value)||0;
  if(dur>0&&hr>0){
    // Get weight from last registered weight entry
    let dateVal=document.getElementById('fd')?.value;
    let w=dateVal?wForDate(dateVal):null;
    let peso=w?w.weight:97;
    let kcal=calcRowerKcal(hr,dur,peso);
    kcalDiv.style.display='block';
    kcalDiv.innerHTML='🔥 Calorías calculadas: <strong>'+kcal+' kcal</strong>'
      +'<span style="color:rgba(34,197,94,.6);font-size:10px;margin-left:6px">'
      +'(FC '+hr+' bpm · '+dur+' min · '+peso+' kg)</span>';

  }
}
function gv(id){let e=document.getElementById(id);return e?e.value:'';}
function saveSession(){
  let dt=gv('fd');if(!dt||!gv('fdu'))return;
  let n=x=>x!==''&&x!=null?Number(x):null;
  let s={id:editId||Date.now().toString(),date:dt,duration:n(gv('fdu')),distance:n(gv('fdi')),calories:n(gv('fc')),totalCalories:n(gv('ftc')),steps:n(gv('fst')),hrAvg:n(gv('fhr')),hrMax:n(gv('fhrm')),speedAvg:n(gv('fsp')),speedMax:n(gv('fspm')),incline:n(gv('fin')),note:gv('fn')||undefined,elevGain:n(gv('feg')),elevLow:n(gv('fel')),elevHigh:n(gv('feh')),ascent:n(gv('fas')),descent:n(gv('fde'))};
  // Rower section
  let rowChk=document.getElementById('frow');
  let rowDur=n(gv('frdu'));let rowHr=n(gv('frhr'));let rowRes=n(gv('frres'));
  if(rowChk&&rowChk.checked&&rowDur&&rowHr){
    let w=wForDate(dt);let peso=w?w.weight:97;
    let kcal=calcRowerKcal(rowHr,rowDur,peso);
    let rowOrigKcal=n(gv('frorigkcal'))||null;
    s.rower={duration:rowDur,hrAvg:rowHr,resistance:rowRes||null,calories:rowOrigKcal};
  }
  if(editId){sessions=sessions.map(x=>x.id===editId?s:x);editId=null;}
  else{sessions=[...sessions,s].sort((a,b)=>a.date.localeCompare(b.date));checkPR(s);}
  saveS();toast();render();
  setTimeout(checkAchievementUnlocks,500);
}

// Vista Comparativa TM vs Exterior
function _histComparativa(){

  let ext=sessions.filter(function(s){return isExt(s)&&s.distance>0;});
  function avg(arr,k){if(!arr.length)return 0;return arr.reduce(function(a,s){return a+(s[k]||0);},0)/arr.length;}
  let metrics=[
    {label:'Vel. promedio', unit:'km/h', t:avg(tread,'speedAvg').toFixed(2), e:avg(ext,'speedAvg').toFixed(2), icon:'⚡'},
    {label:'FC promedio',   unit:'bpm',  t:avg(tread,'hrAvg').toFixed(0),    e:avg(ext,'hrAvg').toFixed(0),    icon:'❤️'},
    {label:'Calorías/sesión',unit:'cal', t:avg(tread,'calories').toFixed(0), e:avg(ext,'calories').toFixed(0), icon:'🔥'},
    {label:'Distancia prom.',unit:'km',  t:avg(tread,'distance').toFixed(2), e:avg(ext,'distance').toFixed(2), icon:'📏'},
    {label:'Duración prom.', unit:'min', t:avg(tread,'duration').toFixed(0), e:avg(ext,'duration').toFixed(0), icon:'⏱'},
  ];
  let totalDistT=tread.reduce(function(a,s){return a+(s.distance||0);},0).toFixed(1);
  let totalDistE=ext.reduce(function(a,s){return a+(s.distance||0);},0).toFixed(1);

  let html='<div style="display:flex;flex-direction:column;gap:10px">'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px">'
    +'<div style="background:rgba(255,107,26,.1);border:1px solid rgba(255,107,26,.3);border-radius:12px;padding:12px;text-align:center">'
      +'<div style="font-family:var(--fh);font-size:11px;color:var(--muted);letter-spacing:1px;margin-bottom:4px">CAMINADORA</div>'
      +'<div style="font-family:var(--fh);font-size:22px;font-weight:900;color:var(--a1)">'+tread.length+'</div>'
      +'<div style="font-size:10px;color:var(--muted);font-family:var(--fm)">sesiones · '+totalDistT+' km</div></div>'
    +'<div style="background:rgba(57,255,110,.08);border:1px solid rgba(57,255,110,.25);border-radius:12px;padding:12px;text-align:center">'
      +'<div style="font-family:var(--fh);font-size:11px;color:var(--muted);letter-spacing:1px;margin-bottom:4px">EXTERIOR</div>'
      +'<div style="font-family:var(--fh);font-size:22px;font-weight:900;color:#39ff6e">'+ext.length+'</div>'
      +'<div style="font-size:10px;color:var(--muted);font-family:var(--fm)">sesiones · '+totalDistE+' km</div></div>'
    +'</div>';

  metrics.forEach(function(m){
    let tv=parseFloat(m.t), ev=parseFloat(m.e);
    let tWins=tv>ev, tie=tv===ev;
    let tCol=tWins?'var(--a1)':(tie?'var(--muted)':'#666');
    let eCol=(!tWins&&!tie)?'#39ff6e':(tie?'var(--muted)':'#666');
    html+='<div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px">'
      +'<div style="font-size:10px;color:var(--muted);font-family:var(--fm);margin-bottom:8px">'+m.icon+' '+m.label+'</div>'
      +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'
        +'<div style="text-align:center"><div style="font-family:var(--fh);font-size:20px;font-weight:900;color:'+tCol+'">'+m.t+'</div><div style="font-size:9px;color:var(--muted);font-family:var(--fm)">'+m.unit+' · CAMINADORA</div></div>'
        +'<div style="text-align:center"><div style="font-family:var(--fh);font-size:20px;font-weight:900;color:'+eCol+'">'+m.e+'</div><div style="font-size:9px;color:var(--muted);font-family:var(--fm)">'+m.unit+' · EXTERIOR</div></div>'
      +'</div></div>';
  });
  return html+'</div>';
}

// HISTORIAL
function rHist(){
  let allDates=[...new Set([...sessions].reverse().map(function(s){return s.date;}))];

  if(hSub==='Comparativa'){
    return '<div style="display:flex;flex-direction:column;gap:11px">'+_histTabsHTML()+_histComparativa()+'</div>';
  }

  let filteredDates=allDates.filter(function(date){
    let ds=sessions.filter(function(s){return s.date===date;});
    if(hSub==='General')    return true;
    if(hSub==='Treadmill')  return ds.some(function(s){return !isExt(s);});
    if(hSub==='Exterior')   return ds.some(function(s){return isExt(s);});
    if(hSub==='Rower')      return ds.some(function(s){return !!s.rower;});
    if(hSub==='Plank')      return ds.some(function(s){return !!s.plank;});
    if(hSub==='Simulacion') return ds.some(function(s){return !!s.inclineProfile;});
    return true;
  });

  return '<div style="display:flex;flex-direction:column;gap:11px">'
    +_histTabsHTML()
    +(filteredDates.length===0
      ?'<div class="empty">No hay sesiones.</div>'
      :filteredDates.map(function(date){
          let daySessions=sessions.filter(function(s){return s.date===date;});
          return rDayCard(date,daySessions);
        }).join(''))
  +'</div>';
}

function rDayCard(date, daySessions){
  // Clasificar sesiones del día
  let tmSessions  = daySessions.filter(function(s){return !isExt(s)&&!s.rowerOnly;});
  let extSessions = daySessions.filter(function(s){return isExt(s);});
  let rowerSession= daySessions.find(function(s){return !!s.rower;});
  let simSessions = daySessions.filter(function(s){return !!s.inclineProfile;});
  let isSim       = (hSub==='Simulacion');

  // Visibilidad por sub-tab
  // En sub-tab Simulacion, tmSessions se filtra para excluir sims (evitar duplicado)
  let tmNoSim   = isSim ? tmSessions.filter(function(s){return !s.inclineProfile;}) : tmSessions;
  let showTM    = (hSub==='General'||hSub==='Treadmill'||isSim) && tmNoSim.length>0;
  let showExt   = (hSub==='General'||hSub==='Exterior') && extSessions.length>0;
  let showRower = (hSub==='General'||hSub==='Rower'||isSim) && !!rowerSession;
  let plankSession = daySessions.find(function(s){ return !!s.plank; });
  let showPlank = (hSub==='General'||hSub==='Plank') && !!plankSession;
  let showSim   = isSim && simSessions.length>0;
  let showTotal = (hSub==='General');

  let w = wForDate(date);
  let totalDurAll = daySessions.reduce(function(a,s){
    return a+s.duration+(s.rower?(function(d){return d>120?Math.round(d/60):d;})(s.rower.duration):0);
  },0);
  let totalCalAll = daySessions.reduce(function(a,s){
    return a+(hasAdj(s)?calAdj(s):s.calories)+(s.rower?s.rower.calories:0);
  },0);

  // ── Banner cabecera del día ──
  let typeLabels=[];
  if(tmSessions.length>0)  typeLabels.push('<svg class="ico-sm" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg> Treadmill');
  // Exterior va en badges, no en typeLabels
  if(rowerSession)          typeLabels.push('<svg class="ico-sm" viewBox="0 0 24 24"><path d="M3 17l4-8 4 4 4-4 4 8"/><circle cx="12" cy="5" r="2"/></svg> Rower');

  let badges='';
  // Badge Exterior — primero para que aparezca antes que los subtipos
  if(extSessions.length>0) badges+='<span style="display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:2px 8px;font-family:var(--fm);font-size:8px;border:1px solid rgba(245,158,11,.35);background:rgba(245,158,11,.08);color:#f59e0b"><svg class="ico-sm" viewBox="0 0 24 24"><path d="M13 4v6l2 5v5h-3v-4h-4v4H5v-5l2-5V4"/><circle cx="12" cy="2" r="1"/></svg> Exterior</span>';
  daySessions.forEach(function(s){
    if(!!s.inclineProfile) badges+='<span style="display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:2px 8px;font-family:var(--fm);font-size:8px;border:1px solid rgba(251,146,60,.3);background:rgba(251,146,60,.08);color:#fb923c">Simulación</span>';
    if(s.type==='endurance') badges+='<span style="display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:2px 8px;font-family:var(--fm);font-size:8px;border:1px solid rgba(255,107,26,.3);background:rgba(255,107,26,.08);color:var(--a1)">Endurance</span>';
  });
  if(rowerSession) badges+='<span style="display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:2px 8px;font-family:var(--fm);font-size:8px;border:1px solid rgba(34,197,94,.35);background:rgba(34,197,94,.1);color:#22c55e"><svg class="ico-sm" viewBox="0 0 24 24"><path d="M3 17l4-8 4 4 4-4 4 8"/><circle cx="12" cy="5" r="2"/></svg> Rower</span>'
    +'<span style="display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:2px 8px;font-family:var(--fm);font-size:8px;border:1px solid rgba(168,85,247,.35);background:rgba(168,85,247,.1);color:#a855f7">🧘 Plank</span>';

  let banner='<div style="background:linear-gradient(135deg,rgba(255,107,26,.14),rgba(255,69,0,.05));padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.05)">'
    +'<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">'
    +'<div><div class="sd">&#128197; '+fdate(date)+'</div>'
    +'<div class="sm">&#9201; '+fd(totalDurAll)+' &middot; '+typeLabels.join(' + ')+'</div></div>'
    +(w?'<div style="background:rgba(255,107,26,.12);border:1px solid rgba(255,107,26,.25);border-radius:8px;padding:4px 10px;text-align:center;flex-shrink:0"><div style="font-family:var(--fh);font-weight:900;font-size:18px;color:var(--a1);line-height:1">'+w+'</div><div style="font-family:var(--fm);font-size:7px;color:var(--muted)">kg</div></div>':'')
    +'</div>'
    +(badges?'<div style="display:flex;flex-wrap:wrap;gap:5px">'+badges+'</div>':'')
    +'</div>';

  // ── Bloques izquierdo (sesiones) y derecho (totales) ──
  let leftBlocks='', rightBlocks='';
  if(showTM)    leftBlocks += tmNoSim.map(function(s){return rSessionBlock(s);}).join('');
  if(showExt)   leftBlocks += extSessions.map(function(s){return rSessionBlock(s);}).join('');
  // Sim: solo mostrar en sub-tab Simulacion (en General ya están incluidas en tmSessions)
  if(isSim)     leftBlocks += simSessions.map(function(s){return rSessionBlock(s);}).join('');
  if(showRower) leftBlocks += rRowerBlock(rowerSession,w);
  if(showPlank) leftBlocks += rPlankBlock(plankSession);
  if(showTotal) rightBlocks += _dayTotals(date, daySessions, totalDurAll, totalCalAll);

  let bodyStyle = (leftBlocks&&rightBlocks)
    ? 'display:grid;grid-template-columns:1fr 1fr;'
    : 'display:flex;flex-direction:column;';

  return '<div style="background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.07);border-radius:20px;overflow:hidden;margin-bottom:12px">'
    +banner
    +'<div style="'+bodyStyle+'">'
    +(leftBlocks?'<div style="padding:10px 8px;border-right:'+(rightBlocks?'1px solid rgba(255,255,255,.05)':'none')+';display:flex;flex-direction:column;gap:8px;">'+leftBlocks+'</div>':'')
    +(rightBlocks?'<div style="padding:10px 8px;display:flex;flex-direction:column;gap:8px;">'+rightBlocks+'</div>':'')
    +'</div>'
    +'</div>';
}

// ── Helper: panel "Totales día" ───────────────────────────────────
function _dayTotals(date, daySessions, totalDurAll, totalCalAll) {
  let kcalDay = KCAL_RECORDS[date];
  let totalHRAll=0, totalHRWeight=0;
  daySessions.forEach(function(s){
    if(s.hrAvg){totalHRAll+=s.hrAvg*s.duration; totalHRWeight+=s.duration;}
    if(s.rower){totalHRAll+=s.rower.hrAvg*s.rower.duration; totalHRWeight+=s.rower.duration;}
  });
  let avgFC = totalHRWeight>0 ? Math.round(totalHRAll/totalHRWeight) : 0;
  let tcSess = daySessions.find(function(s){return s.totalCalories;});
  let dSteps = DAILY_STEPS.find(function(d){return d.date===date;});
  let fbDay  = fatBurnDataDay(daySessions);

  let html = '<div style="background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);border-radius:13px;padding:12px 13px;">'
    +'<div style="font-family:var(--fm);font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:9px;opacity:.85">'
    +'<svg class="ico-sm" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg> Totales d\xeda</div>'
    +_dayRow('Tiempo total', fd(totalDurAll), '', 'var(--text)')
    +(avgFC ? _dayRow('FC prom. pond.', avgFC, 'bpm', 'var(--a2)') : '')
    +(tcSess ? _dayRow('Cal. totales d\xeda<br>(reloj)', tcSess.totalCalories.toLocaleString(), 'kcal', 'var(--muted)') : '')
    +(function(){
        let adj = calTotalAdj(daySessions);
        return adj!==null ? _dayRow('Cal. totales d\xeda<br>(ajustadas)', adj.toLocaleString(), 'kcal', 'var(--a4)') : '';
      })()
    +_dayRow('Cal. MET workout', totalCalAll, 'kcal', 'var(--a4)')
    +(dSteps ? _dayRow('Pasos del d\xeda', dSteps.steps.toLocaleString(), '', 'var(--a3)') : '')
    +(kcalDay ? _dayRow('Consumidas (comida)', kcalDay.kcal, 'kcal', '#c084fc') : '')
    +((function(){
        let adj = calTotalAdj(daySessions);
        let base = adj !== null ? adj : (tcSess ? tcSess.totalCalories : null);
        if(!kcalDay || base===null) return '';
        let bal = base - kcalDay.kcal;
        return _dayRow('Balance del d\xeda<br>(ajustado)',
          (bal>0?'+':'')+bal, 'kcal',
          bal>=0?'var(--a3)':'var(--a2)');
      })());

  if(fbDay){
    html += '<div style="height:1px;background:rgba(255,255,255,.05);margin:8px 0"></div>'
      +'<div style="font-family:var(--fm);font-size:8px;color:#f472b6;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px;opacity:.8">'

// ── Helper: bloque de inclinación ────────────────────────────────
function _sessionIncline(s) {
  if(s.inclineProfile){
    let avg = Math.round(s.inclineProfile.reduce(function(a,t){return a+(t.pct*(t.to-t.from));},0)/s.distance*10)/10;
    let rows2 = s.inclineProfile.map(function(t){
      return '<div style="display:flex;justify-content:space-between;padding:4px 6px;border-radius:5px;background:rgba(255,255,255,.03);margin-bottom:3px">'
        +'<span style="font-family:var(--fm);font-size:9px;color:var(--muted)">'+t.from+' \u2013 '+t.to+' km</span>'
        +'<span style="font-family:var(--fh);font-weight:700;font-size:14px;color:var(--a5)">'+t.pct+'%</span>'
        +'</div>';
    }).join('');
    let block = (s.note&&!!s.inclineProfile)
      ? _dayRow('Nombre ruta', '<span style="font-family:var(--fh);font-weight:700;font-size:11px;color:var(--a5)">'+s.note+'</span>', '', 'var(--a5)')
      : '';
    return block
      +_dayRow('Inclin. promedio', '~'+avg+' <span style="font-size:10px;color:var(--muted)">%</span>', '', 'var(--a5)')
      +'<div style="font-family:var(--fm);font-size:9px;color:var(--a5);cursor:pointer;margin-bottom:4px" onclick="event.stopPropagation();let e=document.getElementById(\'ip-'+s.id+'\');e.style.display=e.style.display==\'none\'?\'block\':\'none\'">'
        +'\ud83d\uddfa Perfil de inclinaci\xf3n &#9662;'
      +'</div>'
      +'<div id="ip-'+s.id+'" style="display:none;background:rgba(0,0,0,.5);border:1px solid rgba(255,107,26,.25);border-radius:8px;padding:8px 10px;margin-bottom:4px">'
        +'<div style="font-family:var(--fm);font-size:8px;color:var(--a1);letter-spacing:1px;margin-bottom:6px">Perfil inclinaci\xf3n</div>'
        +rows2
      +'</div>';
  }
  if(s.incline!=null){
    return _dayRow('Inclinaci\xf3n', s.incline, '%', 'var(--a5)');
  }
  return '';
}

      +'<button onclick="startDel(\''+s.id+'\')" style="background:rgba(255,32,32,.08);border:1px solid rgba(255,32,32,.2);border-radius:8px;cursor:pointer;font-size:11px;padding:3px 6px;color:var(--a2)"><svg style="display:inline;width:11px;height:11px;vertical-align:middle;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></button>'

function rPlankBlock(s){
  if(!s||!s.plank) return '';
  let p = s.plank;
  let mm = Math.floor(p.duration||0);
  let ss = Math.round(((p.duration||0)-mm)*60);
  let durStr = mm>0 ? mm+'m'+(ss>0?' '+ss+'s':'') : ss+'s';
  return '<div style="background:rgba(168,85,247,.08);border:1px solid rgba(168,85,247,.25);border-radius:13px;padding:12px 13px;margin-top:8px">'

    +_dayRow('Duración', durStr, '', '#a855f7')
    +'</div>';
}

function rRowerBlock(s){

// PROGRESO
function rStepsMeta(){
  let total=DAILY_STEPS.length;
  let met=DAILY_STEPS.filter(d=>d.steps>=STEPS_GOAL).length;
  let pct=Math.round((met/total)*100);
  let streak=((arr)=>{let c=0;for(let i=arr.length-1;i>=0;i--){if(arr[i].steps>=STEPS_GOAL)c++;else break;}return c;})(DAILY_STEPS);
  let avg=Math.round(DAILY_STEPS.reduce((a,d)=>a+d.steps,0)/total);
  let maxS=Math.max(...DAILY_STEPS.slice(-10).map(x=>x.steps));
  let bars=DAILY_STEPS.slice(-10).map(d=>{
    let h=Math.min(100,Math.round((d.steps/maxS)*100));
    let ok=d.steps>=STEPS_GOAL;
    return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px"><div style="width:100%;height:'+h+'%;background:'+(ok?'var(--a3)':'var(--a2)')+';border-radius:3px 3px 0 0;min-height:4px"></div></div>';
  }).join('');
  let labels=DAILY_STEPS.slice(-10).map(d=>'<div style="flex:1;text-align:center;font-family:var(--fm);font-size:7px;color:var(--muted)">'+d.date.slice(5)+'</div>').join('');
  let streakHtml=streak>0?'<div style="margin-top:8px;font-family:var(--fm);font-size:9px;color:var(--a3)">🔥 Racha actual: '+streak+' días consecutivos con meta cumplida</div>':'';
  return `<div class="card" style="border-color:rgba(57,255,110,.2)">
    <div style="color:var(--a3);font-family:var(--fm);font-size:9px;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">👟 Meta de pasos diarios — ${STEPS_GOAL.toLocaleString()} pasos</div>
    <div class="g3" style="margin-bottom:12px">
      <div class="sm2"><div class="sl2">Días con meta</div><div class="sv" style="color:var(--a3)">${met}/<span style="color:var(--muted);font-size:11px">${total}</span></div></div>
      <div class="sm2"><div class="sl2">% cumplimiento</div><div class="sv" style="color:var(--a3)">${pct}%</div></div>
      <div class="sm2"><div class="sl2">Promedio diario</div><div class="sv" style="color:var(--a1)">${avg.toLocaleString()}</div></div>
    </div>
    <div style="color:var(--muted);font-family:var(--fm);font-size:9px;margin-bottom:6px">Últimos 10 días</div>
    <div style="display:flex;gap:4px;align-items:flex-end;height:50px">${bars}</div>
    <div style="display:flex;justify-content:space-between;margin-top:4px">${labels}</div>
    ${streakHtml}
  </div>`;
}

    let bdColors=d.colorFn?data.map(s=>d.colorFn(s)):d.color;
    let datasets=[{data:d.data,backgroundColor:bgColors,borderColor:bdColors,borderWidth:d.type==='line'?2:0,borderRadius:d.type==='bar'?4:0,pointRadius:d.type==='line'?3:0,pointHoverRadius:5,fill:d.type==='line'?{target:'origin',above:d.color+'18'}:false,tension:0.3,spanGaps:true}];
    if(d.trendline&&d.data.filter(x=>x!=null).length>1){
      let vals=d.data.map((v,i)=>({x:i,y:v})).filter(p=>p.y!=null);
      let n=vals.length,sx=vals.reduce((a,p)=>a+p.x,0),sy=vals.reduce((a,p)=>a+p.y,0);
      let sxy=vals.reduce((a,p)=>a+p.x*p.y,0),sxx=vals.reduce((a,p)=>a+p.x*p.x,0);
      let m=(n*sxy-sx*sy)/(n*sxx-sx*sx||1),b=(sy-m*sx)/n;
      let trendData=d.data.map((_,i)=>parseFloat((m*i+b).toFixed(2)));
      datasets.push({data:trendData,borderColor:'#ffffff55',borderWidth:1.5,borderDash:[4,4],pointRadius:0,fill:false,tension:0,spanGaps:true,label:'Tendencia'});
    }
    charts[d.id]=new Chart(ctx,{
      type:d.type,
      data:{labels:lbl,datasets},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:'#0a0a0a',borderColor:d.color+'44',borderWidth:1}},scales:{x:{grid:{color:'rgba(255,255,255,.05)'},ticks:{maxRotation:45}},y:{grid:{color:'rgba(255,255,255,.05)'},min:d.yMin??undefined,max:d.yMax??undefined}}},
    });
  });
  setTimeout(renderFCHeatmap,0);
}

function rHitoStats(fromDate,toDate){
  let ss=sessions.filter(s=>s.date>=fromDate&&(!toDate||s.date<=toDate));
  if(!ss.length)return null;
  let km=ss.reduce((a,s)=>a+s.distance,0).toFixed(2);
  let mins=ss.reduce((a,s)=>a+s.duration,0);
  let h2=Math.floor(mins/60),m2=mins%60;
  let dur=(h2>0?h2+'h ':'')+m2+'m';
  let avgSpd=(ss.reduce((a,s)=>a+s.speedAvg,0)/ss.length).toFixed(1);
  let incSs=ss.filter(s=>s.incline!=null);
  let avgInc=incSs.length?(incSs.reduce((a,s)=>a+(s.incline||0),0)/incSs.length).toFixed(1):'--';
  return {km,dur,avgSpd,avgInc,n:ss.length};
}

function rHitosHTML(){
  let hitos=[{label:'Hito 1',target:95,icon:'<svg class="ico-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>'},{label:'Hito 2',target:90,icon:'<svg class="ico-sm" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>'},{label:'Hito 3',target:85,icon:'<svg class="ico-sm" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>'}];
  let f=weights[0],l=weights[weights.length-1];
  if(!f||!l)return'';
  let achievedEntries=hitos.map(h=>weights.find(w=>w.weight<=h.target));
  let startDate=new Date(f.date+'T12:00:00');
  return hitos.map((h,idx)=>{
    let cur=l.weight,start=f.weight;
    let tl=start-h.target,lost=start-cur;
    let pct=Math.min(100,Math.max(0,tl>0?(lost/tl)*100:0));
    let reached=cur<=h.target,rem=Math.max(0,cur-h.target).toFixed(2);
    let ae=achievedEntries[idx];
    let aDate=ae?new Date(ae.date+'T12:00:00').toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'}):null;
    let dfs=ae?Math.round((new Date(ae.date+'T12:00:00')-startDate)/(864e5)):null;
    let pe=idx>0?achievedEntries[idx-1]:null;
    let pLabel=idx>0?hitos[idx-1].target+' kg':null;
    let dfp=ae&&pe?Math.round((new Date(ae.date+'T12:00:00')-new Date(pe.date+'T12:00:00'))/(864e5)):null;
    let toDate=ae?ae.date:null;
    let sAll=reached?rHitoStats('2026-03-20',toDate):null;
    let sPrev=reached&&idx>0&&pe?rHitoStats(pe.date,toDate):null;
    let hid='hito-'+idx;
    let isOpen=expHito===hid;
    return '<div class="card" style="border-color:'+(reached?'var(--a3)':'rgba(255,255,255,.08)')+'">'+

        '<div>'+
          '<div style="font-family:var(--fh);font-weight:700;font-size:15px;color:'+(reached?'var(--a3)':'var(--a1)')+'"> '+h.label+' &mdash; '+h.target+' kg</div>'+
          '<div style="font-family:var(--fm);font-size:9px;color:var(--muted)">'+(reached?'&#161;COMPLETADO!':'Faltan '+rem+' kg')+'</div>'+
          (reached&&aDate?
            '<div style="font-family:var(--fm);font-size:9px;color:var(--a3);margin-top:3px"><svg class="ico-sm" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> '+aDate+'</div>'+
            '<div style="font-family:var(--fm);font-size:9px;color:var(--muted);margin-top:2px">Desde 20 mar: <span style="color:var(--a3)">'+dfs+' dias</span>'+(dfp!==null?' &middot; Desde '+pLabel+': <span style="color:var(--a1)">'+dfp+' dias</span>':'')+'</div>'+
            '<div style="font-family:var(--fm);font-size:9px;color:var(--a5);margin-top:2px">'+(isOpen?'&#9650;':'&#9660;')+' Estadisticas</div>'
          :'')+
        '</div></div>'+
        '<div style="font-family:var(--fh);font-weight:800;font-size:22px;color:'+(reached?'var(--a3)':'var(--a1)')+'">'+pct.toFixed(0)+'<span style="font-size:12px;color:var(--muted)">%</span></div>'+
      '</div>'+
      (reached&&isOpen?rHitoStatsBlock(sAll,'Desde 20 mar hasta este hito')+(idx>0?rHitoStatsBlock(sPrev,'Desde hito anterior'):''):'')+

function rPeso(){
  let f=weights[0], l=weights[weights.length-1];

  let dc   = diff<0 ? 'var(--a3)' : 'var(--a2)';
  let today= new Date().toISOString().split('T')[0];
  let trend= weightTrend();
  let TARGET=GOAL_WEIGHT;

  function projDate(kgPerDay, fromWeight, fromDate){
    if(!kgPerDay||kgPerDay>=0||fromWeight<=TARGET) return null;
    let days=Math.round((fromWeight-TARGET)/Math.abs(kgPerDay));
    return new Date(new Date(fromDate+'T12:00:00').getTime()+days*864e5)
      .toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'});
  }

  let projDate_actual= trend&&l&&trend<0 ? projDate(trend,l.weight,l.date) : null;
  let projOpt  = l ? projDate(-0.5/7,l.weight,l.date) : null;
  let projMid  = l ? projDate(-0.3/7,l.weight,l.date) : null;
  let projCons = l ? projDate(-0.15/7,l.weight,l.date) : null;

  // ── IMC ──
  let imcBlock = '';
  if(l){
    let imc=(l.weight/(1.78*1.78)).toFixed(1);
    let cat=imc<18.5?{l:'Bajo peso',c:'#60a5fa'}:imc<25?{l:'Normal',c:'var(--a3)'}

      +'<div style="color:var(--muted);font-family:var(--fm);font-size:9px;margin-top:2px">178 cm · '+l.weight+' kg</div></div>'
